<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iBrawls Animation Editor</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020617;
      --panel: rgba(15, 23, 42, 0.76);
      --panel-strong: rgba(2, 6, 23, 0.88);
      --line: rgba(148, 163, 184, 0.18);
      --line-strong: rgba(56, 189, 248, 0.42);
      --text: #f8fafc;
      --muted: rgba(226, 232, 240, 0.62);
      --faint: rgba(226, 232, 240, 0.38);
      --cyan: #22d3ee;
      --cyan-strong: #06b6d4;
      --amber: #f59e0b;
      --green: #34d399;
      --red: #f87171;
      --radius: 8px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(34, 211, 238, 0.12), transparent 24rem),
        radial-gradient(circle at 78% 12%, rgba(245, 158, 11, 0.09), transparent 22rem),
        var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select,
    input {
      min-height: 34px;
    }

    button {
      border: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.72);
      color: var(--text);
      border-radius: 7px;
      cursor: pointer;
      transition: border-color 120ms ease, background 120ms ease, color 120ms ease, transform 120ms ease;
    }

    button:hover {
      border-color: var(--line-strong);
      background: rgba(14, 116, 144, 0.22);
      color: white;
    }

    button:active {
      transform: translateY(1px);
    }

    button[data-active="true"] {
      border-color: rgba(34, 211, 238, 0.7);
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.32), rgba(8, 145, 178, 0.32));
      color: white;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.16);
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.7);
      color: var(--text);
      border-radius: 7px;
      outline: none;
    }

    select,
    input {
      padding: 7px 9px;
    }

    textarea {
      min-height: 240px;
      padding: 10px;
      resize: vertical;
      color: #bae6fd;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre;
    }

    select:focus,
    input:focus,
    textarea:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.12);
    }

    .app-shell {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100%;
      min-width: 320px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 72px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(34, 211, 238, 0.34);
      border-radius: 8px;
      color: var(--cyan);
      background: rgba(8, 145, 178, 0.12);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-weight: 900;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(19px, 3vw, 28px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .brand span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .topbar-actions a,
    .topbar-actions button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border-radius: 7px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: rgba(15, 23, 42, 0.72);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .workspace {
      display: grid;
      grid-template-columns: 320px minmax(360px, 1fr) 380px;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      padding: 14px;
      border-right: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(18px);
      overflow-y: auto;
    }

    .panel.right {
      border-right: 0;
      border-left: 1px solid var(--line);
    }

    .section {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(2, 6, 23, 0.36);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .section-header small {
      color: var(--faint);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .button-row button {
      flex: 1 1 92px;
      padding: 0 10px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .primary {
      border-color: rgba(34, 211, 238, 0.55);
      background: linear-gradient(180deg, rgba(34, 211, 238, 0.28), rgba(8, 145, 178, 0.24));
      color: white;
    }

    .danger {
      border-color: rgba(248, 113, 113, 0.34);
      color: #fecaca;
      background: rgba(127, 29, 29, 0.24);
    }

    .toggle-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .toggle-row label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.54);
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    .toggle-row input {
      width: auto;
      min-height: 0;
      accent-color: var(--cyan);
    }

    .viewport-shell {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
      background: #020617;
    }

    #viewport {
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    #viewport canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .viewport-hud {
      position: absolute;
      left: 16px;
      top: 16px;
      display: grid;
      gap: 6px;
      max-width: calc(100% - 32px);
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.68);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }

    .viewport-hud strong {
      color: white;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .viewport-hud span {
      color: var(--muted);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
    }

    .timeline-shell {
      display: grid;
      gap: 10px;
      padding: 12px 14px 14px;
      border-top: 1px solid var(--line);
      background: rgba(2, 6, 23, 0.88);
    }

    .timeline-controls {
      display: grid;
      grid-template-columns: auto minmax(160px, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .timeline-controls button {
      min-width: 44px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 900;
    }

    #frameSlider {
      accent-color: var(--cyan);
    }

    .frame-readout {
      min-width: 112px;
      color: var(--cyan);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      font-weight: 900;
      text-align: right;
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(28px, 1fr));
      gap: 5px;
      max-height: 112px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .frame-cell {
      min-height: 26px;
      padding: 0;
      border-radius: 5px;
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 10px;
      font-weight: 900;
      color: rgba(226, 232, 240, 0.6);
      background: rgba(15, 23, 42, 0.85);
    }

    .frame-cell[data-source="keyframe"] {
      border-color: rgba(34, 211, 238, 0.7);
      color: white;
      background: rgba(8, 145, 178, 0.36);
    }

    .frame-cell[data-current="true"] {
      outline: 2px solid white;
      outline-offset: 1px;
    }

    .pose-grid {
      display: grid;
      grid-template-columns: 54px repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: end;
    }

    .axis-label {
      align-self: center;
      color: var(--faint);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pose-grid input {
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }

    .anchor-row,
    .keyframe-row {
      display: grid;
      grid-template-columns: 34px minmax(64px, 1fr) auto auto;
      gap: 7px;
      align-items: center;
    }

    .anchor-row strong,
    .keyframe-row strong {
      display: grid;
      place-items: center;
      min-height: 34px;
      border: 1px solid rgba(34, 211, 238, 0.2);
      border-radius: 7px;
      color: var(--cyan);
      background: rgba(8, 145, 178, 0.1);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 12px;
    }

    .anchor-row button,
    .keyframe-row button {
      min-width: 48px;
      padding: 0 9px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .keyframe-list {
      display: grid;
      gap: 7px;
    }

    .status {
      min-height: 35px;
      padding: 9px 10px;
      border: 1px solid rgba(52, 211, 153, 0.2);
      border-radius: 7px;
      color: rgba(209, 250, 229, 0.88);
      background: rgba(6, 78, 59, 0.18);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.4;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      display: grid;
      gap: 4px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: rgba(15, 23, 42, 0.58);
    }

    .metric span {
      color: var(--faint);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .metric strong {
      color: var(--text);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 13px;
    }

    .segment-info {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: minmax(260px, 300px) minmax(360px, 1fr);
      }

      .panel.right {
        display: none;
      }
    }

    @media (max-width: 820px) {
      html,
      body {
        overflow: auto;
      }

      .app-shell {
        min-height: 100dvh;
        height: auto;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .topbar-actions {
        width: 100%;
        justify-content: stretch;
      }

      .topbar-actions a,
      .topbar-actions button {
        flex: 1 1 140px;
      }

      .workspace {
        display: flex;
        flex-direction: column;
        overflow: visible;
      }

      .panel,
      .panel.right {
        display: flex;
        border: 0;
        border-bottom: 1px solid var(--line);
        overflow: visible;
      }

      .viewport-shell {
        min-height: 62dvh;
      }

      .timeline-controls {
        grid-template-columns: auto minmax(120px, 1fr);
      }

      .frame-readout {
        grid-column: 1 / -1;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">AN</div>
        <div>
          <h1>Animation Editor</h1>
          <span>local frame pose tool</span>
        </div>
      </div>
      <div class="topbar-actions">
        <a href="/">Back to iBrawls</a>
        <button id="downloadJsonButton" type="button">Download JSON</button>
        <button id="copySnippetButton" type="button">Copy TS</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="panel">
        <section class="section">
          <div class="section-header">
            <span>Track</span>
            <small id="trackStatus">ready</small>
          </div>
          <div class="grid-2">
            <label>
              Weapon
              <select id="weaponSelect">
                <option value="hammer">Hammer</option>
                <option value="sword">Sword</option>
              </select>
            </label>
            <label>
              View
              <select id="viewSelect">
                <option value="thirdPerson">Third person</option>
                <option value="firstPerson">First person</option>
              </select>
            </label>
          </div>
          <label>
            Pose track
            <select id="trackSelect"></select>
          </label>
          <label>
            Transform target
            <select id="targetSelect"></select>
          </label>
          <div class="grid-2">
            <label>
              Frames
              <input id="frameCountInput" type="number" min="3" max="96" step="1" value="31" />
            </label>
            <label>
              Interpolation
              <select id="interpolationSelect">
                <option value="smoothstep">Smoothstep</option>
                <option value="linear">Linear</option>
                <option value="easeInOutCubic">Ease in/out</option>
              </select>
            </label>
          </div>
          <div class="button-row">
            <button id="seedButton" type="button">Seed Three Frames</button>
            <button id="generateButton" class="primary" type="button">Generate Missing</button>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <span>Edit</span>
            <small id="transformStatus">translate</small>
          </div>
          <div class="button-row">
            <button id="translateButton" type="button" data-active="true">Move</button>
            <button id="rotateButton" type="button">Rotate</button>
            <button id="setKeyframeButton" class="primary" type="button">Set Keyframe</button>
          </div>
          <div class="toggle-row">
            <label><input id="showSkeletonToggle" type="checkbox" checked /> Bones</label>
            <label><input id="showSocketsToggle" type="checkbox" checked /> Sockets</label>
            <label><input id="showLabelsToggle" type="checkbox" checked /> Labels</label>
          </div>
          <div class="pose-grid" id="poseInputs">
            <span></span>
            <label>X<input id="posXInput" type="number" step="0.01" /></label>
            <label>Y<input id="posYInput" type="number" step="0.01" /></label>
            <label>Z<input id="posZInput" type="number" step="0.01" /></label>
            <span class="axis-label">Pos</span>
            <label>RX<input id="rotXInput" type="number" step="0.01" /></label>
            <label>RY<input id="rotYInput" type="number" step="0.01" /></label>
            <label>RZ<input id="rotZInput" type="number" step="0.01" /></label>
            <span class="axis-label">Rot</span>
          </div>
        </section>

        <section class="section">
          <div class="section-header">
            <span>Three Key Poses</span>
            <small>anchors</small>
          </div>
          <div id="anchorRows"></div>
        </section>

        <section class="section">
          <div class="section-header">
            <span>Keyframes</span>
            <small id="keyframeCount">0</small>
          </div>
          <div class="keyframe-list" id="keyframeList"></div>
        </section>
      </aside>

      <main class="viewport-shell">
        <div id="viewport">
          <div class="viewport-hud">
            <strong id="hudTitle">Hammer / Third person</strong>
            <span id="hudFrame">Frame 0</span>
            <span id="hudPose">pos 0, 0, 0</span>
          </div>
        </div>
        <div class="timeline-shell">
          <div class="timeline-controls">
            <button id="playButton" type="button">Play</button>
            <input id="frameSlider" type="range" min="0" max="30" value="0" />
            <div class="frame-readout" id="frameReadout">Frame 0 / 30</div>
          </div>
          <div id="timeline" class="timeline"></div>
        </div>
      </main>

      <aside class="panel right">
        <section class="section">
          <div class="section-header">
            <span>Export</span>
            <small id="exportStatus">WeaponPose[]</small>
          </div>
          <div class="metric-grid">
            <div class="metric">
              <span>Frames</span>
              <strong id="metricFrames">31</strong>
            </div>
            <div class="metric">
              <span>Keys</span>
              <strong id="metricKeys">3</strong>
            </div>
            <div class="metric">
              <span>Mode</span>
              <strong id="metricMode">smooth</strong>
            </div>
          </div>
          <textarea id="exportText" spellcheck="false"></textarea>
        </section>
        <section class="section">
          <div class="section-header">
            <span>Segment</span>
            <small>delta</small>
          </div>
          <div class="segment-info" id="segmentInfo"></div>
        </section>
        <div class="status" id="statusText">Editor ready.</div>
      </aside>
    </div>
  </div>

  <script type="module" src="/src/tools/animationEditor.ts"></script>
</body>
</html>
