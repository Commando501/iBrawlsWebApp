<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V3 Animation Atlas Smoke</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #061016;
        color: #eef8fb;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        right: 12px;
        display: grid;
        gap: 10px;
        pointer-events: none;
      }

      .panel {
        pointer-events: auto;
        background: rgb(7 16 20 / 86%);
        border: 1px solid rgb(93 214 201 / 35%);
        border-radius: 8px;
        box-shadow: 0 18px 60px rgb(0 0 0 / 28%);
      }

      #topbar {
        display: grid;
        grid-template-columns: minmax(180px, 260px) minmax(150px, 190px) repeat(5, auto) minmax(160px, 1fr);
        align-items: end;
        gap: 8px;
        padding: 10px;
      }

      label {
        display: grid;
        gap: 4px;
        color: #5eead4;
        font: 11px/1.2 "Cascadia Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      button,
      select,
      input[type="number"] {
        min-height: 32px;
        background: #10232b;
        color: #eef8fb;
        border: 1px solid #24414a;
        border-radius: 6px;
        font: 12px/1 "Cascadia Mono", monospace;
      }

      button {
        padding: 0 10px;
        color: #67e8f9;
        cursor: pointer;
      }

      button:hover {
        border-color: #22d3ee;
        color: #ffffff;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #22d3ee;
      }

      #timeline-row {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 0 10px 10px;
      }

      #summary {
        color: #f8fafc;
        font: 12px/1.35 "Cascadia Mono", monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #overlays {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 8px 10px;
        color: #cbd5e1;
        font: 11px/1.2 "Cascadia Mono", monospace;
      }

      #overlays label {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 5px;
        color: #cbd5e1;
        text-transform: none;
        letter-spacing: 0;
      }

      #defect-panel {
        display: grid;
        gap: 8px;
        padding: 10px;
        max-width: 760px;
      }

      #defect-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      #defect-report {
        max-height: 140px;
        overflow: auto;
        margin: 0;
        color: #cbd5e1;
        font: 11px/1.45 "Cascadia Mono", monospace;
        white-space: pre-wrap;
      }

      #view-labels {
        position: fixed;
        left: 8%;
        right: 8%;
        bottom: 18px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        pointer-events: none;
        color: #67e8f9;
        font: 12px/1.2 "Cascadia Mono", monospace;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-align: center;
      }

      @media (max-width: 820px) {
        #topbar {
          grid-template-columns: 1fr 1fr;
        }

        #summary {
          grid-column: 1 / -1;
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="atlas-canvas"></canvas>
    <div id="hud">
      <div id="topbar" class="panel">
        <label>
          Animation
          <select id="animation-select" aria-label="Animation Selector"></select>
        </label>
        <label>
          Carry
          <select id="carry-weapon" aria-label="Carry Weapon Selector">
            <option value="">Hidden</option>
            <option value="hammer">Hammer</option>
            <option value="sword">Sword</option>
            <option value="pistol">Pistol</option>
          </select>
        </label>
        <button id="play-all" type="button">Play All</button>
        <button id="play-pause" type="button">Play</button>
        <button id="reset" type="button">Reset</button>
        <button id="frame-prev" type="button">Frame -</button>
        <button id="frame-next" type="button">Frame +</button>
        <span id="summary">V3 Animation Atlas Smoke preparing...</span>
      </div>
      <div id="timeline-row" class="panel">
        <label>
          Mode
          <select id="mode" aria-label="Normalized Runtime Mode Toggle">
            <option value="normalizedReview" selected>Normalized Review</option>
            <option value="runtimeSimulation">Runtime Simulation</option>
          </select>
        </label>
        <label>
          Timeline
          <input id="timeline" type="range" min="0" max="120" value="0" />
        </label>
        <label>
          Speed
          <input id="speed" type="number" min="0.1" max="4" step="0.1" value="1" />
        </label>
      </div>
      <div id="overlays" class="panel">
        <label><input id="loop" type="checkbox" checked /> Loop</label>
        <label><input id="bounds-overlay" type="checkbox" /> Model Bounds</label>
        <label><input id="floor-overlay" type="checkbox" checked /> Foot Floor Contact</label>
        <label><input id="weapon-overlay" type="checkbox" /> Weapon Grip Drift</label>
        <label><input id="isolation-overlay" type="checkbox" /> Upper/Lower Isolation</label>
        <label><input id="slot-continuity-overlay" type="checkbox" /> Slot Continuity</label>
      </div>
      <div id="defect-panel" class="panel">
        <div id="defect-actions">
          <label><input id="show-defects" type="checkbox" /> Show Defects</label>
          <button id="copy-defect-report" type="button">Copy Defect Report</button>
          <button id="download-defect-report" type="button">Download Defect Report</button>
        </div>
        <pre id="defect-report" hidden>Defect Report hidden. Enable Show Defects to measure the selected case.</pre>
      </div>
    </div>
    <div id="view-labels" aria-hidden="true">
      <span>Front</span>
      <span>Left Profile</span>
      <span>Rear</span>
      <span>Right Profile</span>
    </div>
    <script type="module" src="/src/tools/v3AnimationAtlasSmokePage.ts"></script>
  </body>
</html>
