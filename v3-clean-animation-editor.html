<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V3 Clean Rig Animation Editor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #061014;
        --panel: rgb(8 20 26 / 92%);
        --panel-soft: rgb(14 32 40 / 82%);
        --line: rgb(96 204 202 / 28%);
        --line-strong: rgb(103 232 249 / 62%);
        --text: #eef8fb;
        --muted: #a8c8cf;
        --cyan: #67e8f9;
        --amber: #facc15;
        --red: #fb7185;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: 12px/1.2 "Cascadia Mono", monospace;
      }

      button,
      select,
      input {
        min-height: 30px;
        border: 1px solid #24414a;
        border-radius: 6px;
        background: #10232b;
        color: var(--text);
      }

      button {
        padding: 0 9px;
        color: var(--cyan);
        cursor: pointer;
      }

      button:hover,
      select:focus,
      input:focus,
      textarea:focus {
        border-color: var(--line-strong);
        outline: none;
      }

      button.active {
        border-color: var(--cyan);
        background: #14333b;
        color: var(--text);
      }

      label {
        display: grid;
        gap: 4px;
        color: var(--cyan);
        font: 10px/1.2 "Cascadia Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 7px;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: auto;
      }

      textarea {
        min-height: 220px;
        resize: vertical;
        background: #071014;
        color: #cbd5e1;
        border: 1px solid #24414a;
        border-radius: 6px;
        white-space: pre;
      }

      #app {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        width: 100%;
        height: 100%;
      }

      #topbar {
        display: grid;
        grid-template-columns: minmax(220px, auto) repeat(9, auto) minmax(220px, 1fr);
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-bottom: 1px solid var(--line);
        background: rgb(5 13 18 / 94%);
      }

      #topbar h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0.02em;
      }

      #status {
        grid-column: -1;
        justify-self: end;
        color: var(--muted);
        font: 11px/1.35 "Cascadia Mono", monospace;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #workspace {
        display: grid;
        grid-template-columns: 340px minmax(360px, 1fr) 380px;
        min-height: 0;
      }

      .panel {
        display: grid;
        align-content: start;
        gap: 10px;
        min-height: 0;
        padding: 10px;
        overflow: auto;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }

      .panel.right {
        border-right: 0;
        border-left: 1px solid var(--line);
      }

      .section {
        display: grid;
        gap: 9px;
        padding: 10px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .section-title {
        margin: 0;
        color: var(--text);
        font: 700 11px/1.2 "Cascadia Mono", monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toggle-row label {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
      }

      .mini-status {
        color: var(--muted);
        font: 11px/1.35 "Cascadia Mono", monospace;
      }

      #dirty-indicator.dirty {
        color: var(--amber);
      }

      #viewport-wrap {
        position: relative;
        min-width: 0;
        min-height: 0;
        background: #030b0f;
      }

      #editor-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #viewport-label {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: var(--muted);
        font: 11px/1.4 "Cascadia Mono", monospace;
        pointer-events: none;
      }

      #dope-sheet {
        display: grid;
        gap: 6px;
        padding: 8px;
        border: 1px solid #24414a;
        border-radius: 6px;
        background: #071014;
      }

      .dope-row {
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        min-height: 24px;
        color: var(--muted);
        font: 10px/1.2 "Cascadia Mono", monospace;
      }

      .dope-track {
        position: relative;
        height: 22px;
        border: 1px solid #1d3841;
        border-radius: 4px;
        background: linear-gradient(90deg, rgb(103 232 249 / 10%), rgb(250 204 21 / 8%));
      }

      .dope-key,
      .loop-marker {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 18px;
        min-height: 0;
        padding: 0;
        transform: translate(-50%, -50%);
        border-radius: 3px;
      }

      .dope-key {
        background: var(--cyan);
        border-color: var(--cyan);
      }

      .dope-key.active {
        background: var(--amber);
        border-color: var(--amber);
      }

      .loop-marker {
        z-index: 2;
        background: transparent;
        border-color: var(--amber);
        color: var(--amber);
      }

      #keyframe-list {
        max-height: 140px;
        overflow: auto;
        border: 1px solid #24414a;
        border-radius: 6px;
        padding: 6px;
        color: var(--muted);
        font: 11px/1.45 "Cascadia Mono", monospace;
      }

      #validation {
        min-height: 34px;
        color: var(--muted);
        font: 11px/1.4 "Cascadia Mono", monospace;
        white-space: pre-wrap;
      }

      .validation-item {
        width: 100%;
        height: auto;
        min-height: 30px;
        padding: 7px;
        text-align: left;
        white-space: normal;
      }

      .validation-item.error {
        border-color: rgb(251 113 133 / 75%);
        color: #fecdd3;
      }

      .validation-item.warning {
        border-color: rgb(250 204 21 / 75%);
        color: #fde68a;
      }

      #import-dropzone {
        display: grid;
        place-items: center;
        min-height: 58px;
        border: 1px dashed #2e5964;
        border-radius: 6px;
        color: var(--muted);
        font: 11px/1.4 "Cascadia Mono", monospace;
        text-align: center;
      }

      #import-dropzone.drag-over {
        border-color: var(--cyan);
        color: var(--cyan);
        background: rgb(103 232 249 / 8%);
      }

      #export-panel-toggle {
        display: none;
      }

      @media (max-width: 1040px) {
        body {
          overflow: auto;
        }

        #topbar {
          display: flex;
          flex-wrap: wrap;
          padding-right: 116px;
        }

        #topbar h1 {
          flex: 1 1 100%;
        }

        #status {
          flex: 1 1 100%;
          order: 99;
          justify-self: start;
          white-space: normal;
        }

        #workspace {
          grid-template-columns: 300px minmax(320px, 1fr);
        }

        #export-panel-toggle {
          display: inline-block;
          position: fixed;
          top: 58px;
          right: 12px;
          z-index: 35;
        }

        .panel.right {
          position: fixed;
          top: 96px;
          right: 0;
          bottom: 0;
          z-index: 20;
          display: grid;
          width: min(390px, 94vw);
          transform: translateX(calc(100% - 18px));
          transition: transform 160ms ease;
          box-shadow: -10px 0 28px rgb(0 0 0 / 32%);
        }

        #workspace.export-open .panel.right {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <h1>V3 Clean Rig Animation Editor</h1>
        <button id="play" type="button">Play</button>
        <button id="prev-frame" type="button">Frame -</button>
        <button id="next-frame" type="button">Frame +</button>
        <button id="front-camera" type="button">Front</button>
        <button id="left-camera" type="button">Left</button>
        <button id="rear-camera" type="button">Rear</button>
        <button id="right-camera" type="button">Right</button>
        <button id="four-view" type="button">4 View</button>
        <button id="export-panel-toggle" type="button">Export/QA</button>
        <span id="status">Preparing editor...</span>
      </div>
      <div id="workspace">
        <aside class="panel">
          <section class="section">
            <p class="section-title">Clip</p>
            <span id="dirty-indicator" class="mini-status">Saved</span>
            <label>
              Authored Clip
              <select id="clip-select"></select>
            </label>
            <div class="grid-3">
              <label>Frame<input id="frame-input" type="number" min="0" step="1" value="0" /></label>
              <label>Frames<input id="duration-input" type="number" min="1" step="1" value="120" /></label>
              <label>Speed<input id="speed-input" type="number" min="0.1" max="4" step="0.1" value="1" /></label>
            </div>
            <input id="timeline" type="range" min="0" max="120" value="0" />
            <div class="grid-2">
              <label>Loop In<input id="loop-in" type="number" min="0" step="1" value="0" /></label>
              <label>Loop Out<input id="loop-out" type="number" min="0" step="1" value="120" /></label>
            </div>
            <div id="dope-sheet" aria-label="Animation dope sheet"></div>
            <div class="row">
              <button id="set-keyframe" type="button">Set Keyframe</button>
              <button id="delete-keyframe" type="button">Delete Keyframe</button>
              <button id="reset-frame" type="button">Reset Frame</button>
              <button id="duplicate-clip" type="button">Duplicate Clip</button>
              <button id="new-from-current" type="button">New From Current</button>
            </div>
          </section>

          <section class="section">
            <p class="section-title">Joint</p>
            <label>
              Selected Joint
              <select id="joint-select"></select>
            </label>
            <div class="grid-3">
              <label>Rot X<input id="joint-rx" type="number" step="0.01" value="0" /></label>
              <label>Rot Y<input id="joint-ry" type="number" step="0.01" value="0" /></label>
              <label>Rot Z<input id="joint-rz" type="number" step="0.01" value="0" /></label>
            </div>
            <div class="row">
              <button id="apply-joint" type="button">Apply Joint</button>
              <button id="reset-joint" type="button">Reset Joint</button>
              <button id="mirror-frame" type="button">Mirror Frame</button>
            </div>
          </section>

          <section class="section">
            <p class="section-title">Editor Tools</p>
            <label>
              Gizmo Target
              <select id="edit-target">
                <option value="joint">Selected Joint</option>
                <option value="root">Root Offset</option>
                <option value="weapon">Weapon Pose</option>
                <option value="primarySocketMarker">Primary Socket</option>
                <option value="offhandSocketMarker">Offhand Socket</option>
              </select>
            </label>
            <div class="row">
              <button id="transform-translate" type="button">Move</button>
              <button id="transform-rotate" type="button">Rotate</button>
              <button id="transform-space" type="button">Local</button>
            </div>
            <div class="toggle-row">
              <label><input id="auto-key" type="checkbox" checked /> Auto-key gizmo edits</label>
              <label><input id="snap-transform" type="checkbox" checked /> Snap 0.01 / 0.05 rad</label>
            </div>
            <label>
              Pose Library
              <select id="pose-library"></select>
            </label>
            <div class="row">
              <button id="apply-pose" type="button">Apply Pose</button>
            </div>
          </section>

          <section class="section">
            <p class="section-title">Root / Weapon</p>
            <div class="grid-3">
              <label>Root X<input id="root-x" type="number" step="0.01" value="0" /></label>
              <label>Root Y<input id="root-y" type="number" step="0.01" value="0" /></label>
              <label>Root Z<input id="root-z" type="number" step="0.01" value="0" /></label>
            </div>
            <label>
              Weapon
              <select id="weapon-select">
                <option value="">Hidden</option>
                <option value="hammer">Hammer</option>
                <option value="sword">Sword</option>
                <option value="pistol">Pistol</option>
              </select>
            </label>
            <div class="grid-3">
              <label>Pos X<input id="weapon-x" type="number" step="0.01" value="0" /></label>
              <label>Pos Y<input id="weapon-y" type="number" step="0.01" value="0" /></label>
              <label>Pos Z<input id="weapon-z" type="number" step="0.01" value="0" /></label>
            </div>
            <div class="grid-3">
              <label>Rot X<input id="weapon-rx" type="number" step="0.01" value="0" /></label>
              <label>Rot Y<input id="weapon-ry" type="number" step="0.01" value="0" /></label>
              <label>Rot Z<input id="weapon-rz" type="number" step="0.01" value="0" /></label>
            </div>
            <div class="grid-3">
              <label>Primary X<input id="primary-x" type="number" step="0.01" value="0" /></label>
              <label>Primary Y<input id="primary-y" type="number" step="0.01" value="0" /></label>
              <label>Primary Z<input id="primary-z" type="number" step="0.01" value="0" /></label>
            </div>
            <div class="grid-3">
              <label>Offhand X<input id="offhand-x" type="number" step="0.01" value="0" /></label>
              <label>Offhand Y<input id="offhand-y" type="number" step="0.01" value="0" /></label>
              <label>Offhand Z<input id="offhand-z" type="number" step="0.01" value="0" /></label>
            </div>
            <div class="row">
              <button id="apply-root" type="button">Apply Root</button>
              <button id="apply-weapon" type="button">Apply Weapon</button>
            </div>
          </section>
        </aside>

        <main id="viewport-wrap">
          <canvas id="editor-canvas"></canvas>
          <div id="viewport-label">Orbit: drag / wheel. Numeric edits key the clean rig JSON.</div>
        </main>

        <aside class="panel right">
          <section class="section">
            <p class="section-title">Frame Tools</p>
            <div class="row">
              <button id="undo" type="button">Undo</button>
              <button id="redo" type="button">Redo</button>
            </div>
            <div class="row">
              <button id="copy-frame" type="button">Copy Frame</button>
              <button id="paste-frame" type="button">Paste Frame</button>
              <button id="copy-prev-frame" type="button">Copy Previous</button>
            </div>
            <div id="keyframe-list"></div>
          </section>

          <section class="section">
            <p class="section-title">Overlays</p>
            <div class="toggle-row">
              <label><input id="show-skeleton" type="checkbox" checked /> Skeleton</label>
              <label><input id="show-axes" type="checkbox" checked /> Joint Axes</label>
              <label><input id="show-weapon-axes" type="checkbox" checked /> Weapon Axes</label>
              <label><input id="show-socket-markers" type="checkbox" checked /> Socket Markers</label>
              <label><input id="show-seams" type="checkbox" /> Seam Gaps</label>
              <label><input id="show-onion" type="checkbox" /> Onion Skin</label>
              <label><input id="show-reference" type="checkbox" /> Mixamo Reference</label>
            </div>
            <div id="validation">No validation run yet.</div>
          </section>

          <section class="section">
            <p class="section-title">Import / Export</p>
            <div class="row">
              <button id="copy-json" type="button">Copy JSON</button>
              <button id="download-json" type="button">Download JSON</button>
              <button id="import-json" type="button">Import JSON</button>
              <button id="choose-json" type="button">Choose JSON</button>
              <button id="save-local" type="button">Save Local</button>
              <button id="clear-local" type="button">Clear Local</button>
              <button id="send-atlas" type="button">Send &amp; Open Atlas</button>
            </div>
            <input id="import-file" type="file" accept="application/json,.json" hidden />
            <div id="import-dropzone" tabindex="0">Drop authored clip JSON here</div>
            <textarea id="json-output" spellcheck="false" aria-label="V3 clean rig authored clip JSON"></textarea>
          </section>
        </aside>
      </div>
    </div>
    <script type="module" src="/src/tools/v3CleanAnimationEditor.ts"></script>
  </body>
</html>
