# ============================================================================
#  iBrawls RL config. Written by the control board (python -m ibrawls_rl.dashboard).
#  Safe to hand-edit; every field's meaning is shown in the dashboard form.
# ============================================================================

[run]
mode = "combat"
opponent = "self"
total_steps = 10000000
parallel_matches = 32
num_workers = 6
goal_target = 3
match_minutes = 1.5
device = "cuda"
seed = 1

[combat]
world_sizes = [2, 2, 2, 2, 2, 2, 2, 2, 4, 4, 4, 4]
kill_min = 8
kill_max = 25
randomize_layout = true

[ppo]
learning_rate = 0.0002
rollout_length = 256
batch_size = 4096
gamma = 0.997
gae_lambda = 0.95
entropy_coef = 0.01
value_coef = 0.5
clip_range = 0.15

[network]
width = 512
depth = 3
init_model = "runs/combat2_v3/final_model_140obs.zip"

[randomize]
enabled = true
pct = 0.15

[reward]
win = 1.0
goal_scored = 5.063
goal_conceded = 1.0
possession = 0.0001
ball_progress = 0.01
kill = 0.7
death = 0.5
approach = 0.4
time_penalty = 0.01
bootstrap_truncation = false

[logging]
dir = "runs/combat2_v3_1"
save_every = 200000
eval_every = 100000
eval_episodes = 24
