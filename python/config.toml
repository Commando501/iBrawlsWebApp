# ============================================================================
#  iBrawls RL config. Written by the control board (python -m ibrawls_rl.dashboard).
#  Safe to hand-edit; every field's meaning is shown in the dashboard form.
# ============================================================================

[run]
mode = "combat"
opponent = "random"
total_steps = 40000000
parallel_matches = 32
num_workers = 12
goal_target = 3
match_minutes = 3.0
decision_interval = 5
device = "cuda"
seed = 1

[combat]
world_sizes = [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 8, 8, 8, 8]
layout_mix = ["1v1x16", "1v2x6", "1v3x6", "1v7x2", "ffa4x6", "ffa8x4"]
bait_layout_mix = ["1v1x12", "1v2x4", "1v3x4"]
bait_opponent = "passive_bait_jitter"
bait_reward_scale = 2.0
lone_wolf_reward_scale = 1.35
kill_min = 10
kill_max = 25
randomize_layout = true

[ppo]
learning_rate = 0.0003
rollout_length = 256
batch_size = 8192
gamma = 0.99
gae_lambda = 0.95
entropy_coef = 0.02
value_coef = 0.5
clip_range = 0.2
n_epochs = 4
max_grad_norm = 0.5
target_kl = 0.03
lr_schedule = "linear"

[network]
width = 512
depth = 3
frame_stack = 4
observation_version = 3
init_model = ""

[randomize]
enabled = true
pct = 0.15

[league]
snapshots = []
scenario_mix = []
random_opponent_rate = 0.0
latest_bias = 0.7
worlds = 6
snapshot_every = 1000000

[reward]
win = 1.0
goal_scored = 5.063
goal_conceded = 1.0
possession = 0.0001
ball_progress = 0.01
kill = 16.0
death = 3.0
approach = 0.562
time_penalty = 0.005
invalid_attack = 0.01
invalid_dash = 0.01
invalid_jump = 0.01
invalid_swap = 0.01
action_repeat = 0.01
danger_approach = 0.25
bait_disengage = 0.15
trap_death = 0.8
bootstrap_truncation = false

[logging]
dir = "runs/combat_upgrade_v1"
save_every = 2000000
eval_every = 2000000
eval_episodes = 16
