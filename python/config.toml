# ============================================================================
#  iBrawls RL config. Written by the control board (python -m ibrawls_rl.dashboard).
#  Safe to hand-edit; every field's meaning is shown in the dashboard form.
#
#  combat3_humanlike_v3 — fresh run for the new regime (nearest-enemy aim +
#  frame_stack 4 + league worlds vs frozen snapshots). Fresh because the action
#  space and obs stack both changed; the old v1 brain seeds the LEAGUE pool
#  instead, so its skill still shapes training as an opponent.
#  time_penalty is back to a nudge (0.005/tick ≈ 18 per round) so winning and
#  kills — not "end the round at any cost" — dominate the return.
# ============================================================================

[run]
mode = "combat"
opponent = "self"
total_steps = 30000000
parallel_matches = 32
num_workers = 12
goal_target = 3
match_minutes = 1.0
decision_interval = 5
device = "cuda"
seed = 1

[combat]
world_sizes = [2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 4, 8, 8, 8, 8]
kill_min = 4
kill_max = 25
randomize_layout = true

[ppo]
learning_rate = 0.0003
rollout_length = 256
batch_size = 8192
gamma = 0.99
gae_lambda = 0.95
entropy_coef = 0.01
value_coef = 0.5
clip_range = 0.2
n_epochs = 4
max_grad_norm = 0.5
target_kl = 0.03
lr_schedule = "linear"

[network]
width = 512
depth = 3
frame_stack = 4
init_model = ""

[randomize]
enabled = false
pct = 0.15

[league]
snapshots = ["runs/combat3_humanlike_v1/final_model.zip"]
latest_bias = 0.7
worlds = 6
snapshot_every = 2000000

[reward]
win = 1.0
goal_scored = 5.063
goal_conceded = 1.0
possession = 0.0001
ball_progress = 0.01
kill = 10.0
death = 3.0
approach = 0.725
time_penalty = 0.005
invalid_attack = 0.0
invalid_dash = 0.0
invalid_jump = 0.0
invalid_swap = 0.0
action_repeat = 0.0
bootstrap_truncation = false

[logging]
dir = "runs/combat3_humanlike_v3"
save_every = 2000000
eval_every = 2000000
eval_episodes = 16
