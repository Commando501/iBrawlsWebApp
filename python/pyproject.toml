[project]
name = "ibrawls-rl"
version = "0.1.0"
description = "PPO self-play trainer for the headless TypeScript iBrawls (Grifball) sim."
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "stable-baselines3>=2.3",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ibrawls_rl", "ibrawls_rl.envs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
