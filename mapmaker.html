<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iBrawls Standalone 3D Map Maker</title>
  <!-- Tailwind CSS for rich modern UI grid layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js, OrbitControls, and TransformControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      user-select: none;
      overflow: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.4);
    }
    /* Active selection bounds */
    .glass-panel {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Map Maker Design System */
    .mapmaker-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .mapmaker-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(148, 163, 184, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mapmaker-value-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      font-weight: 800;
    }
    .mapmaker-value-badge[data-editable] {
      cursor: text;
    }
    .mapmaker-value-badge[data-editable]:hover {
      background: rgba(6, 182, 212, 0.2);
      border-color: rgba(6, 182, 212, 0.5);
    }
    /* Inline number editor that temporarily replaces a value badge */
    .mapmaker-value-edit {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 800;
      color: #22d3ee;
      background: rgba(3, 7, 18, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.6);
      border-radius: 4px;
      padding: 0.05rem 0.25rem;
      width: 4.5rem;
      text-align: right;
      outline: none;
    }
    /* Keep the spinners but make them compact */
    .mapmaker-value-edit::-webkit-inner-spin-button {
      opacity: 0.5;
    }
    .mapmaker-input {
      background: rgba(3, 7, 18, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #f3f4f6 !important;
      border-radius: 0.5rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.75rem !important;
      outline: none !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .mapmaker-input:focus {
      border-color: rgba(6, 182, 212, 0.5) !important;
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15) !important;
      background: rgba(3, 7, 18, 0.85) !important;
    }
    .mapmaker-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      transition: background 0.2s;
    }
    .mapmaker-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22d3ee;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
      transition: transform 0.1s;
    }
    .mapmaker-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .mapmaker-preset-grid {
      display: grid;
      grid-template-cols: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    .mapmaker-preset-btn {
      background: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 0.5rem !important;
      color: #e2e8f0 !important;
      font-weight: 600 !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.375rem !important;
      cursor: pointer !important;
    }
    .mapmaker-preset-btn:hover {
      background: rgba(6, 182, 212, 0.08) !important;
      border-color: rgba(6, 182, 212, 0.3) !important;
      color: #22d3ee !important;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.05) !important;
    }
    .mapmaker-item-list {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .mapmaker-drag-over {
      border: 1.5px dashed #22d3ee !important;
      background: rgba(6, 182, 212, 0.12) !important;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
    }
    .mapmaker-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.75rem;
    }
    .mapmaker-item-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .mapmaker-item-row-selected {
      background: rgba(6, 182, 212, 0.08) !important;
      border-color: rgba(6, 182, 212, 0.3) !important;
      color: #22d3ee !important;
    }
    .mapmaker-row-actions {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .mapmaker-row-btn {
      color: rgba(255, 255, 255, 0.35);
      background: transparent !important;
      border: none !important;
      transition: color 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .mapmaker-row-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body class="w-screen h-screen flex relative">

  <!-- LEFT VIEWPORT + BOTTOM CONTENT BROWSER PANEL -->
  <div class="flex-grow flex flex-col min-w-0 overflow-hidden relative" id="left-main-panel">
    
    <!-- 3D VIEWPORT -->
    <div class="flex-grow w-full relative min-h-0" id="viewport-container">
      <canvas id="editor-canvas" class="w-full h-full block"></canvas>

      <!-- TOPBAR OVERLAY -->
      <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="pointer-events-auto flex items-center gap-3">
          <h1 class="text-2xl font-black italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
            iBrawls Map Maker
          </h1>
          <span class="text-[9px] font-mono font-extrabold uppercase tracking-widest text-cyan-400 bg-cyan-950/50 border border-cyan-800/50 px-2 py-0.5 rounded">
            Standalone Local Build
          </span>
        </div>

        <div class="pointer-events-auto flex gap-2">
          <label class="h-10 px-4 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-cyan-500/50 text-white hover:text-cyan-400 text-xs font-bold rounded-lg flex items-center gap-1.5 cursor-pointer transition-all duration-200 shadow-lg">
            <i data-lucide="upload" class="w-4 h-4"></i> Import JSON
            <input type="file" id="import-input" accept=".json" class="hidden">
          </label>

          <button onclick="handleExportJSON()" class="h-10 px-4 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-cyan-500/50 text-white hover:text-cyan-400 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-all duration-200 shadow-lg">
            <i data-lucide="save" class="w-4 h-4"></i> Export JSON
          </button>

          <button id="navmesh-btn" onclick="triggerBakeNavMesh()" class="h-10 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-black uppercase tracking-wider rounded-lg flex items-center gap-1.5 transition-all duration-200 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_20px_rgba(6,182,212,0.5)]">
            <i data-lucide="refresh-cw" class="w-4 h-4" id="bake-icon"></i> Bake Nav Mesh
          </button>

          <button onclick="handleExitEditor()" class="h-10 px-4 bg-red-950/80 hover:bg-red-900 border border-red-500/20 hover:border-red-500/50 text-red-400 hover:text-red-200 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-all duration-200 shadow-lg pointer-events-auto">
            <i data-lucide="log-out" class="w-4 h-4"></i> Exit Editor
          </button>
        </div>
      </div>

      <!-- INSTRUCTIONS / CONTROLS LEGEND CARD -->
      <div class="absolute bottom-4 left-4 glass-panel p-4 rounded-xl shadow-2xl pointer-events-auto max-w-[280px] flex flex-col gap-2 z-10 text-[11px] text-white/50">
        <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
          <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Editor Controls
        </h3>
        <div class="flex justify-between items-center">
          <span>Rotate camera</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">LMB + Drag</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Pan viewport</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">RMB + Drag</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Zoom Camera</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">Scroll Wheel</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Select Object</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">Left Click mesh</span>
        </div>
      </div>

      <!-- TRANSFORM MODE SELECTOR -->
      <div class="absolute bottom-4 right-4 glass-panel p-1.5 rounded-xl shadow-2xl pointer-events-auto flex items-center gap-1 z-10">
        <button id="mode-translate-btn" onclick="setTransformMode('translate')" class="px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer bg-cyan-500/25 text-cyan-400 border border-cyan-500/40">
          <i data-lucide="move" class="w-3.5 h-3.5"></i> Movement
        </button>
        <button id="mode-rotate-btn" onclick="setTransformMode('rotate')" class="px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer text-slate-400 border border-transparent hover:text-white">
          <i data-lucide="rotate-3d" class="w-3.5 h-3.5"></i> Rotation
        </button>
      </div>
    </div>

    <!-- RESIZER HANDLE FOR BOTTOM CONTENT BROWSER -->
    <div class="h-1.5 w-full bg-[#05070c] border-y border-white/5 hover:bg-cyan-500/40 active:bg-cyan-500/60 cursor-ns-resize transition-all duration-150 shrink-0 z-20 flex items-center justify-center gap-0.5 group" id="bottom-resizer" title="Drag to resize Content Browser">
      <div class="w-8 h-0.5 bg-slate-700 group-hover:bg-cyan-400 rounded-full transition-colors"></div>
    </div>

    <!-- BOTTOM CONTENT BROWSER (UNREAL STYLE) -->
    <div class="w-full glass-panel border-t border-white/5 flex flex-col shrink-0 z-10 bg-[#090d16]/95 backdrop-blur-md" id="bottom-content-browser" style="height: 280px;">
      <!-- Populated dynamically via renderContentBrowser() in Javascript -->
    </div>

  </div>

  <!-- RESIZER HANDLE FOR RIGHT SIDEBAR -->
  <div class="w-1.5 h-full bg-[#05070c] border-x border-white/5 hover:bg-cyan-500/40 active:bg-cyan-500/60 cursor-ew-resize transition-all duration-150 shrink-0 z-20 flex flex-col items-center justify-center gap-0.5 group" id="sidebar-resizer" title="Drag to resize Sidebar">
    <div class="h-8 w-0.5 bg-slate-700 group-hover:bg-cyan-400 rounded-full transition-colors"></div>
  </div>

  <!-- EDITOR INSPECTOR SIDEBAR -->
  <div class="h-full glass-panel border-l border-white/5 flex flex-col shadow-3xl z-10 shrink-0" id="right-sidebar" style="width: 380px;">
    <!-- Sidebar Title -->
    <div class="p-4 border-b border-white/5 flex justify-between items-center shrink-0">
      <span class="text-sm font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
        Simulation Builder
      </span>
      <button onclick="toggleNavMeshOverlay()" id="toggle-nav-btn" class="p-2 border border-white/10 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors" title="Toggle Nav Mesh Overlay">
        <i data-lucide="eye" class="w-4 h-4" id="nav-eye-icon"></i>
      </button>
    </div>

    <!-- TAB SWITCHER -->
    <div class="grid grid-cols-3 bg-black/35 border-b border-white/5 text-center shrink-0">
      <button onclick="switchTab('scene')" id="tab-scene" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-cyan-500 bg-cyan-500/5 text-cyan-400 flex flex-col items-center gap-1">
        <i data-lucide="compass" class="w-4 h-4"></i> Scene
      </button>
      <button onclick="switchTab('lights')" id="tab-lights" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-white flex flex-col items-center gap-1">
        <i data-lucide="sun" class="w-4 h-4"></i> Lights
      </button>
      <button onclick="switchTab('objects')" id="tab-objects" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-white flex flex-col items-center gap-1">
        <i data-lucide="layers" class="w-4 h-4"></i> Outliner
      </button>
    </div>

    <!-- SCROLLABLE INSPECTOR PANEL CONTENT -->
    <div id="inspector-panel" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
      <!-- Tabs panels rendered dynamically in JavaScript -->
    </div>
  </div>

    // INITIALIZE WORKSPACE
    window.addEventListener('load', () => {
      initThree();
      initEvents();
      initResizers();
      seedDefaultSpawns();
      switchTab('scene');
      lucide.createIcons();
      isInitialized = true;
      hasUnsavedChanges = false;

    function initThree() {
      const container = document.getElementById('viewport-container');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(fogColor);
      scene.fog = new THREE.FogExp2(fogColor, fogDensity);

      // Camera
      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 25, 35);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('editor-canvas'), antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05; // prevent going below floor
      controls.minDistance = 3;
      controls.maxDistance = 100;

      // Lighting Base
      const ambientLight = new THREE.AmbientLight(ambientColor, ambientIntensity);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(directColor, directIntensity);
      dirLight.position.set(directPosX, directPosY, directPosZ);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 80;
      const dSize = 25;
      dirLight.shadow.camera.left = -dSize;
      dirLight.shadow.camera.right = dSize;
      dirLight.shadow.camera.top = dSize;
      dirLight.shadow.camera.bottom = -dSize;
      scene.add(dirLight);

      // Workspace Groups
      objectsGroup = new THREE.Group();
      spawnsGroup = new THREE.Group();
      lightsGroup = new THREE.Group();
      navMeshGroup = new THREE.Group();
      scene.add(objectsGroup);
      scene.add(spawnsGroup);
      scene.add(lightsGroup);
      scene.add(navMeshGroup);

      // Boundary outline
      rebuildBoundaryGrid();

      // Selection Helper
      selectionHelper = new THREE.BoxHelper(new THREE.Mesh(), '#22d3ee');
      selectionHelper.visible = false;
      scene.add(selectionHelper);

      // Transform Controls Translation/Rotation Gizmo
      transformControls = new THREE.TransformControls(camera, renderer.domElement);
      transformControls.size = 0.85;
      transformControls.setMode(currentTransformMode);
      scene.add(transformControls);

      // Disable/enable OrbitControls during drag; trigger final scene rebuild on release
      transformControls.addEventListener('dragging-changed', (e) => {
        controls.enabled = !e.value;
        if (!e.value) {
          rebuildScene();
        }
      });

      // Real-time synchronization during drag movement
      transformControls.addEventListener('change', () => {
        if (!transformControls.object) return;
        const target = transformControls.object;

        if (target.userData && target.userData.id) {
          // Sync custom map object position
          const objId = target.userData.id;
          const obj = objects.find(o => o.id === objId);
          if (obj) {
            obj.position.x = parseFloat(target.position.x.toFixed(1));
            obj.position.y = parseFloat(target.position.y.toFixed(1));
            obj.position.z = parseFloat(target.position.z.toFixed(1));

            // Sync custom map object rotation
            if (!obj.rotation) obj.rotation = { x: 0, y: 0, z: 0 };
            obj.rotation.x = parseFloat(target.rotation.x.toFixed(3));
            obj.rotation.y = parseFloat(target.rotation.y.toFixed(3));
            obj.rotation.z = parseFloat(target.rotation.z.toFixed(3));

            // Sync sidebar DOM inputs in real-time
            const inputs = document.getElementById('inspector-panel');
            if (inputs) {
              const posXInput = inputs.querySelector('input[oninput*="pos_x"]');
              if (posXInput) {
                posXInput.value = obj.position.x;
                const readout = posXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.x}m`;
              }
              const posYInput = inputs.querySelector('input[oninput*="pos_y"]');
              if (posYInput) {
                posYInput.value = obj.position.y;
                const readout = posYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.y}m`;
              }
              const posZInput = inputs.querySelector('input[oninput*="pos_z"]');
              if (posZInput) {
                posZInput.value = obj.position.z;
                const readout = posZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.z}m`;
              }

              // Sync rotation inputs
              const rotXInput = inputs.querySelector('input[oninput*="rot_x"]');
              if (rotXInput) {
                let deg = Math.round(obj.rotation.x * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotXInput.value = deg;
                const readout = rotXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
              const rotYInput = inputs.querySelector('input[oninput*="rot_y"]');
              if (rotYInput) {
                let deg = Math.round(obj.rotation.y * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotYInput.value = deg;
                const readout = rotYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
              const rotZInput = inputs.querySelector('input[oninput*="rot_z"]');
              if (rotZInput) {
                let deg = Math.round(obj.rotation.z * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotZInput.value = deg;
                const readout = rotZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
            }

            // Sync bounding box helper outline
            if (selectionHelper && selectionHelper.visible) {
              selectionHelper.setFromObject(target);
            }
          }
        } else if (target.userData && target.userData.lightId) {
          // Sync point light source position
          const lightId = target.userData.lightId;
          const pl = pointLights.find(l => l.id === lightId);
          if (pl) {
            pl.position.x = parseFloat(target.position.x.toFixed(1));
            pl.position.y = parseFloat(target.position.y.toFixed(1));
            pl.position.z = parseFloat(target.position.z.toFixed(1));

            // Sync actual PointLight emitting source in scene in real-time
            const actualLight = lightsGroup.children.find(c => c.isPointLight && c.userData && c.userData.lightSourceId === lightId);
            if (actualLight) {
              actualLight.position.copy(target.position);
            }

            // Sync sidebar DOM inputs in real-time
            const inputs = document.getElementById('inspector-panel');
            if (inputs) {
              const posXInput = inputs.querySelector('input[oninput*="pos_x"]');
              if (posXInput) {
                posXInput.value = pl.position.x;
                const readout = posXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.x}m`;
              }
              const posYInput = inputs.querySelector('input[oninput*="pos_y"]');
              if (posYInput) {
                posYInput.value = pl.position.y;
                const readout = posYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.y}m`;
              }
              const posZInput = inputs.querySelector('input[oninput*="pos_z"]');
              if (posZInput) {
                posZInput.value = pl.position.z;
                const readout = posZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.z}m`;
              }
            }
          }
        }
      });

      // Click raycaster Setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Animation tick
      animate();
    }

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      // Slowly rotate the sky dome
      const skyboxMesh = scene.getObjectByName('skybox_mesh');
      if (skyboxMesh) {
        skyboxMesh.rotation.y += dt * 0.004;
      }

      // Slow hover rotation on spawn indicators for micro-animations
      const time = Date.now() * 0.002;
      spawnsGroup.children.forEach((group, idx) => {
        group.position.y = 0.9 + Math.sin(time + idx * 1.5) * 0.08;
      });

      // Animate rain particles in editor if present
      const rainObj = scene.getObjectByName('rain_particles');
      if (rainObj && rainObj instanceof THREE.Points) {
        const positions = rainObj.geometry.attributes.position.array;
        const velocities = rainObj.userData.velocities;
        const radius = rainObj.userData.arenaRadius || 20;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3] += velocities[i].x * dt;
          positions[i * 3 + 1] += velocities[i].y * dt;
          positions[i * 3 + 2] += velocities[i].z * dt;

          if (positions[i * 3 + 1] <= 0.05) {
            positions[i * 3] = (Math.random() - 0.5) * radius * 3;
            positions[i * 3 + 1] = 25;
            positions[i * 3 + 2] = (Math.random() - 0.5) * radius * 2;
          }
        }
        rainObj.geometry.attributes.position.needsUpdate = true;
      }

      // Animate snow particles in editor if present
      const snowObj = scene.getObjectByName('snow_particles');
      if (snowObj && snowObj instanceof THREE.Points) {
        const positions = snowObj.geometry.attributes.position.array;
        const velocities = snowObj.userData.velocities;
        const radius = snowObj.userData.arenaRadius || 20;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3] += velocities[i].x * dt;
          positions[i * 3 + 1] += velocities[i].y * dt;
          positions[i * 3 + 2] += velocities[i].z * dt;

          if (positions[i * 3 + 1] <= 0.05) {
            positions[i * 3] = (Math.random() - 0.5) * radius * 3.2;
            positions[i * 3 + 1] = 25;
            positions[i * 3 + 2] = (Math.random() - 0.5) * radius * 2.2;
          }
        }
        snowObj.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function rebuildBoundaryGrid() {
      if (boundaryGrid) scene.remove(boundaryGrid);

      boundaryGrid = new THREE.Group();

      const borderColor = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#ffffff' : '#38bdf8');
      const gridColor1 = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#334155' : '#1e293b');
      const gridColor2 = theme === 'synthwave' ? '#06b6d4' : theme === 'winter_rink' ? '#f1f5f9' : (theme === 'grifball_stadium' ? '#0f172a' : '#0f172a');

      if (mapShape === 'rectangular') {
        // Draw rectangular boundary outline using explicit half-extents
        const bx = arenaHalfX;
        const bz = arenaHalfZ;
        const points = [
          new THREE.Vector3(-bx, 0.05, -bz),
          new THREE.Vector3(bx, 0.05, -bz),
          new THREE.Vector3(bx, 0.05, bz),
          new THREE.Vector3(-bx, 0.05, bz),
          new THREE.Vector3(-bx, 0.05, -bz)
        ];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const lineMat = new THREE.LineBasicMaterial({ color: borderColor, linewidth: 2 });
        boundaryGrid.add(new THREE.Line(lineGeo, lineMat));

        // Vertical ceiling volume (wireframe box up to arenaCeiling)
        const boxGeo = new THREE.BoxGeometry(bx * 2, arenaCeiling, bz * 2);
        const edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(boxGeo),
          new THREE.LineBasicMaterial({ color: borderColor, transparent: true, opacity: 0.25 })
        );
        edges.position.y = arenaCeiling / 2;
        boundaryGrid.add(edges);

        // Grid helper inside boundary, scaled to the X/Z aspect
        const grid = new THREE.GridHelper(bx * 2, 24, gridColor1, gridColor2);
        grid.scale.z = bz / bx;
        grid.position.y = -0.05;
        boundaryGrid.add(grid);
      } else {
        // High-tech circular boundary ring
        const ringGeo = new THREE.RingGeometry(arenaRadius - 0.1, arenaRadius + 0.1, 64);
        ringGeo.rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: borderColor, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        boundaryGrid.add(new THREE.Mesh(ringGeo, ringMat));

        // Vertical ceiling volume (wireframe cylinder up to arenaCeiling)
        const cylGeo = new THREE.CylinderGeometry(arenaRadius, arenaRadius, arenaCeiling, 48, 1, true);
        const cylEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(cylGeo),
          new THREE.LineBasicMaterial({ color: borderColor, transparent: true, opacity: 0.2 })
        );
        cylEdges.position.y = arenaCeiling / 2;
        boundaryGrid.add(cylEdges);

        // Grid helper inside boundary
        const grid = new THREE.GridHelper(arenaRadius * 2, 20, gridColor1, gridColor2);
        grid.position.y = -0.05;
        boundaryGrid.add(grid);
      }

      scene.add(boundaryGrid);
    }

    // procedurally generated textures
    function generateCustomTexture(type, colorHex) {
      const size = 256;
      const resolution = 2048;
      const scaleFactor = resolution / size;
      const canvas = document.createElement('canvas');
      canvas.width = resolution;
      canvas.height = resolution;
      const ctx = canvas.getContext('2d');
      ctx.scale(scaleFactor, scaleFactor);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, size, size);

      if (type === 'nature_grass') {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#166534';
        for (let i = 0; i < 2000; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 2, 4);
        }
      } else if (type === 'nature_mossy_stone') {
        // High fidelity granite slate with weathered green moss patches
        ctx.fillStyle = '#4b5563';
        ctx.fillRect(0, 0, size, size);
        
        // Granite mineral speckling detail
        ctx.fillStyle = '#374151';
        for (let i = 0; i < 800; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 2.0, 2.0);
        }
        
        // Stone fractures and fissures
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 2.0;
        for (let i = 0; i < 12; i++) {
          ctx.beginPath();
          const startX = Math.random() * size;
          const startY = Math.random() * size;
          ctx.moveTo(startX, startY);
          ctx.lineTo(startX + (Math.random() - 0.5) * 60, startY + (Math.random() - 0.5) * 60);
          ctx.lineTo(startX + (Math.random() - 0.5) * 120, startY + (Math.random() - 0.5) * 120);
          ctx.stroke();
        }
        
        // Mossy vegetative growth overlays with textured double-tone borders
        for (let i = 0; i < 20; i++) {
          const mx = Math.random() * size;
          const my = Math.random() * size;
          const mr = 18 + Math.random() * 35;
          
          // Outer dark moss cushion
          ctx.fillStyle = '#064e3b';
          ctx.beginPath();
          ctx.arc(mx, my, mr, 0, Math.PI * 2);
          ctx.fill();
          
          // Inner bright moss core
          ctx.fillStyle = colorHex; // light green
          ctx.beginPath();
          ctx.arc(mx, my, mr * 0.72, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'nature_wood') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 4;
        for (let i = 0; i < size; i += 20) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.bezierCurveTo(size / 3, i + 10, 2 * size / 3, i - 10, size, i);
          ctx.stroke();
        }
      } else if (type === 'space_alloy') {
        // High fidelity starbase brushed alloy hull plates
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, size, size);
        
        // Add brushed metallic micro-scratches
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
        ctx.lineWidth = 1.0;
        for (let i = 0; i < 200; i++) {
          const sy = Math.random() * size;
          const sx = Math.random() * (size * 0.6);
          ctx.beginPath();
          ctx.moveTo(sx, sy);
          ctx.lineTo(sx + size * 0.2 + Math.random() * (size * 0.2), sy);
          ctx.stroke();
        }
        
        // Solid cyan grid line seams
        ctx.strokeStyle = colorHex; 
        ctx.lineWidth = 2.5;
        for (let idx = 0; idx <= size; idx += 128) {
          ctx.beginPath(); ctx.moveTo(idx, 0); ctx.lineTo(idx, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, idx); ctx.lineTo(size, idx); ctx.stroke();
          
          // Outer highlight bevel shadow
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.2)';
          ctx.beginPath(); ctx.moveTo(idx + 3, 0); ctx.lineTo(idx + 3, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, idx + 3); ctx.lineTo(size, idx + 3); ctx.stroke();
          ctx.strokeStyle = colorHex; // reset
        }
        
        // Double-layered steel rivets with bright metallic cores
        for (let rx = 16; rx < size; rx += 128) {
          for (let ry = 16; ry < size; ry += 128) {
            // Rivet outer shadow ring
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.beginPath(); ctx.arc(rx + 1, ry + 1.5, 4.5, 0, Math.PI * 2); ctx.fill();
            
            // Rivet body
            ctx.fillStyle = '#64748b'; 
            ctx.beginPath(); ctx.arc(rx, ry, 3.5, 0, Math.PI * 2); ctx.fill();
            
            // Rivet specular highlight dot
            ctx.fillStyle = '#ffffff'; 
            ctx.beginPath(); ctx.arc(rx - 1, ry - 1, 1.2, 0, Math.PI * 2); ctx.fill();
          }
        }
      } else if (type === 'space_meteorite') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 30; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 8, 8);
        }
      } else if (type === 'space_lunar_dust') {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#475569';
        for (let i = 0; i < 400; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 3, 3);
        }
      } else if (type === 'futuristic_carbon') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#0f172a';
        for (let x = 0; x < size; x += 16) {
          for (let y = 0; y < size; y += 16) {
            ctx.fillRect(x + (y % 32 === 0 ? 8 : 0), y, 8, 8);
          }
        }
      } else if (type === 'futuristic_hex') {
        ctx.fillStyle = '#0a0f1d';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 1.5;
        const hexRadius = 24;
        const drawHex = (x, y) => {
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            ctx.lineTo(x + Math.cos(angle) * hexRadius, y + Math.sin(angle) * hexRadius);
          }
          ctx.closePath();
          ctx.stroke();
        };
        for (let x = 0; x < size + hexRadius; x += hexRadius * 1.5) {
          let row = 0;
          for (let y = 0; y < size + hexRadius; y += hexRadius * Math.sqrt(3)) {
            drawHex(x, y + (row % 2 === 0 ? 0 : (hexRadius * Math.sqrt(3)) / 2));
            row++;
          }
        }
      } else if (type === 'futuristic_shield') {
        ctx.fillStyle = '#083344';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#22d3ee';

        for (let i = 0; i < size; i += 32) {

        for (let y = 0; y < size; y += 32) {

      } else if (type === 'fantasy_runed_stone') {

        ctx.beginPath();
        ctx.moveTo(85, 0); ctx.lineTo(85, size);
        ctx.moveTo(171, 0); ctx.lineTo(171, size);
        ctx.stroke();

        // Red Center Line (at x = 128)
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(128, 0); ctx.lineTo(128, size);
        ctx.stroke();

        // Blue Center Face-off Circle (radius 20, red center dot)
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(128, 128, 20, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(128, 128, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Corner circles
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        const spots = [[57, 60], [57, 196], [199, 60], [199, 196]];
        spots.forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, 12.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(cx, cy, 2, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (type === 'winter_snow') {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 250; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
        }
        ctx.fillStyle = 'rgba(186, 230, 253, 0.2)';
        for (let i = 0; i < 8; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * size, Math.random() * size, 25 + Math.random() * 40, 6 + Math.random() * 10, Math.random() * 0.2 - 0.1, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'winter_glacier_glass') {
        ctx.fillStyle = 'rgba(147, 197, 253, 0.4)';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.0;
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * size, 0);
          ctx.lineTo(Math.random() * size, 70);
          ctx.lineTo(Math.random() * size, 180);
          ctx.lineTo(Math.random() * size, size);
          ctx.stroke();
        }
      } else if (type === 'stadium_steel_grid') {
        ctx.fillStyle = '#111318';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#08090c';
        ctx.lineWidth = 2;
        for (let i = 0; i <= size; i += 64) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 3;
        ctx.strokeRect(3, 3, size - 6, size - 6);
      } else if (type === 'stadium_scoreboard_screen') {
        ctx.fillStyle = '#06080e';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.fillStyle = 'rgba(0, 136, 255, 0.1)'; ctx.fillRect(10, 10, size/2 - 10, size - 20);
        ctx.fillStyle = 'rgba(255, 51, 68, 0.1)'; ctx.fillRect(size/2, 10, size/2 - 10, size - 20);
        ctx.beginPath();
        ctx.arc(size/2, size/2, 20, 0, Math.PI * 2);
        ctx.stroke();
      } else if (type === 'stadium_advertisement_sapphire') {
        ctx.fillStyle = '#05040a';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.beginPath(); ctx.arc(size/2, size/2, 35, 0, Math.PI, true); ctx.stroke();
      } else if (type === 'stadium_advertisement_gauss') {
        ctx.fillStyle = '#060402';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.strokeStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(size/2, 40); ctx.lineTo(size/2 - 15, size/2 + 5); ctx.lineTo(size/2 + 5, size/2 + 5); ctx.lineTo(size/2 - 5, size - 40);
        ctx.stroke();
      } else {
        // Plain colored fallback
        ctx.fillStyle = colorHex || '#4b5563';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(5, 5, size - 10, size - 10);
      }

      const canvasTexture = new THREE.CanvasTexture(canvas);
      canvasTexture.wrapS = THREE.RepeatWrapping;
      canvasTexture.wrapT = THREE.RepeatWrapping;
      if (type === 'winter_ice' || type === 'stadium_scoreboard_screen' || type === 'stadium_advertisement_sapphire' || type === 'stadium_advertisement_gauss') {
        canvasTexture.repeat.set(1, 1);
      } else if (type === 'stadium_steel_grid') {
        canvasTexture.repeat.set(1.5, 1.5);
      } else {
        canvasTexture.repeat.set(1.5, 1.5);
      }
      return canvasTexture;
    }

    // Cache to prevent recreating canvas textures in editor
    const skyboxTextureCache = new Map();
    function getSkyboxTexture(type, hue, brightness, fogColor) {
      const cacheKey = `${type}_${hue}_${brightness}_${fogColor}`;
      if (skyboxTextureCache.has(cacheKey)) {
        return skyboxTextureCache.get(cacheKey);
      }

      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const skyColor = `hsl(${hue}, 75%, ${Math.min(100, Math.max(0, brightness * 4.5))}%)`;
      const horizonColor = `hsl(${hue}, 60%, ${Math.min(100, Math.max(0, brightness * 10))}%)`;

      // Draw Sky Gradients
      // Top half: sky to horizon
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 256);
      skyGrad.addColorStop(0, skyColor);
      skyGrad.addColorStop(1, horizonColor);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 1024, 256);

      // Bottom half: horizon to fog (seam blending)
      const groundGrad = ctx.createLinearGradient(0, 256, 0, 512);
      groundGrad.addColorStop(0, horizonColor);
      groundGrad.addColorStop(1, fogColor);
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, 256, 1024, 256);

      // Draw theme-specific scenery
      switch (type) {
        case 'cyberpunk':
          drawCyberpunkSky(ctx, hue, brightness, fogColor);
          break;
        case 'hangar':
          drawHangarSky(ctx, hue, brightness, fogColor);
          break;
        case 'nature':
          drawNatureSky(ctx, hue, brightness, fogColor);
          break;
        case 'space':
          drawSpaceSky(ctx, hue, brightness, fogColor);
          break;
        case 'fantasy':
          drawFantasySky(ctx, hue, brightness, fogColor);
          break;
        case 'forerunner':
          drawForerunnerSky(ctx, hue, brightness, fogColor);
          break;
        case 'synthwave':
          drawSynthwaveSky(ctx, hue, brightness, fogColor);
          break;
        case 'rainy_streets':
          drawRainyStreetsSky(ctx, hue, brightness, fogColor);
          break;
        case 'winter_rink':
          drawWinterRinkSky(ctx, hue, brightness, fogColor);
          break;
        case 'grifball_stadium':
          drawGrifballStadiumSky(ctx, hue, brightness, fogColor);
          break;
        case 'holodeck':
          drawHolodeckSky(ctx, hue, brightness, fogColor);
          break;
        case 'rust':
          drawRustSky(ctx, hue, brightness, fogColor);
          break;

        // Premium Extra Themes
        case 'toxic':
          drawToxicSky(ctx, hue, brightness, fogColor);
          break;
        case 'inferno':
          drawInfernoSky(ctx, hue, brightness, fogColor);
          break;
        case 'matrix':
          drawMatrixSky(ctx, hue, brightness, fogColor);
          break;
        case 'nebula':
          drawNebulaSky(ctx, hue, brightness, fogColor);
          break;
        default:
          drawCyberpunkSky(ctx, hue, brightness, fogColor);
          break;
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.ClampToEdgeWrapping;
      texture.wrapT = THREE.ClampToEdgeWrapping;
      skyboxTextureCache.set(cacheKey, texture);
      return texture;
    }

    function drawCyberpunkSky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      for (let i = 0; i < 40; i++) {
        const x = (i * 37) % 1024;
        const y = (i * 17) % 220;
        ctx.fillRect(x, y, 2, 2);
      }
      ctx.strokeStyle = 'rgba(6, 182, 212, 0.25)';
      ctx.lineWidth = 1.5;
      for (let x = 0; x < 1024; x += 64) {
        ctx.beginPath();
        ctx.moveTo(x, 210);
        ctx.lineTo(x + ((x * 7) % 30) - 15, 256);
        ctx.stroke();
      }
      for (let y = 210; y < 256; y += 12) {
        ctx.strokeStyle = `rgba(236, 72, 153, ${Math.max(0.1, (y - 210) / 100)})`;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(10, 5, 20, 0.6)';
      for (let i = 0; i < 15; i++) {
        const w = 40 + ((i * 13) % 50);
        const h = 50 + ((i * 19) % 80);
        const x = (i * 81) % 950;
        const y = 256 - h;
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = i % 2 === 0 ? 'rgba(6, 182, 212, 0.5)' : 'rgba(236, 72, 153, 0.5)';
        ctx.fillRect(x + w / 2 - 2, y, 4, h * 0.4);
        ctx.fillStyle = 'rgba(10, 5, 20, 0.6)';
      }
    }

    function drawHangarSky(ctx, hue, brightness, fogColor) {
      ctx.strokeStyle = 'rgba(71, 85, 105, 0.35)';
      ctx.lineWidth = 4;
      for (let x = 60; x < 1024; x += 180) {
        ctx.beginPath();
        ctx.moveTo(x, 0); ctx.lineTo(x + 80, 256);
        ctx.moveTo(x + 80, 0); ctx.lineTo(x, 256);
        ctx.stroke();
      }
      const cx = 512, cy = 128, r = 90;
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.9)';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r - 5, 0, Math.PI * 2); ctx.clip();
      const gasGrad = ctx.createRadialGradient(cx - 30, cy - 30, 5, cx, cy, r);
      gasGrad.addColorStop(0, '#38bdf8');
      gasGrad.addColorStop(0.6, '#1e3a8a');
      gasGrad.addColorStop(1, '#020617');
      ctx.fillStyle = gasGrad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(224, 242, 254, 0.25)';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(cx, cy, r - 20, 20, -Math.PI / 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawNatureSky(ctx, hue, brightness, fogColor) {
      const beamGrad = ctx.createRadialGradient(100, 40, 5, 100, 40, 400);
      beamGrad.addColorStop(0, 'rgba(254, 240, 138, 0.35)');
      beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
      ctx.fillStyle = beamGrad;
      ctx.beginPath(); ctx.arc(100, 40, 400, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(6, 78, 59, 0.4)';
      for (let i = 0; i < 25; i++) {
        const rx = (i * 47) % 1024;
        const ry = (i * 7) % 80;
        const rd = 40 + ((i * 11) % 60);
        ctx.beginPath(); ctx.arc(rx, ry, rd, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(20, 83, 45, 0.5)';
      ctx.beginPath();
      ctx.moveTo(0, 256);
      for (let x = 0; x <= 1024; x += 40) {
        const y = 256 - (30 + Math.sin(x * 0.02) * 20 + Math.cos(x * 0.01) * 15);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(1024, 256);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = 'rgba(20, 83, 45, 0.6)';
      for (let i = 0; i < 5; i++) {
        const bx = 200 + i * 150;
        const by = 80 + (i % 2 === 0 ? 20 : -10);
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.quadraticCurveTo(bx + 10, by - 8, bx + 20, by);
        ctx.quadraticCurveTo(bx + 30, by - 8, bx + 40, by);
        ctx.quadraticCurveTo(bx + 20, by + 5, bx, by);
        ctx.fill();
      }
    }

    function drawSpaceSky(ctx, hue, brightness, fogColor) {
      for (let i = 0; i < 200; i++) {
        const x = (i * 79) % 1024;
        const y = (i * 23) % 320;
        const size = i % 10 === 0 ? 1.8 : 1.0;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.2 + ((i * 7) % 8) / 10})`;
        ctx.fillRect(x, y, size, size);
      }
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const neb1 = ctx.createRadialGradient(300, 120, 20, 300, 120, 180);
      neb1.addColorStop(0, 'rgba(6, 182, 212, 0.15)');
      neb1.addColorStop(1, 'rgba(6, 182, 212, 0)');
      ctx.fillStyle = neb1;
      ctx.beginPath(); ctx.arc(300, 120, 180, 0, Math.PI * 2); ctx.fill();
      const neb2 = ctx.createRadialGradient(700, 100, 30, 700, 100, 220);
      neb2.addColorStop(0, 'rgba(168, 85, 247, 0.18)');
      neb2.addColorStop(1, 'rgba(168, 85, 247, 0)');
      ctx.fillStyle = neb2;
      ctx.beginPath(); ctx.arc(700, 100, 220, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawFantasySky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      for (let i = 0; i < 60; i++) {
        ctx.fillRect((i * 47) % 1024, (i * 19) % 240, 1.2, 1.2);
      }
      const m1x = 420, m1y = 90, m1r = 45;
      const grad1 = ctx.createRadialGradient(m1x - 10, m1y - 10, 5, m1x, m1y, m1r);
      grad1.addColorStop(0, '#a7f3d0');
      grad1.addColorStop(0.7, '#047857');
      grad1.addColorStop(1, '#022c22');
      ctx.fillStyle = grad1;
      ctx.beginPath(); ctx.arc(m1x, m1y, m1r, 0, Math.PI * 2); ctx.fill();
      const m2x = 580, m2y = 110, m2r = 25;
      const grad2 = ctx.createRadialGradient(m2x - 5, m2y - 5, 2, m2x, m2y, m2r);
      grad2.addColorStop(0, '#bfdbfe');
      grad2.addColorStop(0.7, '#1d4ed8');
      grad2.addColorStop(1, '#1e3a8a');
      ctx.fillStyle = grad2;
      ctx.beginPath(); ctx.arc(m2x, m2y, m2r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(30, 20, 50, 0.75)';
      ctx.beginPath();
      ctx.moveTo(150, 180); ctx.lineTo(250, 180); ctx.lineTo(220, 205); ctx.lineTo(170, 200);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(750, 170); ctx.lineTo(870, 170); ctx.lineTo(840, 192); ctx.lineTo(780, 188);
      ctx.closePath(); ctx.fill();
    }

    function drawForerunnerSky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(31, 41, 55, 0.85)';
      ctx.fillRect(180, 50, 90, 45);
      ctx.strokeStyle = 'rgba(251, 191, 36, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(185, 55, 80, 35);
      ctx.fillRect(720, 60, 120, 30);
      ctx.strokeRect(725, 65, 110, 20);
      ctx.fillStyle = 'rgba(17, 24, 39, 0.9)';
      const spireXs = [120, 380, 640, 900];
      spireXs.forEach(sx => {
        ctx.beginPath();
        ctx.moveTo(sx - 15, 256); ctx.lineTo(sx, 160); ctx.lineTo(sx + 15, 256);
        ctx.fill();
        const beamGrad = ctx.createLinearGradient(sx - 4, 0, sx + 4, 0);
        beamGrad.addColorStop(0, 'rgba(251, 191, 36, 0)');
        beamGrad.addColorStop(0.5, 'rgba(251, 191, 36, 0.4)');
        beamGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = beamGrad;
        ctx.fillRect(sx - 4, 0, 8, 160);
      });
    }

    function drawSynthwaveSky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      for (let i = 0; i < 50; i++) {
        ctx.fillRect((i * 61) % 1024, (i * 13) % 200, 1, 1);
      }
      ctx.strokeStyle = 'rgba(236, 72, 153, 0.35)';
      ctx.lineWidth = 1.2;
      for (let x = 0; x <= 1024; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 210);
        ctx.lineTo(x + (x - 512) * 0.45, 256);
        ctx.stroke();
      }
      for (let y = 210; y <= 256; y += 8) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
    }

    function drawRainyStreetsSky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      for (let i = 0; i < 12; i++) {
        const x = 20 + i * 85;
        const w = 45 + ((i * 17) % 25);
        const h = 80 + ((i * 29) % 100);
        ctx.fillRect(x, 256 - h, w, h);
        ctx.fillStyle = 'rgba(251, 191, 36, 0.35)';
        for (let wx = x + 8; wx < x + w - 8; wx += 12) {
          for (let wy = 256 - h + 15; wy < 240; wy += 18) {
            if (((wx + wy) % 5) < 2) {
              ctx.fillRect(wx, wy, 4, 6);
            }
          }
        }
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      }
    }

    function drawWinterRinkSky(ctx, hue, brightness, fogColor) {
      ctx.fillStyle = 'rgba(30, 41, 59, 0.7)';
      ctx.beginPath();
      ctx.moveTo(0, 256);
      for (let x = 0; x <= 1024; x += 60) {
        const y = 256 - (40 + Math.sin(x * 0.015) * 35 + Math.cos(x * 0.007) * 25);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(1024, 256);
      ctx.closePath();
      ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const aurGrad = ctx.createLinearGradient(0, 40, 0, 160);
      aurGrad.addColorStop(0, 'rgba(52, 211, 153, 0)');
      aurGrad.addColorStop(0.5, 'rgba(52, 211, 153, 0.35)');
      aurGrad.addColorStop(1, 'rgba(52, 211, 153, 0)');
      ctx.fillStyle = aurGrad;
      ctx.beginPath();
      ctx.moveTo(0, 80);
      for (let x = 0; x <= 1024; x += 10) {
        const y = 80 + Math.sin(x * 0.007 + 1.2) * 35 + Math.cos(x * 0.003) * 15;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(1024, 160);
      for (let x = 1024; x >= 0; x -= 10) {
        const y = 120 + Math.sin(x * 0.007 + 1.2) * 35 + Math.cos(x * 0.003) * 15;
        ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawGrifballStadiumSky(ctx, hue, brightness, fogColor) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const spotlightXs = [180, 480, 780];
      spotlightXs.forEach(sx => {
        const spotGrad = ctx.createLinearGradient(sx, 256, sx + 80, 0);
        spotGrad.addColorStop(0, 'rgba(224, 242, 254, 0.35)');
        spotGrad.addColorStop(1, 'rgba(224, 242, 254, 0)');
        ctx.fillStyle = spotGrad;
        ctx.beginPath();
        ctx.moveTo(sx - 10, 256);
        ctx.lineTo(sx + 120, 0);
        ctx.lineTo(sx + 240, 0);
        ctx.lineTo(sx + 10, 256);
        ctx.closePath();
        ctx.fill();
      });
      ctx.restore();
      ctx.strokeStyle = 'rgba(51, 65, 85, 0.4)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, 30); ctx.lineTo(1024, 30);
      ctx.moveTo(0, 60); ctx.lineTo(1024, 60);
      for (let x = 0; x < 1024; x += 100) {
        ctx.moveTo(x, 30); ctx.lineTo(x + 50, 60);
        ctx.moveTo(x + 50, 30); ctx.lineTo(x, 60);
      }
      ctx.stroke();
    }

    function drawHolodeckSky(ctx, hue, brightness, fogColor) {
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#eab308';
      ctx.shadowBlur = 4;
      for (let x = 0; x <= 1024; x += 32) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 512); ctx.stroke();
      }
      for (let y = 0; y <= 512; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
      }
      ctx.shadowBlur = 0;
    }

    function drawRustSky(ctx, hue, brightness, fogColor) {
      const sunx = 512, suny = 200, sunr = 60;
      const sGrad = ctx.createRadialGradient(sunx - 10, suny - 10, 5, sunx, suny, sunr);
      sGrad.addColorStop(0, 'rgba(255, 237, 213, 0.85)');
      sGrad.addColorStop(0.6, 'rgba(251, 146, 60, 0.4)');
      sGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
      ctx.fillStyle = sGrad;
      ctx.beginPath(); ctx.arc(sunx, suny, sunr * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(44, 24, 16, 0.8)';
      ctx.fillRect(200, 160, 15, 96);
      ctx.beginPath();
      ctx.moveTo(200, 165); ctx.lineTo(120, 120); ctx.lineTo(120, 130); ctx.lineTo(200, 180);
      ctx.fill();
      ctx.fillRect(750, 150, 80, 106);
      ctx.fillRect(770, 100, 20, 50);
      ctx.fillRect(810, 80, 15, 70);
    }

    function drawToxicSky(ctx, hue, brightness, fogColor) {
      ctx.save();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = 'rgba(74, 222, 128, 0.15)';
      for (let i = 0; i < 12; i++) {
        const rx = (i * 97) % 1024;
        const ry = 120 + ((i * 19) % 80);
        const rd = 80 + ((i * 31) % 100);
        ctx.beginPath(); ctx.arc(rx, ry, rd, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(20, 30, 20, 0.85)';
      const treeXs = [150, 320, 550, 780, 920];
      treeXs.forEach(tx => {
        ctx.beginPath();
        ctx.moveTo(tx - 4, 256); ctx.lineTo(tx, 180); ctx.lineTo(tx + 4, 256);
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(20, 30, 20, 0.85)';
        ctx.beginPath();
        ctx.moveTo(tx, 200); ctx.lineTo(tx - 25, 175);
        ctx.moveTo(tx, 215); ctx.lineTo(tx + 30, 195);
        ctx.stroke();
      });
    }

    function drawInfernoSky(ctx, hue, brightness, fogColor) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const magmaGrad = ctx.createRadialGradient(512, 150, 50, 512, 150, 300);
      magmaGrad.addColorStop(0, 'rgba(239, 68, 68, 0.35)');
      magmaGrad.addColorStop(0.5, 'rgba(249, 115, 22, 0.18)');
      magmaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = magmaGrad;
      ctx.beginPath(); ctx.arc(512, 150, 300, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(15, 10, 10, 0.95)';
      ctx.beginPath();
      ctx.moveTo(0, 256);
      for (let x = 0; x <= 1024; x += 50) {
        const y = 256 - (50 + Math.sin(x * 0.02) * 35 + Math.cos(x * 0.01) * 20);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(1024, 256);
      ctx.closePath();
      ctx.fill();
    }

    function drawMatrixSky(ctx, hue, brightness, fogColor) {
      ctx.font = 'bold 9px monospace';
      for (let c = 0; c < 35; c++) {
        const x = (c * 31) % 1024;
        let y = (c * 17) % 200;
        const length = 4 + (c % 8);
        for (let j = 0; j < length; j++) {
          const char = ((c + j) % 2 === 0) ? '0' : '1';
          ctx.fillStyle = `rgba(34, 197, 94, ${1.0 - (j / length)})`;
          ctx.fillText(char, x, y);
          y += 11;
        }
      }
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.22)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= 1024; x += 64) {
        ctx.beginPath(); ctx.moveTo(x, 220); ctx.lineTo(x, 256); ctx.stroke();
      }
    }

    function drawNebulaSky(ctx, hue, brightness, fogColor) {
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.18)';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.ellipse(512, 128, 480, 60, -Math.PI / 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(253, 224, 71, 0.08)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(512, 128, 510, 65, -Math.PI / 8, 0, Math.PI * 2);
      ctx.stroke();
      const ax = 280, ay = 80, ar = 22;
      const ag = ctx.createRadialGradient(ax - 5, ay - 5, 2, ax, ay, ar);
      ag.addColorStop(0, '#fca5a5');
      ag.addColorStop(0.7, '#dc2626');
      ag.addColorStop(1, '#7f1d1d');
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(ax, ay, ar, 0, Math.PI * 2); ctx.fill();
      const bx = 780, by = 130, br = 18;
      const bg = ctx.createRadialGradient(bx - 3, by - 3, 2, bx, by, br);
      bg.addColorStop(0, '#99f6e4');
      bg.addColorStop(0.7, '#0d9488');
      bg.addColorStop(1, '#115e59');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
    }

    // Make every slider's value badge click-to-edit so exact numbers can be typed
    // instead of only dragging. Reuses each slider's existing oninput handler.
    function wireEditableBadges(root) {
      if (!root) return;
      root.querySelectorAll('.mapmaker-field').forEach(field => {
        const slider = field.querySelector('input[type="range"].mapmaker-slider');
        const badge = field.querySelector('.mapmaker-value-badge');
        if (!slider || !badge || badge.dataset.editable) return;
        badge.dataset.editable = '1';
        badge.title = 'Click to type an exact value';

        badge.addEventListener('click', () => {
          if (slider.disabled) return;
          const input = document.createElement('input');
          input.type = 'number';
          input.className = 'mapmaker-value-edit';
          input.value = parseFloat(slider.value);
          if (slider.min !== '') input.min = slider.min;
          if (slider.max !== '') input.max = slider.max;
          if (slider.step !== '') input.step = slider.step;

          let done = false;
          const finish = (apply) => {
            if (done) return;
            done = true;
            const typed = parseFloat(input.value);
            if (apply && !isNaN(typed)) {
              let v = typed;
              const mn = parseFloat(slider.min), mx = parseFloat(slider.max);
              if (!isNaN(mn)) v = Math.max(mn, v);
              if (!isNaN(mx)) v = Math.min(mx, v);
              const exact = String(v);
              // Range inputs round sub-step values (e.g. 17.34 → 17.3), so feed the
              // EXACT value straight to the slider's oninput handler via a temporary
              // `value` getter, bypassing the element's own quantization.
              Object.defineProperty(slider, 'value', { configurable: true, get: () => exact, set: () => {} });
              slider.dispatchEvent(new Event('input', { bubbles: true }));
              delete slider.value;
              // Re-render so every badge/slider reflects the true stored value
              // (positions are clamped to 1 decimal by the transform-gizmo sync).
              const panel = document.getElementById('inspector-panel');
              const st = panel ? panel.scrollTop : 0;
              renderInspector();
              if (panel) panel.scrollTop = st;
            } else {
              input.replaceWith(badge);
            }
          };

          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); finish(true); }
            else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
          });
          input.addEventListener('blur', () => finish(true));

          badge.replaceWith(input);
          input.focus();
          input.select();
        });
      });
    }
