<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iBrawls Standalone 3D Map Maker</title>
  <!-- Tailwind CSS for rich modern UI grid layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js, OrbitControls, and TransformControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      user-select: none;
      overflow: hidden;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(6, 182, 212, 0.4);
    }
    /* Active selection bounds */
    .glass-panel {
      background: rgba(10, 15, 30, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* Map Maker Design System */
    .mapmaker-field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }
    .mapmaker-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: rgba(148, 163, 184, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mapmaker-value-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #22d3ee;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      font-weight: 800;
    }
    .mapmaker-input {
      background: rgba(3, 7, 18, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      color: #f3f4f6 !important;
      border-radius: 0.5rem !important;
      padding: 0.5rem 0.75rem !important;
      font-size: 0.75rem !important;
      outline: none !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }
    .mapmaker-input:focus {
      border-color: rgba(6, 182, 212, 0.5) !important;
      box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.15) !important;
      background: rgba(3, 7, 18, 0.85) !important;
    }
    .mapmaker-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
      transition: background 0.2s;
    }
    .mapmaker-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #22d3ee;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(6, 182, 212, 0.6);
      transition: transform 0.1s;
    }
    .mapmaker-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .mapmaker-preset-grid {
      display: grid;
      grid-template-cols: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
    }
    .mapmaker-preset-btn {
      background: rgba(255, 255, 255, 0.02) !important;
      border: 1px solid rgba(255, 255, 255, 0.05) !important;
      border-radius: 0.5rem !important;
      color: #e2e8f0 !important;
      font-weight: 600 !important;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1) !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0.375rem !important;
      cursor: pointer !important;
    }
    .mapmaker-preset-btn:hover {
      background: rgba(6, 182, 212, 0.08) !important;
      border-color: rgba(6, 182, 212, 0.3) !important;
      color: #22d3ee !important;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.05) !important;
    }
    .mapmaker-item-list {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      max-height: 350px;
      overflow-y: auto;
      padding-right: 2px;
    }
    .mapmaker-drag-over {
      border: 1.5px dashed #22d3ee !important;
      background: rgba(6, 182, 212, 0.12) !important;
      box-shadow: 0 0 10px rgba(6, 182, 212, 0.15);
    }
    .mapmaker-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.5rem;
      padding: 0.5rem 0.75rem;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.75rem;
    }
    .mapmaker-item-row:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }
    .mapmaker-item-row-selected {
      background: rgba(6, 182, 212, 0.08) !important;
      border-color: rgba(6, 182, 212, 0.3) !important;
      color: #22d3ee !important;
    }
    .mapmaker-row-actions {
      display: flex;
      align-items: center;
      gap: 0.375rem;
    }
    .mapmaker-row-btn {
      color: rgba(255, 255, 255, 0.35);
      background: transparent !important;
      border: none !important;
      transition: color 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .mapmaker-row-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body class="w-screen h-screen flex relative">

  <!-- LEFT VIEWPORT + BOTTOM CONTENT BROWSER PANEL -->
  <div class="flex-grow flex flex-col min-w-0 overflow-hidden relative" id="left-main-panel">
    
    <!-- 3D VIEWPORT -->
    <div class="flex-grow w-full relative min-h-0" id="viewport-container">
      <canvas id="editor-canvas" class="w-full h-full block"></canvas>

      <!-- TOPBAR OVERLAY -->
      <div class="absolute top-4 left-4 right-4 flex justify-between items-center pointer-events-none z-10">
        <div class="pointer-events-auto flex items-center gap-3">
          <h1 class="text-2xl font-black italic tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">
            iBrawls Map Maker
          </h1>
          <span class="text-[9px] font-mono font-extrabold uppercase tracking-widest text-cyan-400 bg-cyan-950/50 border border-cyan-800/50 px-2 py-0.5 rounded">
            Standalone Local Build
          </span>
        </div>

        <div class="pointer-events-auto flex gap-2">
          <label class="h-10 px-4 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-cyan-500/50 text-white hover:text-cyan-400 text-xs font-bold rounded-lg flex items-center gap-1.5 cursor-pointer transition-all duration-200 shadow-lg">
            <i data-lucide="upload" class="w-4 h-4"></i> Import JSON
            <input type="file" id="import-input" accept=".json" class="hidden">
          </label>

          <button onclick="handleExportJSON()" class="h-10 px-4 bg-slate-900/80 hover:bg-slate-800 border border-white/10 hover:border-cyan-500/50 text-white hover:text-cyan-400 text-xs font-bold rounded-lg flex items-center gap-1.5 transition-all duration-200 shadow-lg">
            <i data-lucide="save" class="w-4 h-4"></i> Export JSON
          </button>

          <button id="navmesh-btn" onclick="triggerBakeNavMesh()" class="h-10 px-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-black uppercase tracking-wider rounded-lg flex items-center gap-1.5 transition-all duration-200 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:shadow-[0_0_20px_rgba(6,182,212,0.5)]">
            <i data-lucide="refresh-cw" class="w-4 h-4" id="bake-icon"></i> Bake Nav Mesh
          </button>
        </div>
      </div>

      <!-- INSTRUCTIONS / CONTROLS LEGEND CARD -->
      <div class="absolute bottom-4 left-4 glass-panel p-4 rounded-xl shadow-2xl pointer-events-auto max-w-[280px] flex flex-col gap-2 z-10 text-[11px] text-white/50">
        <h3 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center gap-1.5">
          <i data-lucide="help-circle" class="w-3.5 h-3.5"></i> Editor Controls
        </h3>
        <div class="flex justify-between items-center">
          <span>Rotate camera</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">LMB + Drag</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Pan viewport</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">RMB + Drag</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Zoom Camera</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">Scroll Wheel</span>
        </div>
        <div class="flex justify-between items-center">
          <span>Select Object</span>
          <span class="font-mono text-[9px] bg-white/10 px-1.5 py-0.5 rounded border border-white/15 text-white/80">Left Click mesh</span>
        </div>
      </div>

      <!-- TRANSFORM MODE SELECTOR -->
      <div class="absolute bottom-4 right-4 glass-panel p-1.5 rounded-xl shadow-2xl pointer-events-auto flex items-center gap-1 z-10">
        <button id="mode-translate-btn" onclick="setTransformMode('translate')" class="px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer bg-cyan-500/25 text-cyan-400 border border-cyan-500/40">
          <i data-lucide="move" class="w-3.5 h-3.5"></i> Movement
        </button>
        <button id="mode-rotate-btn" onclick="setTransformMode('rotate')" class="px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer text-slate-400 border border-transparent hover:text-white">
          <i data-lucide="rotate-3d" class="w-3.5 h-3.5"></i> Rotation
        </button>
      </div>
    </div>

    <!-- RESIZER HANDLE FOR BOTTOM CONTENT BROWSER -->
    <div class="h-1.5 w-full bg-[#05070c] border-y border-white/5 hover:bg-cyan-500/40 active:bg-cyan-500/60 cursor-ns-resize transition-all duration-150 shrink-0 z-20 flex items-center justify-center gap-0.5 group" id="bottom-resizer" title="Drag to resize Content Browser">
      <div class="w-8 h-0.5 bg-slate-700 group-hover:bg-cyan-400 rounded-full transition-colors"></div>
    </div>

    <!-- BOTTOM CONTENT BROWSER (UNREAL STYLE) -->
    <div class="w-full glass-panel border-t border-white/5 flex flex-col shrink-0 z-10 bg-[#090d16]/95 backdrop-blur-md" id="bottom-content-browser" style="height: 280px;">
      <!-- Populated dynamically via renderContentBrowser() in Javascript -->
    </div>

  </div>

  <!-- RESIZER HANDLE FOR RIGHT SIDEBAR -->
  <div class="w-1.5 h-full bg-[#05070c] border-x border-white/5 hover:bg-cyan-500/40 active:bg-cyan-500/60 cursor-ew-resize transition-all duration-150 shrink-0 z-20 flex flex-col items-center justify-center gap-0.5 group" id="sidebar-resizer" title="Drag to resize Sidebar">
    <div class="h-8 w-0.5 bg-slate-700 group-hover:bg-cyan-400 rounded-full transition-colors"></div>
  </div>

  <!-- EDITOR INSPECTOR SIDEBAR -->
  <div class="h-full glass-panel border-l border-white/5 flex flex-col shadow-3xl z-10 shrink-0" id="right-sidebar" style="width: 380px;">
    <!-- Sidebar Title -->
    <div class="p-4 border-b border-white/5 flex justify-between items-center shrink-0">
      <span class="text-sm font-black uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">
        Simulation Builder
      </span>
      <button onclick="toggleNavMeshOverlay()" id="toggle-nav-btn" class="p-2 border border-white/10 rounded-lg hover:bg-white/5 text-slate-400 hover:text-white transition-colors" title="Toggle Nav Mesh Overlay">
        <i data-lucide="eye" class="w-4 h-4" id="nav-eye-icon"></i>
      </button>
    </div>

    <!-- TAB SWITCHER -->
    <div class="grid grid-cols-4 bg-black/35 border-b border-white/5 text-center shrink-0">
      <button onclick="switchTab('scene')" id="tab-scene" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-cyan-500 bg-cyan-500/5 text-cyan-400 flex flex-col items-center gap-1">
        <i data-lucide="compass" class="w-4 h-4"></i> Scene
      </button>
      <button onclick="switchTab('lights')" id="tab-lights" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-white flex flex-col items-center gap-1">
        <i data-lucide="sun" class="w-4 h-4"></i> Lights
      </button>
      <button onclick="switchTab('objects')" id="tab-objects" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-white flex flex-col items-center gap-1">
        <i data-lucide="layers" class="w-4 h-4"></i> Outliner
      </button>
      <button onclick="switchTab('spawns')" id="tab-spawns" class="py-3 text-[10px] font-bold uppercase tracking-wider border-b-2 border-transparent text-slate-400 hover:text-white flex flex-col items-center gap-1">
        <i data-lucide="map-pin" class="w-4 h-4"></i> Spawns
      </button>
    </div>

    <!-- SCROLLABLE INSPECTOR PANEL CONTENT -->
    <div id="inspector-panel" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
      <!-- Tabs panels rendered dynamically in JavaScript -->
    </div>
  </div>

    function initThree() {
      const container = document.getElementById('viewport-container');
      
      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(fogColor);
      scene.fog = new THREE.FogExp2(fogColor, fogDensity);

      // Camera
      camera = new THREE.PerspectiveCamera(55, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 25, 35);

      // Renderer
      renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('editor-canvas'), antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2.05; // prevent going below floor
      controls.minDistance = 3;
      controls.maxDistance = 100;

      // Lighting Base
      const ambientLight = new THREE.AmbientLight(ambientColor, ambientIntensity);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(directColor, directIntensity);
      dirLight.position.set(directPosX, directPosY, directPosZ);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 1024;
      dirLight.shadow.mapSize.height = 1024;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 80;
      const dSize = 25;
      dirLight.shadow.camera.left = -dSize;
      dirLight.shadow.camera.right = dSize;
      dirLight.shadow.camera.top = dSize;
      dirLight.shadow.camera.bottom = -dSize;
      scene.add(dirLight);

      // Workspace Groups
      objectsGroup = new THREE.Group();
      spawnsGroup = new THREE.Group();
      lightsGroup = new THREE.Group();
      navMeshGroup = new THREE.Group();
      scene.add(objectsGroup);
      scene.add(spawnsGroup);
      scene.add(lightsGroup);
      scene.add(navMeshGroup);

      // Boundary outline
      rebuildBoundaryGrid();

      // Selection Helper
      selectionHelper = new THREE.BoxHelper(new THREE.Mesh(), '#22d3ee');
      selectionHelper.visible = false;
      scene.add(selectionHelper);

      // Transform Controls Translation/Rotation Gizmo
      transformControls = new THREE.TransformControls(camera, renderer.domElement);
      transformControls.size = 0.85;
      transformControls.setMode(currentTransformMode);
      scene.add(transformControls);

      // Disable/enable OrbitControls during drag; trigger final scene rebuild on release
      transformControls.addEventListener('dragging-changed', (e) => {
        controls.enabled = !e.value;
        if (!e.value) {
          rebuildScene();
        }
      });

      // Real-time synchronization during drag movement
      transformControls.addEventListener('change', () => {
        if (!transformControls.object) return;
        const target = transformControls.object;

        if (target.userData && target.userData.id) {
          // Sync custom map object position
          const objId = target.userData.id;
          const obj = objects.find(o => o.id === objId);
          if (obj) {
            obj.position.x = parseFloat(target.position.x.toFixed(1));
            obj.position.y = parseFloat(target.position.y.toFixed(1));
            obj.position.z = parseFloat(target.position.z.toFixed(1));

            // Sync custom map object rotation
            if (!obj.rotation) obj.rotation = { x: 0, y: 0, z: 0 };
            obj.rotation.x = parseFloat(target.rotation.x.toFixed(3));
            obj.rotation.y = parseFloat(target.rotation.y.toFixed(3));
            obj.rotation.z = parseFloat(target.rotation.z.toFixed(3));

            // Sync sidebar DOM inputs in real-time
            const inputs = document.getElementById('inspector-panel');
            if (inputs) {
              const posXInput = inputs.querySelector('input[oninput*="pos_x"]');
              if (posXInput) {
                posXInput.value = obj.position.x;
                const readout = posXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.x}m`;
              }
              const posYInput = inputs.querySelector('input[oninput*="pos_y"]');
              if (posYInput) {
                posYInput.value = obj.position.y;
                const readout = posYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.y}m`;
              }
              const posZInput = inputs.querySelector('input[oninput*="pos_z"]');
              if (posZInput) {
                posZInput.value = obj.position.z;
                const readout = posZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${obj.position.z}m`;
              }

              // Sync rotation inputs
              const rotXInput = inputs.querySelector('input[oninput*="rot_x"]');
              if (rotXInput) {
                let deg = Math.round(obj.rotation.x * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotXInput.value = deg;
                const readout = rotXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
              const rotYInput = inputs.querySelector('input[oninput*="rot_y"]');
              if (rotYInput) {
                let deg = Math.round(obj.rotation.y * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotYInput.value = deg;
                const readout = rotYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
              const rotZInput = inputs.querySelector('input[oninput*="rot_z"]');
              if (rotZInput) {
                let deg = Math.round(obj.rotation.z * (180/Math.PI));
                deg = (deg % 360 + 360) % 360;
                rotZInput.value = deg;
                const readout = rotZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${deg}°`;
              }
            }

            // Sync bounding box helper outline
            if (selectionHelper && selectionHelper.visible) {
              selectionHelper.setFromObject(target);
            }
          }
        } else if (target.userData && target.userData.lightId) {
          // Sync point light source position
          const lightId = target.userData.lightId;
          const pl = pointLights.find(l => l.id === lightId);
          if (pl) {
            pl.position.x = parseFloat(target.position.x.toFixed(1));
            pl.position.y = parseFloat(target.position.y.toFixed(1));
            pl.position.z = parseFloat(target.position.z.toFixed(1));

            // Sync actual PointLight emitting source in scene in real-time
            const actualLight = lightsGroup.children.find(c => c.isPointLight && c.userData && c.userData.lightSourceId === lightId);
            if (actualLight) {
              actualLight.position.copy(target.position);
            }

            // Sync sidebar DOM inputs in real-time
            const inputs = document.getElementById('inspector-panel');
            if (inputs) {
              const posXInput = inputs.querySelector('input[oninput*="pos_x"]');
              if (posXInput) {
                posXInput.value = pl.position.x;
                const readout = posXInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.x}m`;
              }
              const posYInput = inputs.querySelector('input[oninput*="pos_y"]');
              if (posYInput) {
                posYInput.value = pl.position.y;
                const readout = posYInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.y}m`;
              }
              const posZInput = inputs.querySelector('input[oninput*="pos_z"]');
              if (posZInput) {
                posZInput.value = pl.position.z;
                const readout = posZInput.previousElementSibling?.querySelector('.mapmaker-value-badge');
                if (readout) readout.textContent = `${pl.position.z}m`;
              }
            }
          }
        }
      });

      // Click raycaster Setup
      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      // Animation tick
      animate();
    }

    let lastTime = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      // Slow hover rotation on spawn indicators for micro-animations
      const time = Date.now() * 0.002;
      spawnsGroup.children.forEach((group, idx) => {
        group.position.y = 0.9 + Math.sin(time + idx * 1.5) * 0.08;
      });

      // Animate rain particles in editor if present
      const rainObj = scene.getObjectByName('rain_particles');
      if (rainObj && rainObj instanceof THREE.Points) {
        const positions = rainObj.geometry.attributes.position.array;
        const velocities = rainObj.userData.velocities;
        const radius = rainObj.userData.arenaRadius || 20;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3] += velocities[i].x * dt;
          positions[i * 3 + 1] += velocities[i].y * dt;
          positions[i * 3 + 2] += velocities[i].z * dt;

          if (positions[i * 3 + 1] <= 0.05) {
            positions[i * 3] = (Math.random() - 0.5) * radius * 3;
            positions[i * 3 + 1] = 25;
            positions[i * 3 + 2] = (Math.random() - 0.5) * radius * 2;
          }
        }
        rainObj.geometry.attributes.position.needsUpdate = true;
      }

      // Animate snow particles in editor if present
      const snowObj = scene.getObjectByName('snow_particles');
      if (snowObj && snowObj instanceof THREE.Points) {
        const positions = snowObj.geometry.attributes.position.array;
        const velocities = snowObj.userData.velocities;
        const radius = snowObj.userData.arenaRadius || 20;
        const count = positions.length / 3;

        for (let i = 0; i < count; i++) {
          positions[i * 3] += velocities[i].x * dt;
          positions[i * 3 + 1] += velocities[i].y * dt;
          positions[i * 3 + 2] += velocities[i].z * dt;

          if (positions[i * 3 + 1] <= 0.05) {
            positions[i * 3] = (Math.random() - 0.5) * radius * 3.2;
            positions[i * 3 + 1] = 25;
            positions[i * 3 + 2] = (Math.random() - 0.5) * radius * 2.2;
          }
        }
        snowObj.geometry.attributes.position.needsUpdate = true;
      }

      renderer.render(scene, camera);
    }

    function rebuildBoundaryGrid() {
      if (boundaryGrid) scene.remove(boundaryGrid);

      boundaryGrid = new THREE.Group();

      if (mapShape === 'rectangular') {
        // Draw rectangular boundary outline
        const bx = arenaRadius * 1.2;
        const bz = arenaRadius * 0.6;
        const points = [
          new THREE.Vector3(-bx, 0.05, -bz),
          new THREE.Vector3(bx, 0.05, -bz),
          new THREE.Vector3(bx, 0.05, bz),
          new THREE.Vector3(-bx, 0.05, bz),
          new THREE.Vector3(-bx, 0.05, -bz)
        ];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
        const borderColor = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#ffffff' : '#38bdf8');
        const lineMat = new THREE.LineBasicMaterial({ color: borderColor, linewidth: 2 });
        const border = new THREE.Line(lineGeo, lineMat);
        boundaryGrid.add(border);

        // Scaled grid helper inside boundary (aspect ratio 2:1)
        const gridColor1 = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#334155' : '#1e293b');
        const gridColor2 = theme === 'synthwave' ? '#06b6d4' : theme === 'winter_rink' ? '#f1f5f9' : (theme === 'grifball_stadium' ? '#0f172a' : '#0f172a');
        const grid = new THREE.GridHelper(arenaRadius * 2.4, 24, gridColor1, gridColor2);
        grid.scale.z = 0.5;
        grid.position.y = -0.05;
        boundaryGrid.add(grid);
      } else {
        // High-tech circular boundary ring
        const ringGeo = new THREE.RingGeometry(arenaRadius - 0.1, arenaRadius + 0.1, 64);
        ringGeo.rotateX(-Math.PI / 2);
        const ringColor = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#ffffff' : '#38bdf8');
        const ringMat = new THREE.MeshBasicMaterial({ color: ringColor, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        boundaryGrid.add(ring);

        // Grid helper inside boundary
        const gridColor1 = theme === 'synthwave' ? '#ec4899' : theme === 'winter_rink' ? '#93c5fd' : (theme === 'grifball_stadium' ? '#334155' : '#1e293b');
        const gridColor2 = theme === 'synthwave' ? '#06b6d4' : theme === 'winter_rink' ? '#f1f5f9' : (theme === 'grifball_stadium' ? '#0f172a' : '#0f172a');
        const grid = new THREE.GridHelper(arenaRadius * 2, 20, gridColor1, gridColor2);
        grid.position.y = -0.05;
        boundaryGrid.add(grid);
      }

      scene.add(boundaryGrid);
    }

    // procedurally generated textures
    function generateCustomTexture(type, colorHex) {
      const size = 256;
      const resolution = 2048;
      const scaleFactor = resolution / size;
      const canvas = document.createElement('canvas');
      canvas.width = resolution;
      canvas.height = resolution;
      const ctx = canvas.getContext('2d');
      ctx.scale(scaleFactor, scaleFactor);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, size, size);

      if (type === 'nature_grass') {
        ctx.fillStyle = '#15803d';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#166534';
        for (let i = 0; i < 2000; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 2, 4);
        }
      } else if (type === 'nature_mossy_stone') {
        ctx.fillStyle = '#475569';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 15; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * size, Math.random() * size, 10 + Math.random() * 20, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'nature_wood') {
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#451a03';
        ctx.lineWidth = 4;
        for (let i = 0; i < size; i += 20) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.bezierCurveTo(size / 3, i + 10, 2 * size / 3, i - 10, size, i);
          ctx.stroke();
        }
      } else if (type === 'space_alloy') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.strokeRect(40, 40, size - 80, size - 80);
      } else if (type === 'space_meteorite') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#0f172a';
        for (let i = 0; i < 30; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 8, 8);
        }
      } else if (type === 'space_lunar_dust') {
        ctx.fillStyle = '#64748b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#475569';
        for (let i = 0; i < 400; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 3, 3);
        }
      } else if (type === 'futuristic_carbon') {
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#0f172a';
        for (let x = 0; x < size; x += 16) {
          for (let y = 0; y < size; y += 16) {
            ctx.fillRect(x + (y % 32 === 0 ? 8 : 0), y, 8, 8);
          }
        }
      } else if (type === 'futuristic_hex') {
        ctx.fillStyle = '#0a0f1d';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 1.5;
        const hexRadius = 24;
        const drawHex = (x, y) => {
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            ctx.lineTo(x + Math.cos(angle) * hexRadius, y + Math.sin(angle) * hexRadius);
          }
          ctx.closePath();
          ctx.stroke();
        };
        for (let x = 0; x < size + hexRadius; x += hexRadius * 1.5) {
          let row = 0;
          for (let y = 0; y < size + hexRadius; y += hexRadius * Math.sqrt(3)) {
            drawHex(x, y + (row % 2 === 0 ? 0 : (hexRadius * Math.sqrt(3)) / 2));
            row++;
          }
        }
      } else if (type === 'futuristic_shield') {
        ctx.fillStyle = '#083344';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#22d3ee';
        ctx.lineWidth = 2.5;
        for (let i = 0; i < size; i += 32) {
          ctx.beginPath();
          ctx.moveTo(0, i);
          ctx.lineTo(size, i);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i, size);
          ctx.stroke();
        }
      } else if (type === 'city_concrete') {
        ctx.fillStyle = '#4b5563';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#374151';
        ctx.lineWidth = 2;
        ctx.strokeRect(0, 0, size, size);
        ctx.strokeRect(0, 0, size / 2, size / 2);
      } else if (type === 'city_brick') {
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2.5;
        for (let y = 0; y < size; y += 32) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(size, y);
          ctx.stroke();
          const offset = y % 64 === 0 ? 32 : 0;
          for (let x = offset; x < size; x += 64) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x, y + 32);
            ctx.stroke();
          }
        }
      } else if (type === 'fantasy_runed_stone') {
        ctx.fillStyle = '#311042';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#d946ef';
        ctx.lineWidth = 3.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        // Draw some cryptic runic designs
        ctx.beginPath();
        ctx.moveTo(40, 40); ctx.lineTo(120, 120); ctx.lineTo(120, 40);
        ctx.moveTo(180, 40); ctx.lineTo(180, 120); ctx.lineTo(220, 80);
        ctx.stroke();
      } else if (type === 'forerunner_panel') {
        // Dark forerunner metallic alloy plates with golden circuit runs
        ctx.fillStyle = '#17191e';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#282b35';
        ctx.lineWidth = 2.5;
        for (let idx = 0; idx <= size; idx += 64) {
          ctx.beginPath(); ctx.moveTo(idx, 0); ctx.lineTo(idx, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, idx); ctx.lineTo(size, idx); ctx.stroke();
        }
        ctx.strokeStyle = colorHex || '#eab308';
        ctx.lineWidth = 1.8;
        ctx.shadowColor = colorHex || '#eab308';
        ctx.shadowBlur = 6;
        for (let rx = 32; rx < size; rx += 64) {
          for (let ry = 32; ry < size; ry += 64) {
            ctx.strokeRect(rx - 12, ry - 12, 24, 24);
            ctx.beginPath();
            ctx.arc(rx, ry, 4, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;
      } else if (type === 'forerunner_gold') {
        // Brushed forerunner gold plates with fine runic lines
        ctx.fillStyle = '#a16207'; // deep gold-bronze
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = colorHex || '#fbbf24'; // bright glowing gold
        ctx.lineWidth = 2.0;
        ctx.shadowColor = colorHex || '#fbbf24';
        ctx.shadowBlur = 7;
        for (let i = 16; i < size; i += 32) {
          ctx.beginPath();
          ctx.moveTo(i, 0); ctx.lineTo(i, size);
          ctx.moveTo(0, i); ctx.lineTo(size, i);
          ctx.stroke();
        }
        for (let x = 32; x < size; x += 64) {
          for (let y = 32; y < size; y += 64) {
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.shadowBlur = 0;
      } else if (type === 'synthwave_grid') {
        ctx.fillStyle = '#06020f';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 2.0;
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 6;
        for (let i = 0; i <= size; i += 32) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
        }
        ctx.strokeStyle = '#ec4899';
        ctx.lineWidth = 1.0;
        ctx.shadowColor = '#ec4899';
        ctx.shadowBlur = 3;
        for (let i = 16; i < size; i += 32) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
        }
        ctx.shadowBlur = 0;
      } else if (type === 'synthwave_neon_laser') {
        ctx.fillStyle = '#080214';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = colorHex || '#ec4899';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = colorHex || '#ec4899';
        ctx.shadowBlur = 7;
        for (let i = -128; i < size; i += 64) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + 128, size);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      } else if (type === 'synthwave_chrome') {
        const grad = ctx.createLinearGradient(0, 0, 0, size);
        grad.addColorStop(0, '#06b6d4');
        grad.addColorStop(0.48, '#08041d');
        grad.addColorStop(0.5, '#ffffff');
        grad.addColorStop(0.52, '#d946ef');
        grad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1.0;
        for (let y = 16; y < size; y += 24) {
          if (Math.abs(y - 128) > 10) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
          }
        }
      } else if (type === 'rainy_streets_asphalt') {
        ctx.fillStyle = '#0f121a';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        for (let i = 0; i < 600; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
        }
        ctx.fillStyle = 'rgba(6, 182, 212, 0.05)';
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * size, Math.random() * size, 25 + Math.random() * 25, 10 + Math.random() * 15, Math.random() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 0.8;
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * size, Math.random() * size, 3 + Math.random() * 10, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.strokeStyle = '#05070a';
        ctx.lineWidth = 2.5;
        for (let idx = 0; idx <= size; idx += 128) {
          ctx.beginPath(); ctx.moveTo(idx, 0); ctx.lineTo(idx, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, idx); ctx.lineTo(size, idx); ctx.stroke();
        }
      } else if (type === 'rainy_streets_neon_glow') {
        ctx.fillStyle = '#1c1917';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = colorHex || '#ea580c';
        ctx.lineWidth = 2.5;
        ctx.shadowColor = colorHex || '#ea580c';
        ctx.shadowBlur = 6;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.strokeRect(40, 40, size - 80, size - 80);
        for (let i = 0; i < size; i += 32) {
          ctx.beginPath();
          ctx.moveTo(i, 10); ctx.lineTo(i + 20, 40);
          ctx.moveTo(i, 216); ctx.lineTo(i + 20, 246);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
      } else if (type === 'rainy_streets_dog_billboard') {
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.08)';
        ctx.lineWidth = 0.5;
        for (let y = 0; y < size; y += 4) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
        }
        ctx.strokeStyle = '#06b6d4';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#06b6d4';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        // Tech dog head
        ctx.moveTo(95, 95); ctx.lineTo(161, 95); ctx.lineTo(170, 117); ctx.lineTo(161, 135); ctx.lineTo(95, 135); ctx.lineTo(86, 117); ctx.closePath();
        // Snout
        ctx.moveTo(161, 110); ctx.lineTo(182, 110); ctx.lineTo(182, 125); ctx.lineTo(161, 125);
        // Collar
        ctx.moveTo(100, 135); ctx.lineTo(100, 147); ctx.lineTo(130, 147); ctx.lineTo(130, 135);
        // Ears
        ctx.moveTo(100, 95); ctx.lineTo(87, 62); ctx.lineTo(112, 95);
        ctx.moveTo(156, 95); ctx.lineTo(168, 62); ctx.lineTo(143, 95);
        ctx.stroke();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.arc(147, 107, 4, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#ec4899';
        ctx.fillStyle = '#f472b6';
        ctx.font = '900 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('UPGRADE', size / 2, 205);
        ctx.shadowColor = '#06b6d4';
        ctx.fillStyle = '#22d3ee';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText("BRAWL'S BEST FRIEND", size / 2, 48);
        ctx.shadowBlur = 0;
      } else if (type === 'winter_ice') {
        // Rink lines scaled for size = 256
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(0, 0, size, size);

        // Skate marks
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 25; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * size, Math.random() * size, 8 + Math.random() * 25, Math.random() * Math.PI, Math.random() * Math.PI * 2);
          ctx.stroke();
        }

        // Red Goal Lines (at x = 22 and x = size - 22)
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(22, 0); ctx.lineTo(22, size);
        ctx.moveTo(size - 22, 0); ctx.lineTo(size - 22, size);
        ctx.stroke();

        // Red Goal Creases
        ctx.beginPath();
        ctx.arc(22, size / 2, 10, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(size - 22, size / 2, 10, Math.PI / 2, -Math.PI / 2);
        ctx.stroke();

        // Blue Lines (at x = 85 and x = 171)
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(85, 0); ctx.lineTo(85, size);
        ctx.moveTo(171, 0); ctx.lineTo(171, size);
        ctx.stroke();

        // Red Center Line (at x = 128)
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(128, 0); ctx.lineTo(128, size);
        ctx.stroke();

        // Blue Center Face-off Circle (radius 20, red center dot)
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(128, 128, 20, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(128, 128, 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Corner circles
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.5;
        const spots = [[57, 60], [57, 196], [199, 60], [199, 196]];
        spots.forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(cx, cy, 12.5, 0, Math.PI * 2);
          ctx.stroke();
          ctx.fillStyle = '#ef4444';
          ctx.beginPath();
          ctx.arc(cx, cy, 2, 0, Math.PI * 2);
          ctx.fill();
        });
      } else if (type === 'winter_snow') {
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < 250; i++) {
          ctx.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
        }
        ctx.fillStyle = 'rgba(186, 230, 253, 0.2)';
        for (let i = 0; i < 8; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * size, Math.random() * size, 25 + Math.random() * 40, 6 + Math.random() * 10, Math.random() * 0.2 - 0.1, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'winter_glacier_glass') {
        ctx.fillStyle = 'rgba(147, 197, 253, 0.4)';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.lineWidth = 1.0;
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(Math.random() * size, 0);
          ctx.lineTo(Math.random() * size, 70);
          ctx.lineTo(Math.random() * size, 180);
          ctx.lineTo(Math.random() * size, size);
          ctx.stroke();
        }
      } else if (type === 'stadium_steel_grid') {
        ctx.fillStyle = '#111318';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#08090c';
        ctx.lineWidth = 2;
        for (let i = 0; i <= size; i += 64) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,0.4)';
        ctx.lineWidth = 3;
        ctx.strokeRect(3, 3, size - 6, size - 6);
      } else if (type === 'stadium_scoreboard_screen') {
        ctx.fillStyle = '#06080e';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.fillStyle = 'rgba(0, 136, 255, 0.1)'; ctx.fillRect(10, 10, size/2 - 10, size - 20);
        ctx.fillStyle = 'rgba(255, 51, 68, 0.1)'; ctx.fillRect(size/2, 10, size/2 - 10, size - 20);
        ctx.beginPath();
        ctx.arc(size/2, size/2, 20, 0, Math.PI * 2);
        ctx.stroke();
      } else if (type === 'stadium_advertisement_sapphire') {
        ctx.fillStyle = '#05040a';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.beginPath(); ctx.arc(size/2, size/2, 35, 0, Math.PI, true); ctx.stroke();
      } else if (type === 'stadium_advertisement_gauss') {
        ctx.fillStyle = '#060402';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#ea580c';
        ctx.lineWidth = 2.5;
        ctx.strokeRect(10, 10, size - 20, size - 20);
        ctx.strokeStyle = '#eab308';
        ctx.beginPath();
        ctx.moveTo(size/2, 40); ctx.lineTo(size/2 - 15, size/2 + 5); ctx.lineTo(size/2 + 5, size/2 + 5); ctx.lineTo(size/2 - 5, size - 40);
        ctx.stroke();
      } else {
        // Plain colored fallback
        ctx.fillStyle = colorHex || '#4b5563';
        ctx.fillRect(0, 0, size, size);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.strokeRect(5, 5, size - 10, size - 10);
      }

      const canvasTexture = new THREE.CanvasTexture(canvas);
      canvasTexture.wrapS = THREE.RepeatWrapping;
      canvasTexture.wrapT = THREE.RepeatWrapping;
      if (type === 'winter_ice' || type === 'stadium_scoreboard_screen' || type === 'stadium_advertisement_sapphire' || type === 'stadium_advertisement_gauss') {
        canvasTexture.repeat.set(1, 1);
      } else if (type === 'stadium_steel_grid') {
        canvasTexture.repeat.set(1.5, 1.5);
      } else {
        canvasTexture.repeat.set(1.5, 1.5);
      }
      return canvasTexture;
    }

                <span class="mapmaker-label">Coordinate Position Z <span class="mapmaker-value-badge">${spawnPoints[selectedSpawnIdx].z}m</span></span>
                <input type="range" min="-30" max="30" step="0.5" oninput="handleUpdateSpawn('z', parseFloat(this.value))" class="mapmaker-slider" value="${spawnPoints[selectedSpawnIdx].z}">
              </div>
            </div>
          ` : ''}
        `;
      }

      rebuildScene();
      renderContentBrowser();
      lucide.createIcons();
    }

    // SCENE REBUILD & GRAPHICS PIPELINE
    let meshMap = new Map();
    function rebuildScene() {
      if (!scene) return;

      // Update Sky & Fog
      scene.background.set(fogColor);
      scene.fog.color.set(fogColor);
      scene.fog.density = fogDensity;

      // Update base light colors & intensity
      const ambientLight = scene.children.find(c => c.isAmbientLight);
      if (ambientLight) {
        ambientLight.color.set(ambientColor);
        ambientLight.intensity = ambientIntensity;
      }

      const dirLight = scene.children.find(c => c.isDirectionalLight);
      if (dirLight) {
        dirLight.intensity = directIntensity;
        dirLight.position.set(directPosX, directPosY, directPosZ);
      }

      // Rebuild Obstacles
      while (objectsGroup.children.length > 0) {
        objectsGroup.remove(objectsGroup.children[0]);
      }
      meshMap.clear();

      objects.forEach(obj => {
        let geo;
        const sx = obj.scale.x;
        const sy = obj.scale.y;
        const sz = obj.scale.z;

         if (obj.type === 'box') {
           geo = new THREE.BoxGeometry(sx, sy, sz);
         } else if (obj.type === 'cylinder') {
           geo = new THREE.CylinderGeometry(sx / 2, sx / 2, sy, 64);
         } else {
           geo = new THREE.SphereGeometry(sx / 2, 64, 64);
         }
 
         const hasTexture = obj.texture && obj.texture !== 'none';
         const texture = hasTexture ? generateCustomTexture(obj.texture, obj.color) : null;
         if (texture) {
           texture.needsUpdate = true;
         }
 
         // Custom bump scale mapping for visual depth
         let bumpScale = 0.02;
         if (hasTexture) {
           if (['nature_mossy_stone', 'fantasy_cobble', 'city_brick'].includes(obj.texture)) {
             bumpScale = 0.035;
           } else if (['nature_grass', 'city_concrete', 'nature_wood'].includes(obj.texture)) {
             bumpScale = 0.025;
           } else if (['space_alloy', 'futuristic_carbon', 'forerunner_panel'].includes(obj.texture)) {
             bumpScale = 0.015;
           } else if (['futuristic_hex', 'synthwave_grid', 'winter_glacier_glass'].includes(obj.texture)) {
             bumpScale = 0.008;
           }
         }
 
         const mat = new THREE.MeshStandardMaterial({
           map: texture,
           bumpMap: texture || undefined,
           bumpScale: hasTexture ? bumpScale : 0,
           color: hasTexture ? new THREE.Color('#ffffff') : new THREE.Color(obj.color),
           metalness: obj.metalness,
           roughness: obj.roughness,
           opacity: obj.opacity,
           transparent: obj.transparent,
         });

        if (obj.emissive && obj.emissive !== '#000000') {
          mat.emissive = new THREE.Color(obj.emissive);
          mat.emissiveIntensity = obj.emissiveIntensity;
        }

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(obj.position.x, obj.position.y, obj.position.z);
        mesh.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        mesh.userData = { id: obj.id }; // store ID for click checks
        mesh.visible = isObjectVisible(obj.id);

        objectsGroup.add(mesh);
        meshMap.set(obj.id, mesh);
      });

      // Update outline selection helper
      if (selectedObjectId && activeTab === 'objects') {
        const selMesh = meshMap.get(selectedObjectId);
        if (selMesh) {
          selectionHelper.setFromObject(selMesh);
          selectionHelper.visible = true;
        } else {
          selectionHelper.visible = false;
        }
      } else {
        selectionHelper.visible = false;
      }

      // Rebuild Spawn Markers
      while (spawnsGroup.children.length > 0) {
        spawnsGroup.remove(spawnsGroup.children[0]);
      }

      spawnPoints.forEach((sp, idx) => {
        const marker = new THREE.Group();
        marker.position.set(sp.x, 0.9, sp.z);

        // Cylinder Body indicator
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.25, 0.25, 1.2, 16),
          new THREE.MeshStandardMaterial({ color: '#16803d', transparent: true, opacity: 0.8 })
        );
        marker.add(body);

        // Sphere head
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.3, 16, 16),
          new THREE.MeshStandardMaterial({ color: '#22c55e' })
        );
        head.position.y = 0.7;
        marker.add(head);

        // Neon outline ring if active selected spawn location
        if (selectedSpawnIdx === idx && activeTab === 'spawns') {
          const ring = new THREE.Mesh(
            new THREE.RingGeometry(0.5, 0.6, 32),
            new THREE.MeshBasicMaterial({ color: '#22d3ee', side: THREE.DoubleSide })
          );
          ring.rotation.x = Math.PI / 2;
          ring.position.y = -0.85;
          marker.add(ring);
        }

        spawnsGroup.add(marker);
      });

      // Rebuild Point Lights Bulbs Indicators
      while (lightsGroup.children.length > 0) {
        lightsGroup.remove(lightsGroup.children[0]);
      }

      pointLights.forEach((pl, idx) => {
        const point = new THREE.PointLight(pl.color, pl.intensity, pl.distance, pl.decay);
        point.position.set(pl.position.x, pl.position.y, pl.position.z);
        point.userData = { lightSourceId: pl.id };
        lightsGroup.add(point);

        // Yellow wireframe bulb indicator sphere
        const bulbGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const bulbMat = new THREE.MeshBasicMaterial({ color: pl.color, wireframe: true });
        const bulb = new THREE.Mesh(bulbGeo, bulbMat);
        bulb.position.copy(point.position);
        bulb.userData = { lightId: pl.id };
        lightsGroup.add(bulb);

        if (selectedLightId === pl.id && activeTab === 'lights') {
          const lightHelper = new THREE.PointLightHelper(point, 0.6, '#eab308');
          lightsGroup.add(lightHelper);
        }
      });

      // Auto-attach transform controls translation/rotation gizmo to selection
      if (transformControls) {
        if (selectedObjectId && activeTab === 'objects') {
          const selMesh = meshMap.get(selectedObjectId);
          if (selMesh && !isObjectLocked(selectedObjectId) && isObjectVisible(selectedObjectId)) {
            transformControls.setMode(currentTransformMode);
            transformControls.attach(selMesh);
          } else {
            transformControls.detach();
          }
        } else if (selectedLightId && activeTab === 'lights') {
          const bulbMesh = lightsGroup.children.find(c => c.userData && c.userData.lightId === selectedLightId);
          if (bulbMesh) {
            transformControls.setMode('translate'); // lights only support translation (movement)
            transformControls.attach(bulbMesh);
          } else {
            transformControls.detach();
          }
        } else {
          transformControls.detach();
        }
      }

      // Clear any pre-existing theme scenery in editor
      const oldScenery = scene.getObjectByName('synthwave_scenery');
      if (oldScenery) scene.remove(oldScenery);
      const oldRainyScenery = scene.getObjectByName('rainy_streets_scenery');
      if (oldRainyScenery) scene.remove(oldRainyScenery);
      const oldWinterScenery = scene.getObjectByName('winter_scenery');
      if (oldWinterScenery) scene.remove(oldWinterScenery);

      if (theme === 'synthwave') {
        const synthwaveGroup = new THREE.Group();
        synthwaveGroup.name = 'synthwave_scenery';

        // 1. Striped Gradient Sunset Sun Disc
        const sunCanvas = document.createElement('canvas');
        sunCanvas.width = 2048;
        sunCanvas.height = 2048;
        const sunCtx = sunCanvas.getContext('2d');
        sunCtx.scale(8, 8);
        
        const sunGrad = sunCtx.createLinearGradient(0, 25, 0, 231);
        sunGrad.addColorStop(0, '#ffe066');
        sunGrad.addColorStop(0.5, '#ff007f');
        sunGrad.addColorStop(1, '#9400d3');
        
        sunCtx.fillStyle = sunGrad;
        sunCtx.beginPath();
        sunCtx.arc(128, 128, 115, 0, Math.PI * 2);
        sunCtx.fill();

        sunCtx.fillStyle = fogColor || '#0a0518';
        for (let y = 120; y < 256; y += 9) {
          const thickness = Math.max(1, (y - 120) / 7.5);
          sunCtx.fillRect(0, y, 256, thickness);
        }

        const sunTexture = new THREE.CanvasTexture(sunCanvas);
        const sunMat = new THREE.MeshBasicMaterial({
          map: sunTexture,
          transparent: true,
          side: THREE.DoubleSide
        });
        const sunGeo = new THREE.PlaneGeometry(55, 55);
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(0, 16, -72);
        synthwaveGroup.add(sunMesh);

        // 2. Skyscrapers Skyline Silhouettes
        const cityWidths = [12, 8, 14, 10, 6, 16, 9, 11, 13, 7, 15, 10];
        const cityHeights = [18, 28, 22, 34, 15, 20, 26, 32, 19, 29, 24, 17];
        const numBuildings = cityWidths.length;
        
        for (let i = 0; i < numBuildings; i++) {
          const w = cityWidths[i];
          const h = cityHeights[i];
          const d = 6;
          const x = -48 + (i * 9) + (Math.random() - 0.5) * 1.5;
          const y = h / 2 - 2;
          const z = -60 + (Math.random() - 0.5) * 2;

          const bGeo = new THREE.BoxGeometry(w, h, d);
          
          const bCanvas = document.createElement('canvas');
          bCanvas.width = 512;
          bCanvas.height = 1024;
          const bCtx = bCanvas.getContext('2d');
          bCtx.scale(8, 8);
          bCtx.fillStyle = '#05020c';
          bCtx.fillRect(0, 0, 64, 128);
          
          bCtx.fillStyle = i % 2 === 0 ? '#06b6d4' : '#ec4899';
          for (let wy = 12; wy < 120; wy += 10) {
            for (let wx = 6; wx < 58; wx += 8) {
              if (Math.random() < 0.6) {
                bCtx.fillRect(wx, wy, 3, 5);
              }
            }
          }

          const bTexture = new THREE.CanvasTexture(bCanvas);
          const bMat = new THREE.MeshStandardMaterial({
            map: bTexture,
            roughness: 0.9,
            metalness: 0.1,
            emissive: i % 2 === 0 ? '#06b6d4' : '#ec4899',
            emissiveIntensity: 0.2
          });

          const building = new THREE.Mesh(bGeo, bMat);
          building.position.set(x, y, z);
          synthwaveGroup.add(building);
        }

        // 3. Glowing Laser Beams
        const laserColors = ['#ec4899', '#06b6d4', '#eab308'];
        for (let i = 0; i < 9; i++) {
          const lGeo = new THREE.CylinderGeometry(0.12, 0.12, 100, 6);
          const col = laserColors[i % laserColors.length];
          const lMat = new THREE.MeshBasicMaterial({
            color: col,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
          });
          const laser = new THREE.Mesh(lGeo, lMat);
          const lx = -45 + (i * 11.25);
          laser.position.set(lx, 40, -68);
          synthwaveGroup.add(laser);
        }

        // 4. Low-Poly Neon Palm Trees
        const buildSynthwavePalmTree = (leafColor, trunkColor) => {
          const treeGroup = new THREE.Group();
          const numSegments = 5;
          const trunkMat = new THREE.MeshStandardMaterial({
            color: '#08041d',
            roughness: 0.7,
            metalness: 0.8,
            emissive: trunkColor,
            emissiveIntensity: 1.5
          });

          let currentParent = treeGroup;
          for (let j = 0; j < numSegments; j++) {
            const segGeo = new THREE.CylinderGeometry(0.18 - j * 0.02, 0.23 - j * 0.02, 1.3, 8);
            const segment = new THREE.Mesh(segGeo, trunkMat);
            segment.position.y = j === 0 ? 0.65 : 1.2;
            segment.rotation.z = 0.08;
            currentParent.add(segment);
            currentParent = segment;
          }

          const leafMat = new THREE.MeshStandardMaterial({
            color: leafColor,
            emissive: leafColor,
            emissiveIntensity: 2.2,
            roughness: 0.3,
            metalness: 0.5,
            side: THREE.DoubleSide
          });

          const numLeaves = 7;
          for (let j = 0; j < numLeaves; j++) {
            const angle = (j * Math.PI * 2) / numLeaves;
            const leafGeo = new THREE.BoxGeometry(2.4, 0.06, 0.5);
            const leaf = new THREE.Mesh(leafGeo, leafMat);
            leaf.geometry.translate(1.2, 0, 0);
            leaf.position.set(0, 0.65, 0);
            leaf.rotation.y = angle;
            leaf.rotation.z = 0.22;
            currentParent.add(leaf);
          }

          return treeGroup;
        };

        const palmPositionsZ = [-16, -6, 4, 14];
        palmPositionsZ.forEach((pz, idx) => {
          const leftPalm = buildSynthwavePalmTree('#ec4899', '#06b6d4');
          leftPalm.position.set(-23.5, 0, pz);
          leftPalm.scale.set(1.1, 1.1, 1.1);
          leftPalm.rotation.y = Math.PI / 4 + idx;
          synthwaveGroup.add(leftPalm);

          const rightPalm = buildSynthwavePalmTree('#06b6d4', '#ec4899');
          rightPalm.position.set(23.5, 0, pz + 1.0);
          rightPalm.scale.set(1.1, 1.1, 1.1);
          rightPalm.rotation.y = -Math.PI / 4 + idx;
          synthwaveGroup.add(rightPalm);
        });

        scene.add(synthwaveGroup);
      }

      if (theme === 'rainy_streets') {
        const rainyGroup = new THREE.Group();
        rainyGroup.name = 'rainy_streets_scenery';

        // 1. Framing Skyscrapers Backdrop
        const buildingWidths = [14, 18, 16, 12, 20, 15, 12, 16];
        const buildingHeights = [32, 28, 42, 36, 25, 30, 48, 35];
        const buildingPositions = [
          { x: -32, z: -25 },
          { x: -32, z: 0 },
          { x: -32, z: 25 },
          { x: 32, z: -25 },
          { x: 32, z: 0 },
          { x: 32, z: 25 },
          { x: 0, z: -35 },
          { x: 15, z: -35 }
        ];

        buildingPositions.forEach((pos, idx) => {
          const w = buildingWidths[idx % buildingWidths.length];
          const h = buildingHeights[idx % buildingHeights.length];
          const d = 10;
          const bGeo = new THREE.BoxGeometry(w, h, d);
          
          const bCanvas = document.createElement('canvas');
          bCanvas.width = 512;
          bCanvas.height = 1024;
          const bCtx = bCanvas.getContext('2d');
          bCtx.scale(8, 8);
          bCtx.fillStyle = '#06080d';
          bCtx.fillRect(0, 0, 64, 128);
          
          bCtx.fillStyle = '#f97316';
          for (let wy = 10; wy < 120; wy += 12) {
            for (let wx = 6; wx < 58; wx += 8) {
              if (Math.random() < 0.25) {
                bCtx.fillRect(wx, wy, 4, 6);
              }
            }
          }
          
          const bTexture = new THREE.CanvasTexture(bCanvas);
          const bMat = new THREE.MeshStandardMaterial({
            map: bTexture,
            color: new THREE.Color('#0c0d12'),
            roughness: 0.1,
            metalness: 0.9,
            emissive: '#f97316',
            emissiveIntensity: 0.15
          });

          const building = new THREE.Mesh(bGeo, bMat);
          building.position.set(pos.x, h / 2 - 2, pos.z);
          if (pos.x < 0) building.rotation.y = 0.15;
          if (pos.x > 0) building.rotation.y = -0.15;
          
          rainyGroup.add(building);
        });

        // 2. Colossal Tech Dog Billboard on the top right
        const boardGeo = new THREE.BoxGeometry(10, 7, 0.4);
        const boardTexture = generateCustomTexture('rainy_streets_dog_billboard', '#06b6d4');
        const boardMat = new THREE.MeshBasicMaterial({
          map: boardTexture,
          transparent: true,
          side: THREE.DoubleSide
        });
        const boardMesh = new THREE.Mesh(boardGeo, boardMat);
        boardMesh.position.set(20, 15, -20);
        boardMesh.rotation.y = -Math.PI / 6;
        rainyGroup.add(boardMesh);

        // 3. Glowing Neon Green Sign on the Left Building
        const signCanvas = document.createElement('canvas');
        signCanvas.width = 1024;
        signCanvas.height = 1024;
        const sCtx = signCanvas.getContext('2d');
        sCtx.scale(8, 8);
        sCtx.fillStyle = 'rgba(0,0,0,0)';
        sCtx.clearRect(0,0,128,128);
        sCtx.strokeStyle = '#22c55e';
        sCtx.lineWidth = 8;
        sCtx.shadowColor = '#22c55e';
        sCtx.shadowBlur = 15;
        sCtx.beginPath(); sCtx.arc(44, 64, 25, 0, Math.PI * 2); sCtx.stroke();
        sCtx.beginPath(); sCtx.arc(84, 64, 25, 0, Math.PI * 2); sCtx.stroke();
        sCtx.shadowBlur = 0;
        
        const signTexture = new THREE.CanvasTexture(signCanvas);
        const signMat = new THREE.MeshBasicMaterial({
          map: signTexture,

        // 4. Low-Poly Neon Green Palm Trees next to the court
        const buildGreenPalmTree = () => {
          const treeGroup = new THREE.Group();
          const numSegments = 5;
          const trunkMat = new THREE.MeshStandardMaterial({
            color: '#090514',
            roughness: 0.8,
            metalness: 0.9,
            emissive: '#166534',
            emissiveIntensity: 0.8

          let currentParent = treeGroup;
          for (let j = 0; j < numSegments; j++) {
            const segGeo = new THREE.CylinderGeometry(0.18 - j * 0.02, 0.23 - j * 0.02, 1.3, 8);
            const segment = new THREE.Mesh(segGeo, trunkMat);
            segment.position.y = j === 0 ? 0.65 : 1.2;

            currentParent.add(segment);
