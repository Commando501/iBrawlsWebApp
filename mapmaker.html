                <button onclick="handleAssetSearch('')" class="absolute right-2.5 top-2 text-slate-500 hover:text-white bg-transparent border-none cursor-pointer">
                  <i data-lucide="x" class="w-3 h-3"></i>
                </button>
              ` : ''}
            </div>
            
            <button class="p-1.5 border border-white/10 rounded hover:bg-white/5 text-slate-400 hover:text-white transition-colors cursor-pointer" title="Settings">
              <i data-lucide="settings" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>

        <!-- Content Browser Body -->
        <div class="flex-grow flex min-h-0 bg-[#07090f]/50">
          
          <!-- Left side: Category Folders -->
          <div class="w-52 border-r border-white/5 overflow-y-auto flex flex-col p-2 gap-1 bg-[#05070c]/50 shrink-0">
            <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest px-2 py-1 select-none">All Folders</span>
            <div class="flex flex-col gap-0.5">
              ${categories.map(cat => `
                <button onclick="selectAssetCategory('${cat.id}')" 
                  class="w-full px-2.5 py-1.5 rounded text-left text-xs font-bold transition-all flex items-center justify-between cursor-pointer border ${selectedAssetCategory === cat.id ? 'bg-cyan-500/10 border-cyan-500/20 text-cyan-400 font-extrabold shadow-[0_0_8px_rgba(6,182,212,0.05)]' : 'bg-transparent border-transparent text-slate-400 hover:text-slate-200 hover:bg-white/2'}">
                  <div class="flex items-center gap-2">
                    <span class="text-sm">${cat.icon}</span>
                    <span>${cat.label}</span>
                  </div>
                  <span class="text-[9px] font-mono opacity-50 font-bold">${ASSET_LIBRARY.filter(a => a.category === cat.id).length}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <!-- Right side: Asset Cards Grid -->
          <div class="flex-grow overflow-y-auto p-4 flex flex-col gap-3 min-w-0">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-8 gap-3">
              ${filtered.length === 0 ? `
                <div class="col-span-full flex flex-col items-center justify-center py-12 text-center">
                  <i data-lucide="info" class="w-8 h-8 text-slate-600 mb-2"></i>
                  <p class="text-xs text-white/30 italic">No matching assets found.</p>
                </div>
              ` : filtered.map(asset => `
                <button onclick="handleAddObject('${asset.type}', '${asset.id}')" 
                  class="group flex flex-col items-start p-2.5 rounded-lg border bg-[#0d1220]/60 border-white/5 hover:border-cyan-500/40 hover:bg-cyan-950/20 text-left transition-all duration-200 cursor-pointer w-full shadow-lg hover:shadow-cyan-500/5 relative overflow-hidden">
                  
                  <!-- Glossy background accent -->
                  <div class="absolute inset-0 bg-gradient-to-tr from-cyan-500/0 to-cyan-500/5 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none"></div>

                  <!-- Large Icon Display Box -->
                  <div class="w-full h-20 bg-slate-950/50 border border-white/5 rounded-md flex items-center justify-center text-3xl mb-2 group-hover:bg-slate-950/70 transition-all select-none relative">
                    <span>${asset.icon}</span>
                    <span class="absolute bottom-1 right-1.5 font-mono text-[7px] text-slate-500 font-bold uppercase tracking-wider">${asset.type}</span>
                  </div>

                  <!-- Text Details -->
                  <span class="text-[10px] font-extrabold text-slate-200 group-hover:text-cyan-400 transition-colors leading-snug w-full truncate pointer-events-none">${asset.name}</span>
                  <span class="text-[8px] text-slate-500 leading-snug line-clamp-2 mt-0.5 w-full pointer-events-none">${asset.desc}</span>
                </button>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    // --- HIGH-FIDELITY MAP ASSETS PROCEDURAL MODEL PIPELINE ---
    function createHighFidelityObjectMesh(obj, three, generateCustomTexture, scaleMultiplier = 1.0) {
      const group = new three.Group();
      group.name = obj.id;

      // Base scale dimensions
      const sx = obj.scale.x * scaleMultiplier;
      const sy = obj.scale.y * scaleMultiplier;
      const sz = obj.scale.z * scaleMultiplier;

      // --- Spawn point marker: pad + post + facing arrow (oriented by rotation.y) ---
      if (obj.gameModeKind === 'spawn_point') {
        const accent = obj.team === 'red' ? '#ff3b3b' : obj.team === 'blue' ? '#3b82ff' : '#22c55e';
        // Flat circular pad on the ground
        const pad = new three.Mesh(
          new three.CylinderGeometry(0.9, 0.9, 0.08, 24),
          new three.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.5, transparent: true, opacity: 0.6 })
        );
        pad.position.y = 0.04;
        group.add(pad);
        // Standing post
        const post = new three.Mesh(
          new three.CylinderGeometry(0.12, 0.12, 1.2, 12),
          new three.MeshStandardMaterial({ color: accent, emissive: accent, emissiveIntensity: 0.3 })
        );
        post.position.y = 0.7;
        group.add(post);
        // Facing arrow: a cone pointing along local +Z, offset forward
        const arrow = new three.Mesh(
          new three.ConeGeometry(0.35, 0.9, 16),
          new three.MeshStandardMaterial({ color: '#fde047', emissive: '#f59e0b', emissiveIntensity: 0.8 })
        );
        arrow.rotation.x = Math.PI / 2;     // cone tip toward +Z
        arrow.position.set(0, 0.5, 1.1);
        group.add(arrow);
        return group;
      }

      // --- Floor tile: flat slab; texture repeat scales with footprint for crisp tiling ---
      if (obj.floorTile) {
        const TILE_UNIT = 6;
        const geo = new three.BoxGeometry(sx, Math.max(0.04, sy), sz);
        const hasTex = obj.texture && obj.texture !== 'none' && generateCustomTexture;
        const baseTex = hasTex ? generateCustomTexture(obj.texture, obj.color) : null;
        const tileTex = baseTex ? baseTex.clone() : null;
        if (tileTex) {
          tileTex.needsUpdate = true;
          tileTex.wrapS = three.RepeatWrapping;
          tileTex.wrapT = three.RepeatWrapping;
          tileTex.repeat.set(Math.max(1, sx / TILE_UNIT), Math.max(1, sz / TILE_UNIT));
        }
        const tileMat = new three.MeshStandardMaterial({
          map: tileTex,
          bumpMap: tileTex || undefined,
          bumpScale: tileTex ? 0.01 : 0,
          color: tileTex ? new three.Color('#ffffff') : new three.Color(obj.color),
          metalness: obj.metalness ?? 0.3,
          roughness: obj.roughness ?? 0.8,
          opacity: obj.opacity ?? 1,
          transparent: (obj.opacity ?? 1) < 1,
        });
        if (obj.emissive && obj.emissive !== '#000000') {
          tileMat.emissive = new three.Color(obj.emissive);
          tileMat.emissiveIntensity = obj.emissiveIntensity ?? 0.2;
        }
        const tileMesh = new three.Mesh(geo, tileMat);
        tileMesh.receiveShadow = true;
        group.add(tileMesh);
        return group;
      }

      // Set up materials
      const hasTexture = obj.texture && obj.texture !== 'none';
      const texture = (hasTexture && generateCustomTexture) ? generateCustomTexture(obj.texture, obj.color) : null;
      if (texture) {
        texture.needsUpdate = true;
      }
      
      let bumpScale = 0.02;
      if (hasTexture) {
        if (['nature_mossy_stone', 'fantasy_cobble', 'city_brick'].includes(obj.texture)) {
          bumpScale = 0.035;
        } else if (['nature_grass', 'city_concrete', 'nature_wood'].includes(obj.texture)) {
          bumpScale = 0.025;
        } else if (['space_alloy', 'futuristic_carbon', 'forerunner_panel'].includes(obj.texture)) {
          bumpScale = 0.015;
        } else if (['futuristic_hex', 'synthwave_grid', 'winter_glacier_glass'].includes(obj.texture)) {
          bumpScale = 0.008;
        }
      }

      const mat = new three.MeshStandardMaterial({
        map: texture,
        bumpMap: texture || undefined,
        bumpScale: hasTexture ? bumpScale : 0,
        color: hasTexture ? new three.Color('#ffffff') : new three.Color(obj.color),
        metalness: obj.metalness ?? 0.5,
        roughness: obj.roughness ?? 0.5,
        opacity: obj.opacity ?? 1,
        transparent: obj.transparent || false,
      });

      if (obj.emissive && obj.emissive !== '#000000') {
        mat.emissive = new three.Color(obj.emissive);
        mat.emissiveIntensity = obj.emissiveIntensity ?? 1;
      }

      // Dark accent material for metallic trims
      const accentMat = new three.MeshStandardMaterial({
        color: new three.Color('#1e293b'),
        metalness: 0.9,
        roughness: 0.2,
      });

      // Glow material
      let glowMat;
      if (obj.emissive && obj.emissive !== '#000000') {
        glowMat = new three.MeshBasicMaterial({
          color: new three.Color(obj.emissive),
          transparent: true,
          opacity: 0.8
        });
      } else {
        glowMat = new three.MeshBasicMaterial({
          color: new three.Color(obj.color || '#00ffff'),
          transparent: true,
          opacity: 0.6
        });
      }
      
      // Render based on geometry type and name clues
      const nameLower = (obj.name || '').toLowerCase();
      
      if (obj.type === 'box') {
        const isRock = ['nature_mossy_stone', 'space_meteorite'].includes(obj.texture) || 
                       nameLower.includes('rock') || nameLower.includes('boulder') || nameLower.includes('asteroid') || nameLower.includes('cluster');
        const isContainer = nameLower.includes('container') || nameLower.includes('barrier') || 
                            nameLower.includes('partition') || nameLower.includes('shield') || 
                            nameLower.includes('buffer') || nameLower.includes('freight') || nameLower.includes('wall');
        const isCrate = nameLower.includes('crate') || nameLower.includes('substation') || nameLower.includes('recharge');
        const isRamp = nameLower.includes('ramp') || nameLower.includes('wedge');
        const isArch = nameLower.includes('archway') || nameLower.includes('checkpoint') || nameLower.includes('gateway');
        const isFence = nameLower.includes('fence') || nameLower.includes('railing');
        const isPlatform = nameLower.includes('platform') || nameLower.includes('catwalk') || nameLower.includes('walkway') ||
                           nameLower.includes('conveyor') || nameLower.includes('solar') || nameLower.includes('panel') ||
                           nameLower.includes('pad') || nameLower.includes('deck');

        if (isRock) {
          // 1. HIGH-FIDELITY ASTEROID/BOULDER (LOW-POLY ORGANIC FACETED GEODESIC CLUSTER)
          const mainGeo = new three.DodecahedronGeometry(sx / 2, 1);
          
          // Distort vertices slightly to make it organic and non-spherical
          const posAttr = mainGeo.attributes.position;
          if (posAttr) {
            for (let i = 0; i < posAttr.count; i++) {
              const x = posAttr.getX(i);
              const y = posAttr.getY(i);
              const z = posAttr.getZ(i);
              posAttr.setXYZ(
                i,
                x * 1.0 + (Math.sin(y * 5) * 0.08),
                y * (sy / sx) + (Math.cos(z * 5) * 0.08),
                z * (sz / sx) + (Math.sin(x * 5) * 0.08)
              );
            }
            mainGeo.computeVertexNormals();
          }
          
          const mainMesh = new three.Mesh(mainGeo, mat);
          group.add(mainMesh);
          
          // Add 2 smaller debris boulders clustered at the base
          const d1Geo = new three.DodecahedronGeometry(sx * 0.15, 0);
          const debris1 = new three.Mesh(d1Geo, mat);
          debris1.position.set(-sx * 0.35, -sy * 0.35, sz * 0.2);
          debris1.rotation.set(Math.random(), Math.random(), Math.random());
          group.add(debris1);
          
          const d2Geo = new three.DodecahedronGeometry(sx * 0.12, 0);
          const debris2 = new three.Mesh(d2Geo, mat);
          debris2.position.set(sx * 0.3, -sy * 0.4, -sz * 0.3);
          debris2.rotation.set(Math.random(), Math.random(), Math.random());
          group.add(debris2);
          
          if (obj.texture === 'space_meteorite' && obj.emissive && obj.emissive !== '#000000') {
            const coreGeo = new three.SphereGeometry(sx * 0.2, 8, 8);
            const core = new three.Mesh(coreGeo, glowMat);
            core.position.set(0, 0, 0);
            group.add(core);
          }
          
        } else if (isContainer) {
          // 2. DETAILED HEAVY INDUSTRIAL SHIPPING CONTAINER / STRUCTURAL BARRIER
          const bodyGeo = new three.BoxGeometry(sx * 0.94, sy * 0.96, sz * 0.94);
          const body = new three.Mesh(bodyGeo, mat);
          group.add(body);
          
          const frameThickness = 0.04 * Math.min(sx, sz);
          
          // 4 Heavy vertical structural support corner pillars
          const colW = frameThickness;
          const colGeo = new three.BoxGeometry(colW, sy * 1.01, colW);
          
          const corners = [
            [-sx/2 + colW/2, -sz/2 + colW/2],
            [-sx/2 + colW/2, sz/2 - colW/2],
            [sx/2 - colW/2, -sz/2 + colW/2],
            [sx/2 - colW/2, sz/2 - colW/2]
          ];
          
          corners.forEach(([cx, cz]) => {
            const col = new three.Mesh(colGeo, accentMat);
            col.position.set(cx, 0, cz);
            group.add(col);
          });
          
          // Top and bottom protective edge rings (horizontal bars)
          const topBarGeo = new three.BoxGeometry(sx * 1.01, frameThickness, frameThickness);
          const botBarGeo = topBarGeo.clone();
          
          const barsZ = [-sz/2 + frameThickness/2, sz/2 - frameThickness/2];
          barsZ.forEach(bz => {
            const topBar = new three.Mesh(topBarGeo, accentMat);
            topBar.position.set(0, sy/2 - frameThickness/2, bz);
            group.add(topBar);
            
            const botBar = new three.Mesh(botBarGeo, accentMat);
            botBar.position.set(0, -sy/2 + frameThickness/2, bz);
            group.add(botBar);
          });
          
          // Corrugated panel ridges along the longer side
          const isXLonger = sx >= sz;
          if (isXLonger) {
            const numRibs = Math.max(3, Math.floor(sx * 1.5));
            const ribSpacing = (sx * 0.8) / (numRibs - 1 || 1);
            const ribW = 0.06;
            const ribD = 0.04;
            const ribGeo = new three.BoxGeometry(ribW, sy * 0.9, ribD);
            
            for (let i = 0; i < numRibs; i++) {
              const rx = -sx * 0.4 + i * ribSpacing;
              
              const fRib = new three.Mesh(ribGeo, accentMat);
              fRib.position.set(rx, 0, sz/2 - ribD/2);
              group.add(fRib);
              
              const bRib = new three.Mesh(ribGeo, accentMat);
              bRib.position.set(rx, 0, -sz/2 + ribD/2);
              group.add(bRib);
            }
          } else {
            const numRibs = Math.max(3, Math.floor(sz * 1.5));
            const ribSpacing = (sz * 0.8) / (numRibs - 1 || 1);
            const ribW = 0.04;
            const ribD = 0.06;
            const ribGeo = new three.BoxGeometry(ribW, sy * 0.9, ribD);
            
            for (let i = 0; i < numRibs; i++) {
              const rz = -sz * 0.4 + i * ribSpacing;
              
              const lRib = new three.Mesh(ribGeo, accentMat);
              lRib.position.set(-sx/2 + ribW/2, 0, rz);
              group.add(lRib);
              
              const rRib = new three.Mesh(ribGeo, accentMat);
              rRib.position.set(sx/2 - ribW/2, 0, rz);
              group.add(rRib);
            }
          }
          
        } else if (isCrate) {
          // 3. SCI-FI MECHANICAL TECH CRATE / RECHARGE STATION
          const coreGeo = new three.BoxGeometry(sx * 0.84, sy * 0.84, sz * 0.84);
          const core = new three.Mesh(coreGeo, mat);
          group.add(core);
          
          const frameW = 0.08 * sx;
          
          // Horizontal top/bottom structural rims
          const plateGeo = new three.BoxGeometry(sx * 0.94, frameW, sz * 0.94);
          const topPlate = new three.Mesh(plateGeo, accentMat);
          topPlate.position.set(0, sy/2 - frameW/2, 0);
          group.add(topPlate);
          
          const botPlate = new three.Mesh(plateGeo, accentMat);
          botPlate.position.set(0, -sy/2 + frameW/2, 0);
          group.add(botPlate);
          
          // Protective corner reinforcement cages
          const colGeo = new three.BoxGeometry(frameW, sy * 0.8, frameW);
          const offsets = [
            [-sx/2 + frameW/2, -sz/2 + frameW/2],
            [-sx/2 + frameW/2, sz/2 - frameW/2],
            [sx/2 - frameW/2, -sz/2 + frameW/2],
            [sx/2 - frameW/2, sz/2 - frameW/2]
          ];
          offsets.forEach(([cx, cz]) => {
            const col = new three.Mesh(colGeo, accentMat);
            col.position.set(cx, 0, cz);
            group.add(col);
          });
          
          if (obj.emissive && obj.emissive !== '#000000') {
            const glowGeo = new three.BoxGeometry(sx * 0.4, sy * 0.4, sz * 0.86);
            const glowP = new three.Mesh(glowGeo, glowMat);
            glowP.position.set(0, 0, 0);
            group.add(glowP);
          }
          
        } else if (isRamp) {
          // 4. SLOPED RAMP / WEDGE (triangular prism, high at -X sloping down to +X)
          const shape = new three.Shape();
          shape.moveTo(-sx / 2, -sy / 2);
          shape.lineTo(sx / 2, -sy / 2);
          shape.lineTo(-sx / 2, sy / 2);
          shape.lineTo(-sx / 2, -sy / 2);
          const wedgeGeo = new three.ExtrudeGeometry(shape, { depth: sz, bevelEnabled: false });
          wedgeGeo.translate(0, 0, -sz / 2);
          const wedge = new three.Mesh(wedgeGeo, mat);
          group.add(wedge);

          // Side edge trim along the sloped face
          const trimT = Math.min(sx, sy) * 0.06;
          const trimGeo = new three.BoxGeometry(Math.hypot(sx, sy), trimT, trimT);
          const angle = Math.atan2(sy, sx);
          [-sz / 2 + trimT / 2, sz / 2 - trimT / 2].forEach(tz => {
            const trim = new three.Mesh(trimGeo, accentMat);
            trim.rotation.z = angle;
            trim.position.set(0, 0, tz);
            group.add(trim);
          });

        } else if (isPlatform) {
          // 5. RAISED DECK / CATWALK / LANDING PAD (slab with raised rim border)
          const deck = new three.Mesh(new three.BoxGeometry(sx, sy, sz), mat);
          group.add(deck);

          const rimT = Math.min(sx, sz) * 0.05;
          const rimH = sy * 0.6;
          const railX = new three.BoxGeometry(sx, rimH, rimT);
          [-sz / 2 + rimT / 2, sz / 2 - rimT / 2].forEach(rz => {
            const r = new three.Mesh(railX, accentMat);
            r.position.set(0, sy / 2, rz);
            group.add(r);
          });
          const railZ = new three.BoxGeometry(rimT, rimH, sz);
          [-sx / 2 + rimT / 2, sx / 2 - rimT / 2].forEach(rx => {
            const r = new three.Mesh(railZ, accentMat);
            r.position.set(rx, sy / 2, 0);
            group.add(r);
          });

          // Optional glowing guidance strip for emissive pads/panels
          if (obj.emissive && obj.emissive !== '#000000') {
            const strip = new three.Mesh(new three.BoxGeometry(sx * 0.7, sy * 0.2, sz * 0.7), glowMat);
            strip.position.set(0, sy / 2 + 0.01, 0);
            group.add(strip);
          }

        } else if (isFence) {
          // 6. SEE-THROUGH FENCE PANEL (transparent mesh + steel frame posts & rails)
          const panel = new three.Mesh(new three.BoxGeometry(sx, sy, sz), mat);
          group.add(panel);

          const postW = Math.min(0.14, sx * 0.05);
          const frameD = Math.max(postW, sz * 1.2);
          const postGeo = new three.BoxGeometry(postW, sy * 1.05, frameD);
          [-sx / 2, 0, sx / 2].forEach(px => {
            const p = new three.Mesh(postGeo, accentMat);
            p.position.set(px, 0, 0);
            group.add(p);
          });
          const railGeo = new three.BoxGeometry(sx * 1.02, postW, frameD);
          [sy / 2 - postW / 2, -sy / 2 + postW / 2].forEach(ry => {
            const r = new three.Mesh(railGeo, accentMat);
            r.position.set(0, ry, 0);
            group.add(r);
          });

        } else if (isArch) {
          // 7. WALK-THROUGH ARCHWAY / GATE FRAME (two side pillars + top lintel)
          const legW = sx * 0.18;
          const legGeo = new three.BoxGeometry(legW, sy, sz);
          [-sx / 2 + legW / 2, sx / 2 - legW / 2].forEach(lx => {
            const leg = new three.Mesh(legGeo, mat);
            leg.position.set(lx, 0, 0);
            group.add(leg);
          });
          const lintelH = sy * 0.22;
          const lintel = new three.Mesh(new three.BoxGeometry(sx, lintelH, sz), mat);
          lintel.position.set(0, sy / 2 - lintelH / 2, 0);
          group.add(lintel);

          if (obj.emissive && obj.emissive !== '#000000') {
            const scanner = new three.Mesh(new three.BoxGeometry(sx * 0.62, lintelH * 0.35, sz * 0.55), glowMat);
            scanner.position.set(0, sy / 2 - lintelH * 1.15, 0);
            group.add(scanner);
          }

        } else {
          // 8. GENERAL BEVELED SCI-FI BOX WITH DETAILED OUTLINE PANELING
          const bodyGeo = new three.BoxGeometry(sx * 0.96, sy * 0.96, sz * 0.96);
          const body = new three.Mesh(bodyGeo, mat);
          group.add(body);
          
          const frameThickness = 0.04 * Math.min(sx, sy, sz);
          const frameGeoX = new three.BoxGeometry(sx * 1.01, frameThickness, frameThickness);
          const frameGeoY = new three.BoxGeometry(frameThickness, sy * 1.01, frameThickness);
          const frameGeoZ = new three.BoxGeometry(frameThickness, frameThickness, sz * 1.01);
          
          const edgeY = sy/2 - frameThickness/2;
          const edgeZ = sz/2 - frameThickness/2;
          const edgeX = sx/2 - frameThickness/2;
          
          [[-edgeY, -edgeZ], [-edgeY, edgeZ], [edgeY, -edgeZ], [edgeY, edgeZ]].forEach(([ey, ez]) => {
            const bar = new three.Mesh(frameGeoX, accentMat);
            bar.position.set(0, ey, ez);
            group.add(bar);
          });
          
          [[-edgeX, -edgeZ], [-edgeX, edgeZ], [edgeX, -edgeZ], [edgeX, edgeZ]].forEach(([ex, ez]) => {
            const bar = new three.Mesh(frameGeoY, accentMat);
            bar.position.set(ex, 0, ez);
            group.add(bar);
          });
        }
        
      } else if (obj.type === 'cylinder') {
        const isTree = nameLower.includes('tree') || nameLower.includes('trunk') || nameLower.includes('pine') ||
                       nameLower.includes('palm') || nameLower.includes('conifer') || nameLower.includes('bonsai');
        const isMushroom = nameLower.includes('mushroom') || nameLower.includes('toadstool');
        const isAntenna = nameLower.includes('antenna') || nameLower.includes('dish') || nameLower.includes('radar') ||
                          nameLower.includes('satellite') || nameLower.includes('uplink');
        const isBarrel = nameLower.includes('barrel') || nameLower.includes('drum') || nameLower.includes('keg');
        const isLamp = nameLower.includes('lamp') || nameLower.includes('lantern') || nameLower.includes('sign post');
        const isForerunner = ['forerunner_panel', 'forerunner_gold'].includes(obj.texture) ||
                            nameLower.includes('spire') || nameLower.includes('pylon') || nameLower.includes('beacon') || nameLower.includes('forerunner');
        const isTechColumn = nameLower.includes('pillar') || nameLower.includes('column') ||
                             nameLower.includes('anchor') || nameLower.includes('generator') ||
                             ['space_alloy', 'futuristic_hex', 'synthwave_neon_laser', 'rainy_streets_neon_glow'].includes(obj.texture);

        if (isTree) {
          // TREE: textured wood trunk + colored canopy (palm / conifer / broadleaf / dead variants)
          const isPalm = nameLower.includes('palm');
          const isDead = nameLower.includes('dead');
          const trunkR = sx * (isPalm ? 0.09 : 0.13);
          const trunkH = sy * (isPalm ? 0.78 : isDead ? 0.95 : 0.55);
          const trunk = new three.Mesh(new three.CylinderGeometry(trunkR * 0.8, trunkR * 1.25, trunkH, 10), mat);
          trunk.position.y = -sy / 2 + trunkH / 2;
          group.add(trunk);

          const canopyMat = new three.MeshStandardMaterial({ color: new three.Color(obj.color), roughness: 0.9, metalness: 0.05 });
          const crownY = -sy / 2 + trunkH;

          if (isDead) {
            const branchGeo = new three.CylinderGeometry(trunkR * 0.25, trunkR * 0.5, sy * 0.42, 6);
            [[0.6, 0.3], [-0.7, 0.5], [0.35, 0.7]].forEach(([rotZ, f], i) => {
              const b = new three.Mesh(branchGeo, mat);
              b.position.y = -sy / 2 + trunkH * f;
              b.rotation.z = rotZ;
              b.rotation.y = i * 2.1;
              group.add(b);
            });
          } else if (isPalm) {
            const frondGeo = new three.ConeGeometry(sx * 0.12, sy * 0.5, 6);
            for (let i = 0; i < 7; i++) {
              const ang = (i / 7) * Math.PI * 2;
              const frond = new three.Mesh(frondGeo, canopyMat);
              frond.position.set(Math.cos(ang) * sx * 0.22, crownY + sy * 0.12, Math.sin(ang) * sx * 0.22);
              frond.rotation.z = (Math.PI / 2.4) * Math.cos(ang);
              frond.rotation.x = (Math.PI / 2.4) * Math.sin(ang);
              group.add(frond);
            }
            const coco = new three.Mesh(new three.SphereGeometry(sx * 0.1, 8, 8), mat);
            coco.position.y = crownY;
            group.add(coco);
          } else if (nameLower.includes('pine') || nameLower.includes('conifer')) {
            for (let i = 0; i < 3; i++) {
              const f = i / 3;
              const cone = new three.Mesh(new three.ConeGeometry(sx * 0.5 * (1 - f * 0.55), sy * 0.45, 10), canopyMat);
              cone.position.y = crownY + f * sy * 0.5 + sy * 0.1;
              group.add(cone);
            }
          } else {
            const blobGeo = new three.IcosahedronGeometry(sx * 0.42, 1);
            [[0, crownY + sy * 0.28, 0], [-sx * 0.22, crownY + sy * 0.12, sx * 0.1],
             [sx * 0.22, crownY + sy * 0.14, -sx * 0.08], [0, crownY + sy * 0.05, sx * 0.2]].forEach(([px, py, pz]) => {
              const b = new three.Mesh(blobGeo, canopyMat);
              b.position.set(px, py, pz);
              group.add(b);
            });
          }

        } else if (isMushroom) {
          // MUSHROOM: pale stem + domed colored cap with spots
          const stemR = sx * 0.18;
          const stemH = sy * 0.55;
          const stemMat = new three.MeshStandardMaterial({ color: new three.Color('#f1f5f9'), roughness: 0.7, metalness: 0.05 });
          const stem = new three.Mesh(new three.CylinderGeometry(stemR * 0.85, stemR * 1.1, stemH, 12), stemMat);
          stem.position.y = -sy / 2 + stemH / 2;
          group.add(stem);

          const capR = sx * 0.5;
          const cap = new three.Mesh(new three.SphereGeometry(capR, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat);
          cap.position.y = -sy / 2 + stemH;
          cap.scale.y = 0.85;
          group.add(cap);

          const spotMat = new three.MeshStandardMaterial({ color: new three.Color('#f8fafc'), roughness: 0.6 });
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            const s = new three.Mesh(new three.SphereGeometry(capR * 0.12, 8, 8), spotMat);
            s.position.set(Math.cos(a) * capR * 0.55, -sy / 2 + stemH + capR * 0.22, Math.sin(a) * capR * 0.55);
            group.add(s);
          }

        } else if (isLamp) {
          // LAMP / SIGN POST: tapered post + emissive head + finial cap
          const postR = sx * 0.18;
          const postH = sy * 0.85;
          const post = new three.Mesh(new three.CylinderGeometry(postR, postR * 1.35, postH, 10), accentMat);
          post.position.y = -sy / 2 + postH / 2;
          group.add(post);

          const head = new three.Mesh(new three.BoxGeometry(sx * 0.55, sy * 0.22, sz * 0.55), glowMat);
          head.position.y = -sy / 2 + postH + sy * 0.08;
          group.add(head);

          const finial = new three.Mesh(new three.ConeGeometry(sx * 0.3, sy * 0.12, 8), accentMat);
          finial.position.y = head.position.y + sy * 0.17;
          group.add(finial);

        } else if (isBarrel) {
          // BARREL / DRUM: bulged body with banded hoops and lids
          const body = new three.Mesh(new three.CylinderGeometry(sx * 0.45, sx * 0.45, sy * 0.96, 20), mat);
          group.add(body);

          const ringGeo = new three.TorusGeometry(sx * 0.47, sx * 0.045, 8, 24);
          [-sy * 0.28, 0, sy * 0.28].forEach(ry => {
            const r = new three.Mesh(ringGeo, accentMat);
            r.rotation.x = Math.PI / 2;
            r.position.y = ry;
            group.add(r);
          });

          const lidGeo = new three.CylinderGeometry(sx * 0.42, sx * 0.42, sy * 0.05, 20);
          [sy / 2 - sy * 0.025, -sy / 2 + sy * 0.025].forEach(ly => {
            const l = new three.Mesh(lidGeo, accentMat);
            l.position.y = ly;
            group.add(l);
          });

        } else if (isAntenna) {
          // ANTENNA / DISH: support mast topped with a parabolic dish or a beaconed whip
          const isDish = nameLower.includes('dish') || nameLower.includes('radar') ||
                         nameLower.includes('satellite') || nameLower.includes('uplink');
          const mastR = sx * (isDish ? 0.08 : 0.06);
          const mastH = sy * (isDish ? 0.6 : 0.95);
          const mast = new three.Mesh(new three.CylinderGeometry(mastR, mastR * 1.5, mastH, 8), mat);
          mast.position.y = -sy / 2 + mastH / 2;
          group.add(mast);

          if (isDish) {
            const dish = new three.Mesh(new three.SphereGeometry(sx * 0.5, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2.6), mat);
            dish.position.y = -sy / 2 + mastH;
            dish.rotation.x = Math.PI * 0.82;
            dish.scale.set(1, 0.5, 1);
            group.add(dish);
            const horn = new three.Mesh(new three.CylinderGeometry(sx * 0.03, sx * 0.05, sy * 0.2, 8), accentMat);
            horn.position.y = -sy / 2 + mastH + sy * 0.16;
            group.add(horn);
            if (obj.emissive && obj.emissive !== '#000000') {
              const t = new three.Mesh(new three.SphereGeometry(sx * 0.05, 8, 8), glowMat);
              t.position.y = -sy / 2 + mastH + sy * 0.24;
              group.add(t);
            }
          } else {
            const crossGeo = new three.BoxGeometry(sx * 0.5, sx * 0.04, sx * 0.04);
            [0.4, 0.62, 0.82].forEach((f, i) => {
              const c = new three.Mesh(crossGeo, accentMat);
              c.position.y = -sy / 2 + mastH * f;
              c.rotation.y = i * 1.3;
              group.add(c);
            });
            const tip = new three.Mesh(new three.SphereGeometry(sx * 0.08, 10, 10), glowMat);
            tip.position.y = -sy / 2 + mastH + sx * 0.05;
            group.add(tip);
          }

        } else if (isForerunner) {
          // 1. ANCIENT FORERUNNER ANCHOR PYLON / TAPERING OCTAGONAL SPIRE
          const baseH = sy * 0.14;
          const baseGeo = new three.CylinderGeometry(sx * 0.72, sx * 0.72, baseH, 8);
          const base = new three.Mesh(baseGeo, mat);
          base.position.y = -sy/2 + baseH/2;
          group.add(base);
          
          const shaftH = sy * 0.76;
          const shaftGeo = new three.CylinderGeometry(sx * 0.32, sx * 0.58, shaftH, 8);
          const shaft = new three.Mesh(shaftGeo, mat);
          shaft.position.y = base.position.y + baseH/2 + shaftH/2;
          group.add(shaft);
          
          const ribW = 0.08 * sx;
          const ribD = 0.1 * sx;
          const ribGeo = new three.BoxGeometry(ribW, shaftH * 1.02, ribD);
          const offsets = [
            [0, -sx * 0.45],
            [0, sx * 0.45],
            [-sx * 0.45, 0],
            [sx * 0.45, 0]
          ];
          offsets.forEach(([rx, rz]) => {
            const rib = new three.Mesh(ribGeo, accentMat);
            rib.position.set(rx, shaft.position.y, rz);
            if (rx !== 0) rib.rotation.z = rx > 0 ? 0.07 : -0.07;
            if (rz !== 0) rib.rotation.x = rz > 0 ? -0.07 : 0.07;
            group.add(rib);
          });
          
          const capH = sy * 0.08;
          const capGeo = new three.CylinderGeometry(0, sx * 0.22, capH, 8);
          const cap = new three.Mesh(capGeo, glowMat);
          cap.position.y = shaft.position.y + shaftH/2 + capH * 0.7;
          group.add(cap);
          
        } else if (isTechColumn) {
          // 2. DETAILED SCI-FI CYLINDRICAL GENERATOR COLUMN / SEGMENTED GLOW PILLAR
          const collarH = sy * 0.08;
          const collarGeo = new three.CylinderGeometry(sx * 0.58, sx * 0.58, collarH, 32);
          const baseCollar = new three.Mesh(collarGeo, accentMat);
          baseCollar.position.y = -sy/2 + collarH/2;
          group.add(baseCollar);
          
          const topCollar = new three.Mesh(collarGeo, accentMat);
          topCollar.position.y = sy/2 - collarH/2;
          group.add(topCollar);
          
          const shaftH = sy * 0.8;
          const shaftGeo = new three.CylinderGeometry(sx * 0.48, sx * 0.48, shaftH, 32);
          const shaft = new three.Mesh(shaftGeo, mat);
          shaft.position.y = 0;
          group.add(shaft);
          
          const glowRingRadius = sx * 0.505;
          const ringGeo = new three.CylinderGeometry(glowRingRadius, glowRingRadius, sy * 0.04, 32);
          
          const ringPositions = [-sy * 0.22, 0, sy * 0.22];
          ringPositions.forEach(ry => {
            const ring = new three.Mesh(ringGeo, glowMat);
            ring.position.y = ry;
            group.add(ring);
          });
          
          const gasketGeo = new three.CylinderGeometry(sx * 0.495, sx * 0.495, sy * 0.02, 32);
          [-sy * 0.11, sy * 0.11].forEach(gy => {
            const gasket = new three.Mesh(gasketGeo, accentMat);
            gasket.position.y = gy;
            group.add(gasket);
          });
          
        } else {
          // 3. STYLIZED CORE CYLINDER
          const baseH = sy * 0.05;
          const baseGeo = new three.CylinderGeometry(sx * 0.52, sx * 0.52, baseH, 32);
          
          const base = new three.Mesh(baseGeo, accentMat);
          base.position.y = -sy/2 + baseH/2;
          group.add(base);
          
          const top = new three.Mesh(baseGeo, accentMat);
          top.position.y = sy/2 - baseH/2;
          group.add(top);
          
          const bodyGeo = new three.CylinderGeometry(sx * 0.48, sx * 0.48, sy * 0.9, 32);
          const body = new three.Mesh(bodyGeo, mat);
          group.add(body);
        }
        
      } else {
        const isReactor = nameLower.includes('core') || nameLower.includes('reactor') || 
                          nameLower.includes('plasma') || nameLower.includes('emitter') ||
                          ['futuristic_shield', 'synthwave_chrome'].includes(obj.texture);
        
        if (isReactor) {
          // 1. HIGH-TECH PLASMA CORE REACTOR / FLOAT EMITTER CORE (PLANETARY ORBITS)
          const coreRadius = sx * 0.35;
          const coreGeo = new three.SphereGeometry(coreRadius, 32, 32);
          const core = new three.Mesh(coreGeo, mat);
          group.add(core);
          
          const ringOuterR = sx * 0.52;
          const ringTubeR = 0.03 * sx;
          
          const ring1Geo = new three.TorusGeometry(ringOuterR, ringTubeR, 12, 48);
          const ring1 = new three.Mesh(ring1Geo, accentMat);
          ring1.rotation.y = Math.PI / 6;
          group.add(ring1);
          
          const ring2Geo = new three.TorusGeometry(ringOuterR * 1.05, ringTubeR, 12, 48);
          const ring2 = new three.Mesh(ring2Geo, accentMat);
          ring2.rotation.x = Math.PI / 2;
          ring2.rotation.y = -Math.PI / 6;
          group.add(ring2);
          
          const rodL = sx * 0.18;
          const rodGeo = new three.CylinderGeometry(0.02 * sx, 0.03 * sx, rodL, 8);
          const offsets = [
            [sx * 0.48, 0, 0, -Math.PI/2],
            [-sx * 0.48, 0, 0, Math.PI/2],
            [0, 0, sx * 0.48, 0],
            [0, 0, -sx * 0.48, Math.PI]
          ];
          
          offsets.forEach(([rx, ry, rz, rotZ]) => {
            const rodGroup = new three.Group();
            rodGroup.position.set(rx, ry, rz);
            
            const rod = new three.Mesh(rodGeo, accentMat);
            rod.rotation.z = rotZ;
            if (rz !== 0) rod.rotation.x = rz > 0 ? Math.PI/2 : -Math.PI/2;
            
            const tipGeo = new three.SphereGeometry(0.04 * sx, 8, 8);
            const tip = new three.Mesh(tipGeo, glowMat);
            tip.position.y = -rodL/2;
            rod.add(tip);
            
            rodGroup.add(rod);
            group.add(rodGroup);
          });
          
        } else {
          // 2. GEODESIC DOME WITH MULTI-FACETED GRID HIGHLIGHTS
          const bodyGeo = new three.IcosahedronGeometry(sx / 2, 2);
          const body = new three.Mesh(bodyGeo, mat);
          group.add(body);
          
          const wireGeo = new three.IcosahedronGeometry(sx * 0.505, 2);
          const wireMat = new three.MeshBasicMaterial({
            color: new three.Color(obj.color || '#00ffff'),
            wireframe: true,
            transparent: true,
            opacity: 0.18
          });
          const wire = new three.Mesh(wireGeo, wireMat);
          group.add(wire);
        }
      }

      // Traverse children to enable shadows, PBR rendering details, and link raycasting IDs
      group.traverse(child => {
        if (child instanceof three.Mesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.userData = { id: obj.id }; // Store ID directly on meshes for raycast checks!
        }
      });

      return group;
    }

    // SCENE REBUILD & GRAPHICS PIPELINE
    let meshMap = new Map();
    function rebuildScene() {
      if (!scene) return;

      if (isInitialized) {
        hasUnsavedChanges = true;
      }

      // Update Sky & Fog
      scene.background.set(fogColor);
      scene.fog.color.set(fogColor);
      scene.fog.density = fogDensity;

      // Clear old sky dome
      const oldSky = scene.getObjectByName('skybox_mesh');
      if (oldSky) scene.remove(oldSky);

      // Resolve sky texture type
      let skyType = skyboxTexture;
      if (skyType === 'matched') {
        skyType = theme || 'cyberpunk';
      }

      try {
        const skyTextureObj = getSkyboxTexture(skyType, skyboxHue, skyboxBrightness, fogColor);
        const skyGeo = new THREE.SphereGeometry(250, 32, 15);
        const skyMat = new THREE.MeshBasicMaterial({
          map: skyTextureObj,
          side: THREE.BackSide,
          fog: false,
          depthWrite: false
        });
        const skyMesh = new THREE.Mesh(skyGeo, skyMat);
        skyMesh.name = 'skybox_mesh';
        scene.add(skyMesh);
      } catch (err) {
        console.error('Failed to rebuild editor skybox:', err);
      }

      // Update base light colors & intensity
      const ambientLight = scene.children.find(c => c.isAmbientLight);
      if (ambientLight) {
        ambientLight.color.set(ambientColor);
        ambientLight.intensity = ambientIntensity;
      }

      const dirLight = scene.children.find(c => c.isDirectionalLight);
      if (dirLight) {
        dirLight.intensity = directIntensity;
        dirLight.position.set(directPosX, directPosY, directPosZ);
      }

      // Rebuild Obstacles
      while (objectsGroup.children.length > 0) {
        objectsGroup.remove(objectsGroup.children[0]);
      }
      meshMap.clear();

      objects.forEach(obj => {
        const mesh = createHighFidelityObjectMesh(obj, THREE, generateCustomTexture);
        mesh.position.set(obj.position.x, obj.position.y, obj.position.z);
        mesh.rotation.set(obj.rotation.x, obj.rotation.y, obj.rotation.z);

        mesh.userData = { id: obj.id }; // store ID for click checks
        mesh.visible = isObjectVisible(obj.id);

        objectsGroup.add(mesh);
        meshMap.set(obj.id, mesh);
      });

      // Update outline selection helper
      if (selectedObjectId && activeTab === 'objects') {
        const selMesh = meshMap.get(selectedObjectId);
        if (selMesh) {
          selectionHelper.setFromObject(selMesh);
          selectionHelper.visible = true;
        } else {
          selectionHelper.visible = false;
        }
      } else {
        selectionHelper.visible = false;
      }

      // Spawn markers are now regular objects (gameModeKind:'spawn_point') and are
      // rendered through the object loop above; the legacy spawnsGroup stays empty.
      while (spawnsGroup.children.length > 0) {
        spawnsGroup.remove(spawnsGroup.children[0]);
      }

      // Rebuild Point Lights Bulbs Indicators
      while (lightsGroup.children.length > 0) {
        lightsGroup.remove(lightsGroup.children[0]);
      }

      pointLights.forEach((pl, idx) => {
        const point = new THREE.PointLight(pl.color, pl.intensity, pl.distance, pl.decay);
        point.position.set(pl.position.x, pl.position.y, pl.position.z);
        point.userData = { lightSourceId: pl.id };
        lightsGroup.add(point);

        // Yellow wireframe bulb indicator sphere
        const bulbGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const bulbMat = new THREE.MeshBasicMaterial({ color: pl.color, wireframe: true });
        const bulb = new THREE.Mesh(bulbGeo, bulbMat);
        bulb.position.copy(point.position);
        bulb.userData = { lightId: pl.id };
        lightsGroup.add(bulb);

        if (selectedLightId === pl.id && activeTab === 'lights') {
          const lightHelper = new THREE.PointLightHelper(point, 0.6, '#eab308');
          lightsGroup.add(lightHelper);
        }
      });

      // Auto-attach transform controls translation/rotation gizmo to selection
      if (transformControls) {
        if (selectedObjectId && activeTab === 'objects') {
          const selMesh = meshMap.get(selectedObjectId);
          if (selMesh && !isObjectLocked(selectedObjectId) && isObjectVisible(selectedObjectId)) {
            transformControls.setMode(currentTransformMode);
            transformControls.attach(selMesh);
          } else {
            transformControls.detach();
          }
        } else if (selectedLightId && activeTab === 'lights') {
          const bulbMesh = lightsGroup.children.find(c => c.userData && c.userData.lightId === selectedLightId);
          if (bulbMesh) {
            transformControls.setMode('translate'); // lights only support translation (movement)
            transformControls.attach(bulbMesh);
          } else {
            transformControls.detach();
          }
        } else {
          transformControls.detach();
        }
      }

      // Clear any pre-existing theme scenery in editor
      const oldScenery = scene.getObjectByName('synthwave_scenery');
      if (oldScenery) scene.remove(oldScenery);
      const oldRainyScenery = scene.getObjectByName('rainy_streets_scenery');
      if (oldRainyScenery) scene.remove(oldRainyScenery);
      const oldWinterScenery = scene.getObjectByName('winter_scenery');
      if (oldWinterScenery) scene.remove(oldWinterScenery);

      if (theme === 'synthwave') {
        const synthwaveGroup = new THREE.Group();
        synthwaveGroup.name = 'synthwave_scenery';

        // 1. Striped Gradient Sunset Sun Disc
        const sunCanvas = document.createElement('canvas');
        sunCanvas.width = 2048;
        sunCanvas.height = 2048;
        const sunCtx = sunCanvas.getContext('2d');
        sunCtx.scale(8, 8);
        
        const sunGrad = sunCtx.createLinearGradient(0, 25, 0, 231);
        sunGrad.addColorStop(0, '#ffe066');
        sunGrad.addColorStop(0.5, '#ff007f');
        sunGrad.addColorStop(1, '#9400d3');
        
        sunCtx.fillStyle = sunGrad;
        sunCtx.beginPath();
        sunCtx.arc(128, 128, 115, 0, Math.PI * 2);
        sunCtx.fill();

        sunCtx.fillStyle = fogColor || '#0a0518';
        for (let y = 120; y < 256; y += 9) {
          const thickness = Math.max(1, (y - 120) / 7.5);
          sunCtx.fillRect(0, y, 256, thickness);
        }

        const sunTexture = new THREE.CanvasTexture(sunCanvas);
        const sunMat = new THREE.MeshBasicMaterial({
          map: sunTexture,
          transparent: true,
          side: THREE.DoubleSide
        });
        const sunGeo = new THREE.PlaneGeometry(55, 55);
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(0, 16, -72);
        synthwaveGroup.add(sunMesh);

        // 2. Skyscrapers Skyline Silhouettes
        const cityWidths = [12, 8, 14, 10, 6, 16, 9, 11, 13, 7, 15, 10];
        const cityHeights = [18, 28, 22, 34, 15, 20, 26, 32, 19, 29, 24, 17];
        const numBuildings = cityWidths.length;
        
        for (let i = 0; i < numBuildings; i++) {
          const w = cityWidths[i];
          const h = cityHeights[i];
          const d = 6;
          const x = -48 + (i * 9) + (Math.random() - 0.5) * 1.5;
          const y = h / 2 - 2;
          const z = -60 + (Math.random() - 0.5) * 2;

          const bGeo = new THREE.BoxGeometry(w, h, d);
          
          const bCanvas = document.createElement('canvas');
          bCanvas.width = 512;
          bCanvas.height = 1024;
          const bCtx = bCanvas.getContext('2d');
          bCtx.scale(8, 8);
          bCtx.fillStyle = '#05020c';
          bCtx.fillRect(0, 0, 64, 128);
          
          bCtx.fillStyle = i % 2 === 0 ? '#06b6d4' : '#ec4899';
          for (let wy = 12; wy < 120; wy += 10) {
            for (let wx = 6; wx < 58; wx += 8) {
              if (Math.random() < 0.6) {
                bCtx.fillRect(wx, wy, 3, 5);
              }
            }
          }

          const bTexture = new THREE.CanvasTexture(bCanvas);
          const bMat = new THREE.MeshStandardMaterial({
            map: bTexture,
            roughness: 0.9,
            metalness: 0.1,
            emissive: i % 2 === 0 ? '#06b6d4' : '#ec4899',
            emissiveIntensity: 0.2
          });

          const building = new THREE.Mesh(bGeo, bMat);
          building.position.set(x, y, z);
          synthwaveGroup.add(building);
        }

        // 3. Glowing Laser Beams
        const laserColors = ['#ec4899', '#06b6d4', '#eab308'];
        for (let i = 0; i < 9; i++) {
          const lGeo = new THREE.CylinderGeometry(0.12, 0.12, 100, 6);
          const col = laserColors[i % laserColors.length];
          const lMat = new THREE.MeshBasicMaterial({
            color: col,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
          });
          const laser = new THREE.Mesh(lGeo, lMat);
          const lx = -45 + (i * 11.25);
          laser.position.set(lx, 40, -68);
          synthwaveGroup.add(laser);
        }

        // 4. Low-Poly Neon Palm Trees
        const buildSynthwavePalmTree = (leafColor, trunkColor) => {
          const treeGroup = new THREE.Group();
          const numSegments = 5;
          const trunkMat = new THREE.MeshStandardMaterial({
            color: '#08041d',
            roughness: 0.7,
            metalness: 0.8,
            emissive: trunkColor,
            emissiveIntensity: 1.5
          });

          let currentParent = treeGroup;
          for (let j = 0; j < numSegments; j++) {
            const segGeo = new THREE.CylinderGeometry(0.18 - j * 0.02, 0.23 - j * 0.02, 1.3, 8);

    // DYNAMIC RADIUS UPDATE
    function updateRadius(r) {
      arenaRadius = r;
      rebuildBoundaryGrid();
      rebuildScene();
      document.getElementById('inspector-panel').querySelector('input[type="range"]').previousElementSibling.querySelector('.mapmaker-value-badge').textContent = `${r}m`;
    }

    // BOUNDARY EXTENTS (X/Z half-extents + vertical ceiling) for the XYZ dragger
    function updateBoundary(field, val) {
      if (field === 'halfX') arenaHalfX = val;
      else if (field === 'halfZ') arenaHalfZ = val;
      else if (field === 'ceiling') arenaCeiling = val;
      rebuildBoundaryGrid();
      rebuildScene();
      const input = document.querySelector(`input[oninput*="updateBoundary('${field}'"]`);
      const badge = input?.previousElementSibling?.querySelector('.mapmaker-value-badge');
      if (badge) badge.textContent = `${val}m`;
    }

      let defaultName = 'Custom Box';
      let metalness = 0.4;
      let roughness = 0.6;
      let opacity = 1;
      let transparent = false;
      let emissive = '#000000';
      let emissiveIntensity = 0;
      let isCollidable = true;
      let gameModeKind = undefined;
      let team = undefined;
      let goalPlateTeam = undefined;
      let floorTile = undefined;

      const customPreset = ASSET_LIBRARY.find(a => a.id === presetType);

      if (customPreset) {
        presetColor = customPreset.color;
        presetTexture = customPreset.texture;
        defaultScale = { ...customPreset.scale };
        defaultName = customPreset.name;
        metalness = customPreset.metalness ?? 0.4;
        roughness = customPreset.roughness ?? 0.6;
        opacity = customPreset.opacity ?? 1;
        transparent = customPreset.transparent ?? false;
        emissive = customPreset.emissive ?? '#000000';
        emissiveIntensity = customPreset.emissiveIntensity ?? 0;
        isCollidable = customPreset.isCollidable ?? true;
        gameModeKind = customPreset.gameModeKind;
        team = customPreset.team;
        goalPlateTeam = customPreset.goalPlateTeam;
        floorTile = customPreset.floorTile;
        if (!type) {
          type = customPreset.type;
        }
      } else {
        if (presetType === 'crate') {
          presetColor = '#475569';
          presetTexture = 'space_alloy';
          defaultName = 'Steel Cargo Box';
          metalness = 0.8;
          roughness = 0.2;
        } else if (presetType === 'pillar') {
          presetColor = '#0f172a';
          presetTexture = 'futuristic_hex';
          defaultScale = { x: 1.5, y: 5.0, z: 1.5 };
          defaultName = 'Glowing Core Pillar';
          metalness = 0.8;
          roughness = 0.2;
          emissive = '#06b6d4';
          emissiveIntensity = 1.5;
        } else if (presetType === 'barrier') {
          presetColor = '#ea580c';
          presetTexture = 'city_concrete';
          defaultScale = { x: 3.5, y: 1.5, z: 0.6 };
          defaultName = 'Outpost Security Gate';
          metalness = 0.8;
          roughness = 0.2;
        } else if (presetType === 'plasma') {
          presetColor = '#ec4899';
          presetTexture = 'futuristic_shield';
          defaultScale = { x: 2.5, y: 2.5, z: 2.5 };
          defaultName = 'Plasma Battery Core';
          metalness = 0.8;
          roughness = 0.2;
          emissive = '#db2777';
          emissiveIntensity = 1.5;
        }
      }

      // Floor tiles and spawn markers sit flat on the ground; props sit on their base.
      const spawnY = (gameModeKind === 'spawn_point' || floorTile) ? 0 : defaultScale.y / 2;

      const newObj = {
        id: `obj_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
        name: defaultName,
        type: type || 'box',
        position: { x: 0, y: spawnY, z: 0 },
        rotation: { x: 0, y: 0, z: 0 },
        scale: defaultScale,
        color: presetColor,
        metalness,
        roughness,
        opacity,
        transparent,
        emissive,
        emissiveIntensity,
        isCollidable,
        texture: presetTexture
      };
      if (gameModeKind) {
        newObj.gameModeKind = gameModeKind;
        if (gameModeKind === 'spawn_point') newObj.spawnYaw = 0;
      }
      if (team !== undefined) newObj.team = team;
      if (goalPlateTeam !== undefined) newObj.goalPlateTeam = goalPlateTeam;
      if (floorTile) newObj.floorTile = true;

      objects.push(newObj);
      selectedObjectId = newObj.id;
      selectedLightId = null;
      selectedSpawnIdx = null;
      showNavMeshOverlay = false;
      switchTab('objects');
    }

    function handleDuplicateObject(id) {
      const target = objects.find(o => o.id === id);
      if (!target) return;

      const duplicate = {
        ...target,
        id: `obj_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
        name: `${target.name} Copy`,
        position: { x: target.position.x + 2, y: target.position.y, z: target.position.z }
      };

      objects.push(duplicate);
      selectedObjectId = duplicate.id;
      showNavMeshOverlay = false;
      renderInspector();
    }

    function handleDeleteObject(id) {
      objects = objects.filter(o => o.id !== id);
      if (selectedObjectId === id) selectedObjectId = null;
      showNavMeshOverlay = false;
      renderInspector();
    }

    function handleUpdateObject(field, val) {
      const activeObj = objects.find(o => o.id === selectedObjectId);
      if (!activeObj) return;

      if (!activeObj.rotation) activeObj.rotation = { x: 0, y: 0, z: 0 };

      if (field === 'name') activeObj.name = val;
      else if (field === 'folderId') {
        activeObj.folderId = val === 'none' ? null : val;
        if (activeObj.folderId) {
          const folder = folders.find(f => f.id === activeObj.folderId);
          if (folder) {
            activeObj.locked = folder.locked;
            activeObj.hidden = folder.hidden;
          }
        }
        renderInspector(); // refresh tree structure in outliner!
      }
      else if (field === 'color') activeObj.color = val;
      else if (field === 'texture') activeObj.texture = val;
      else if (field === 'pos_x') activeObj.position.x = val;
      else if (field === 'pos_y') activeObj.position.y = val;
      else if (field === 'pos_z') activeObj.position.z = val;
      else if (field === 'scale_x') activeObj.scale.x = val;
      else if (field === 'scale_y') activeObj.scale.y = val;
      else if (field === 'scale_z') activeObj.scale.z = val;
      else if (field === 'rot_x') activeObj.rotation.x = val;
      else if (field === 'rot_y') {
        activeObj.rotation.y = val;
        // Keep the exported spawn facing in sync with the editor rotation.
        if (activeObj.gameModeKind === 'spawn_point') activeObj.spawnYaw = val;
      }
      else if (field === 'rot_z') activeObj.rotation.z = val;
      else if (field === 'team') {
        const t = (val === 'red' || val === 'blue') ? val : undefined;
        activeObj.team = t;
        // Goal plates carry the runtime scoring contract + team coloring.
        if (activeObj.gameModeKind === 'grifball_goal') {
          activeObj.goalPlateTeam = t;
          const accent = t === 'red' ? '#ff3b3b' : '#3b82ff';
          activeObj.color = accent;
          activeObj.emissive = accent;
          activeObj.texture = t === 'red' ? 'goal_plate_red' : 'goal_plate_blue';
        } else if (activeObj.gameModeKind === 'spawn_point') {
          const accent = t === 'red' ? '#ff3b3b' : t === 'blue' ? '#3b82ff' : '#22c55e';
          activeObj.color = accent;
          activeObj.emissive = accent;
          activeObj.name = `${teamLabel(t)} Spawn`;
        }
        renderInspector();
      }
      else if (field === 'metalness') activeObj.metalness = val;
      else if (field === 'roughness') activeObj.roughness = val;
      else if (field === 'opacity') {
        activeObj.opacity = val;
        activeObj.transparent = val < 0.98;
      }
      else if (field === 'emissive') activeObj.emissive = val;
      else if (field === 'emissiveIntensity') activeObj.emissiveIntensity = val;

      showNavMeshOverlay = false;
      rebuildScene();
      
      // Update custom badge readouts quickly
      const badge = document.querySelector(`input[oninput*="${field}"]`);
      if (badge) {
        const badgeReadout = badge.previousElementSibling?.querySelector('.mapmaker-value-badge');
        if (badgeReadout) {
          if (field.startsWith('rot')) {
            let deg = Math.round(val * (180/Math.PI));
            deg = (deg % 360 + 360) % 360;
            badgeReadout.textContent = `${deg}°`;
          }
          else if (field.startsWith('pos') || field.startsWith('scale')) badgeReadout.textContent = `${val}m`;
          else badgeReadout.textContent = val.toFixed(2);
        }
      }
    }

    function setSelectedObject(id) {
      selectedObjectId = id;
      selectedLightId = null;
      selectedSpawnIdx = null;
      rebuildScene();
      renderInspector();
    }

    // ACTIONS: POINT LIGHT SOURCE MANAGING
    function handleAddLight() {
      const newLight = {
        id: `light_${Date.now()}`,
        color: '#eab308',
        intensity: 3.0,
        distance: 15,
        decay: 1.2,
        position: { x: 0, y: 4, z: 0 }
      };
      pointLights.push(newLight);
      selectedLightId = newLight.id;
      selectedObjectId = null;
      selectedSpawnIdx = null;
      rebuildScene();
      renderInspector();
    }

    function handleDeleteLight(id) {
      pointLights = pointLights.filter(l => l.id !== id);
      if (selectedLightId === id) selectedLightId = null;
      rebuildScene();
      renderInspector();
    }

    function handleUpdateLight(field, val) {
      const activeLight = pointLights.find(l => l.id === selectedLightId);
      if (!activeLight) return;

      if (field === 'color') activeLight.color = val;
      else if (field === 'intensity') activeLight.intensity = val;
      else if (field === 'distance') activeLight.distance = val;
      else if (field === 'pos_x') activeLight.position.x = val;
      else if (field === 'pos_y') activeLight.position.y = val;
      else if (field === 'pos_z') activeLight.position.z = val;

      rebuildScene();

      if (badge) {
        const badgeReadout = badge.previousElementSibling?.querySelector('.mapmaker-value-badge');
        if (badgeReadout) {
          if (field.startsWith('pos') || field === 'distance') badgeReadout.textContent = `${val}m`;
          else badgeReadout.textContent = val.toFixed(1);
        }
      }
