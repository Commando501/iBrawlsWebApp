    function setSelectedLight(id) {
      selectedLightId = id;
      selectedObjectId = null;
      selectedSpawnIdx = null;
      rebuildScene();
      renderInspector();
    }

    // ACTIONS: SPAWN POINTS (unified into the `objects` array as game-mode objects)
    function teamLabel(team) {
      if (team === 'red') return 'Red';
      if (team === 'blue') return 'Blue';
      return 'Neutral';
    }

    // Build a spawn_point game-mode object. Flat marker; non-colliding.
    function makeSpawnObject(x, z, team, yaw) {
      const accent = team === 'red' ? '#ff3b3b' : team === 'blue' ? '#3b82ff' : '#22c55e';
      return {
        id: `obj_${Date.now()}_${Math.floor(Math.random() * 100000)}`,
        name: `${teamLabel(team)} Spawn`,
        type: 'box',
        position: { x, y: 0, z },
        rotation: { x: 0, y: yaw || 0, z: 0 },
        scale: { x: 1.2, y: 0.1, z: 1.2 },
        color: accent,
        metalness: 0.2,
        roughness: 0.6,
        opacity: 1,
        transparent: false,
        emissive: accent,
        emissiveIntensity: 0.6,
        isCollidable: false,
        texture: 'none',
        gameModeKind: 'spawn_point',
        team: team || undefined,
        spawnYaw: yaw || 0,
        locked: false,
        hidden: false,
        folderId: null
      };
    }

    // Convert legacy/exported spawnPoints[] + teamSpawns{} into spawn_point objects.
    // spawnPoints is the full set (the runtime fallback list); teamSpawns is the
    // team-grouped subset. We rebuild from spawnPoints and tag each spawn's team by
    // membership in teamSpawns, so neutral + team spawns all round-trip without loss.
    function migrateSpawnsToObjects(spawnPointsArr, teamSpawnsObj) {
      const result = [];
      const hasTeamSpawns = teamSpawnsObj && typeof teamSpawnsObj === 'object' && Object.keys(teamSpawnsObj).length;
      const teamOf = (p) => {
        if (!hasTeamSpawns) return undefined;
        for (const [team, pts] of Object.entries(teamSpawnsObj)) {
          if ((pts || []).some(q => q.x === p.x && q.z === p.z)) return team;
        }
        return undefined;
      };
      if (Array.isArray(spawnPointsArr) && spawnPointsArr.length) {
        spawnPointsArr.forEach(p => result.push(makeSpawnObject(p.x, p.z, teamOf(p), p.yaw)));
      } else if (hasTeamSpawns) {
        // No flat spawnPoints (older grifball-only maps) — use the team clusters directly.
        for (const [team, pts] of Object.entries(teamSpawnsObj)) {
          (pts || []).forEach(p => result.push(makeSpawnObject(p.x, p.z, team, p.yaw)));
        }
      }
      return result;
    }

    // Seed the default neutral spawn cluster if the scene has none yet.
    function seedDefaultSpawns() {
      if (objects.some(o => o.gameModeKind === 'spawn_point')) return;
      DEFAULT_SPAWNS.forEach(p => objects.push(makeSpawnObject(p.x, p.z, undefined, 0)));
    }

    // FOLDER AND LOCK/VISIBILITY SYSTEM STATE MUTATORS
    function isObjectLocked(objId) {
      const obj = objects.find(o => o.id === objId);
      if (!obj) return false;
      if (obj.locked) return true;
      if (obj.folderId) {
        const folder = folders.find(f => f.id === obj.folderId);
        if (folder && folder.locked) return true;
      }
      return false;
    }

    function isObjectVisible(objId) {
      const obj = objects.find(o => o.id === objId);
      if (!obj) return false;
      if (obj.hidden) return false;
      if (obj.folderId) {
        const folder = folders.find(f => f.id === obj.folderId);
        if (folder && folder.hidden) return false;
      }
      return true;
    }

    function handleAddFolder() {
      const name = prompt("Enter folder name:", "New Folder");
      if (!name || name.trim() === '') return;
      const folder = {
        id: `folder_${Date.now()}`,
        name: name.trim(),
        locked: false,
        hidden: false,
        collapsed: false
      };
      folders.push(folder);
      renderInspector();
    }

    function handleDeleteFolder(folderId) {
      // Move all nested objects to root
      objects.forEach(obj => {
        if (obj.folderId === folderId) {
          obj.folderId = null;
        }
      });
      // Filter out the folder
      folders = folders.filter(f => f.id !== folderId);
      renderInspector();
      rebuildScene();
    }

    function handleRenameFolder(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (!folder) return;
      const newName = prompt("Rename folder:", folder.name);
      if (newName && newName.trim() !== '') {
        folder.name = newName.trim();
        renderInspector();
      }
    }

    function toggleFolderCollapse(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (folder) {
        folder.collapsed = !folder.collapsed;
        renderInspector();
      }
    }

    function toggleFolderLock(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (folder) {
        folder.locked = !folder.locked;
        
        // Propagate folder locked state to nested objects
        objects.forEach(obj => {
          if (obj.folderId === folderId) {
            obj.locked = folder.locked;
          }
        });

        // If the folder is locked, and an object inside it is selected, detach transform controls
        if (folder.locked && selectedObjectId) {
          const selObj = objects.find(o => o.id === selectedObjectId);
          if (selObj && selObj.folderId === folderId) {
            if (transformControls) transformControls.detach();
          }
        }
        rebuildScene();
        renderInspector();
      }
    }

    function toggleFolderVisibility(folderId) {
      const folder = folders.find(f => f.id === folderId);
      if (folder) {
        folder.hidden = !folder.hidden;

        // Propagate folder hidden state to nested objects
        objects.forEach(obj => {
          if (obj.folderId === folderId) {
            obj.hidden = folder.hidden;
          }
        });

        // If the folder is hidden, and an object inside it is selected, deselect it
        if (folder.hidden && selectedObjectId) {
          const selObj = objects.find(o => o.id === selectedObjectId);
          if (selObj && selObj.folderId === folderId) {
            setSelectedObject(null);
          }
        }
        rebuildScene();
        renderInspector();
      }
    }

    function toggleObjectLock(objId) {
      const obj = objects.find(o => o.id === objId);
      if (obj) {
        obj.locked = !obj.locked;
        // If locked, and it is currently selected, detach transform controls
        if (obj.locked && selectedObjectId === objId) {
          if (transformControls) transformControls.detach();
        }
        rebuildScene();
        renderInspector();
      }
    }

    function toggleObjectVisibility(objId) {
      const obj = objects.find(o => o.id === objId);
      if (obj) {
        obj.hidden = !obj.hidden;
        // If hidden, and it is currently selected, deselect it
        if (obj.hidden && selectedObjectId === objId) {
          setSelectedObject(null);
        }
        rebuildScene();
        renderInspector();
      }
    }

    // HTML5 DRAG AND DROP LAYER MANAGER
    let draggedType = null;
    let draggedId = null;

    function handleDragStart(e, type, id) {
      draggedType = type;
      draggedId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      e.currentTarget.classList.add('opacity-50');
    }

    function handleDragEnd(e) {
      draggedType = null;
      draggedId = null;
      e.currentTarget.classList.remove('opacity-50');
      document.querySelectorAll('.mapmaker-drag-over').forEach(el => {
        el.classList.remove('mapmaker-drag-over');
      });
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e, type, id) {
      e.preventDefault();
      if (draggedId !== id) {
        e.currentTarget.classList.add('mapmaker-drag-over');
      }
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('mapmaker-drag-over');
    }

    function handleDrop(e, targetType, targetId) {
      e.preventDefault();
      e.stopPropagation();

      document.querySelectorAll('.mapmaker-drag-over').forEach(el => {
        el.classList.remove('mapmaker-drag-over');
      });

      if (!draggedId) return;

      if (draggedType === 'object') {
        const objIndex = objects.findIndex(o => o.id === draggedId);
        if (objIndex === -1) return;
        const draggedObj = objects[objIndex];

        if (targetType === 'folder') {
          // Drop onto a folder: nest object inside folder
          draggedObj.folderId = targetId;
          const folder = folders.find(f => f.id === targetId);
          if (folder) {
            draggedObj.locked = folder.locked;
            draggedObj.hidden = folder.hidden;
          }
          renderInspector();
          rebuildScene();
        } 
        else if (targetType === 'object') {
          // Drop onto another object: copy its folderId and insert before/after
          const targetObj = objects.find(o => o.id === targetId);
          if (!targetObj) return;

          draggedObj.folderId = targetObj.folderId;
          if (draggedObj.folderId) {
            const folder = folders.find(f => f.id === draggedObj.folderId);
            if (folder) {
              draggedObj.locked = folder.locked;
              draggedObj.hidden = folder.hidden;
            }
          }

          // Reorder in array
          objects.splice(objIndex, 1);
          const newIndex = objects.findIndex(o => o.id === targetId);
          objects.splice(newIndex, 0, draggedObj);

          renderInspector();
          rebuildScene();
        }
        else if (targetType === 'root') {
          // Drop onto root spacer: unparent the object
          draggedObj.folderId = null;
          draggedObj.locked = false;
          draggedObj.hidden = false;
          renderInspector();
          rebuildScene();
        }
      }
      else if (draggedType === 'folder') {
        if (targetType === 'folder') {
          const folderIndex = folders.findIndex(f => f.id === draggedId);
          if (folderIndex === -1) return;
          const draggedFolder = folders[folderIndex];

          folders.splice(folderIndex, 1);
          const newIndex = folders.findIndex(f => f.id === targetId);
          folders.splice(newIndex, 0, draggedFolder);

          renderInspector();
        }
        else if (targetType === 'root') {
          const folderIndex = folders.findIndex(f => f.id === draggedId);
          if (folderIndex === -1) return;
          const draggedFolder = folders[folderIndex];

          folders.splice(folderIndex, 1);
          folders.push(draggedFolder);

          renderInspector();
        }
      }
    }

    function handleLoadPremade(id) {
      isInitialized = false;
      const pm = PREMADE_MAPS.find(m => m.id === id);
      if (!pm) {
        isInitialized = true;
        return;
      }

      mapName = pm.name;
      mapAuthor = pm.author || 'System';
      mapDescription = pm.description;
      theme = pm.theme;
      mapShape = pm.mapShape || 'circle';
      arenaRadius = pm.arenaRadius;
      arenaHalfX = pm.arenaHalfExtents?.x ?? (arenaRadius * 1.2);
      arenaHalfZ = pm.arenaHalfExtents?.z ?? (arenaRadius * 0.6);
      arenaCeiling = pm.arenaCeiling ?? 12;
      skyboxHue = pm.skyboxHue ?? 280;
      skyboxBrightness = pm.skyboxBrightness ?? 5;
      skyboxTexture = pm.skyboxTexture || 'matched';
      fogColor = pm.fogColor || '#050811';
      fogDensity = pm.fogDensity ?? 0.015;

      if (pm.lighting) {
        ambientColor = pm.lighting.ambientColor || '#0a0f1d';
        ambientIntensity = pm.lighting.ambientIntensity ?? 0.85;
        directColor = pm.lighting.directColor || '#e0f2fe';
        directIntensity = pm.lighting.directIntensity ?? 2.2;
        if (pm.lighting.directPosition) {
          directPosX = pm.lighting.directPosition.x;
          directPosY = pm.lighting.directPosition.y;
          directPosZ = pm.lighting.directPosition.z;
        }
        pointLights = JSON.parse(JSON.stringify(pm.lighting.pointLights || []));
      }

      objects = JSON.parse(JSON.stringify(pm.objects || []));
      // Migrate legacy spawn data into spawn_point game-mode objects.
      objects.push(...migrateSpawnsToObjects(pm.spawnPoints, pm.teamSpawns));
      folders = [];

      // Ensure loaded objects have grouping/lock defaults
      objects.forEach(obj => {
        if (!obj.rotation) obj.rotation = { x: 0, y: 0, z: 0 };
        if (obj.rotation.x === undefined) obj.rotation.x = 0;
        if (obj.rotation.y === undefined) obj.rotation.y = 0;
        if (obj.rotation.z === undefined) obj.rotation.z = 0;
        if (obj.locked === undefined) obj.locked = false;
        if (obj.hidden === undefined) obj.hidden = false;
        if (obj.folderId === undefined) obj.folderId = null;
      });

      selectedObjectId = null;
      selectedLightId = null;
      selectedSpawnIdx = null;
      showNavMeshOverlay = false;

      rebuildBoundaryGrid();
      switchTab('scene');
      isInitialized = true;
      hasUnsavedChanges = false;
    }

    // AUTOMATED NAV MESH BAKE SPATIAL SYSTEM
    function bakeNavMesh(mapData, nodeSpacing = 0.85, spartanClearance = 0.65) {
      const nodes = new Map();
      const radiusLimit = mapData.arenaRadius;
      let nodeIdCounter = 0;

      // 1. Plot walkable grid nodes
      for (let x = -radiusLimit; x <= radiusLimit; x += nodeSpacing) {
        for (let z = -radiusLimit; z <= radiusLimit; z += nodeSpacing) {
          const radialDist = Math.sqrt(x * x + z * z);
          if (radialDist >= radiusLimit - 0.75) continue; // within arena bounds check

          // Test spatial clearance against all placed collidable objects
          let isBlocked = false;
          for (const obj of mapData.objects) {
            if (!obj.isCollidable) continue;

            const ox = obj.position.x;
            const oz = obj.position.z;
            const sx = obj.scale.x;
            const sz = obj.scale.z;

            if (obj.type === 'cylinder') {
              const radius = sx / 2 + spartanClearance;
              const xzDist = Math.sqrt((x - ox) * (x - ox) + (z - oz) * (z - oz));
              if (xzDist < radius) {
                isBlocked = true;
                break;
              }
            } else if (obj.type === 'box') {
              const halfW = sx / 2 + spartanClearance;
              const halfD = sz / 2 + spartanClearance;
              const dx = Math.abs(x - ox);
              const dz = Math.abs(z - oz);

              // Standard horizontal AABB boundary check
              if (dx < halfW && dz < halfD) {
                isBlocked = true;
                break;
              }
            }
          }

          if (!isBlocked) {
            const id = nodeIdCounter++;
            nodes.set(id, { id, x, z, neighbors: [] });
          }
        }
      }

      // 2. Connect adjacencies
      const maxConnectDist = nodeSpacing * 1.45; // allows diagonal connections
      nodes.forEach(nodeA => {
        nodes.forEach(nodeB => {
          if (nodeA.id === nodeB.id) return;
          const dist = Math.sqrt((nodeA.x - nodeB.x) * (nodeA.x - nodeB.x) + (nodeA.z - nodeB.z) * (nodeA.z - nodeB.z));
          if (dist <= maxConnectDist) {
            nodeA.neighbors.push(nodeB.id);
          }
        });
      });

      return { nodes };
    }

    function triggerBakeNavMesh() {
      const btn = document.getElementById('navmesh-btn');
      const icon = document.getElementById('bake-icon');
      
      icon.classList.add('animate-spin');
      btn.disabled = true;

      // Aesthetic baker delay!
      setTimeout(() => {
        icon.classList.remove('animate-spin');
        btn.disabled = false;

        // Clear existing mesh indicator indicators
        while (navMeshGroup.children.length > 0) {
          navMeshGroup.remove(navMeshGroup.children[0]);
        }

        const compiledMap = getCompiledMapData();
        const baked = bakeNavMesh(compiledMap, 0.85, 0.65);

        // Render beautiful green spherical nodes
        const nodeGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const nodeMat = new THREE.MeshBasicMaterial({ color: '#22c55e' });
        const lineMat = new THREE.LineBasicMaterial({ color: '#06b6d4', opacity: 0.35, transparent: true });

        const nodesMap = baked.nodes;
        nodesMap.forEach(n => {
          const mesh = new THREE.Mesh(nodeGeo, nodeMat);
          mesh.position.set(n.x, 0.05, n.z);
          navMeshGroup.add(mesh);

          n.neighbors.forEach(neighId => {
            const neigh = nodesMap.get(neighId);
            if (neigh && neigh.id > n.id) { // avoid duplicates
              const points = [
                new THREE.Vector3(n.x, 0.03, n.z),
                new THREE.Vector3(neigh.x, 0.03, neigh.z)
              ];
              const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
              const line = new THREE.Line(lineGeo, lineMat);
              navMeshGroup.add(line);
            }
          });
        });

        showNavMeshOverlay = true;
        updateNavMeshOverlayVisibility();
      }, 750);
    }

    function toggleNavMeshOverlay() {
      showNavMeshOverlay = !showNavMeshOverlay;
      updateNavMeshOverlayVisibility();
    }

    function updateNavMeshOverlayVisibility() {
      navMeshGroup.visible = showNavMeshOverlay;
      const eyeIcon = document.getElementById('nav-eye-icon');
      if (showNavMeshOverlay) {
        eyeIcon.setAttribute('data-lucide', 'eye');
        document.getElementById('toggle-nav-btn').classList.add('bg-cyan-500/10', 'border-cyan-500/30', 'text-cyan-400');
      } else {
        eyeIcon.setAttribute('data-lucide', 'eye-off');
        document.getElementById('toggle-nav-btn').classList.remove('bg-cyan-500/10', 'border-cyan-500/30', 'text-cyan-400');
      }
      lucide.createIcons();
    }

    // GET COMPILED DATA MATCHING TYPES
    function getCompiledMapData() {
      // Spawn points are authored as game-mode objects; derive the runtime
      // spawnPoints[] (all spawns) + teamSpawns{} (team-grouped) from them, and
      // keep them OUT of the exported objects[] to avoid double-representation.
      const spawnObjs = objects.filter(o => o.gameModeKind === 'spawn_point');
      const exportSpawnPoints = spawnObjs.map(o => ({
        x: o.position.x, y: 0, z: o.position.z, yaw: o.rotation?.y || 0
      }));
      const teamSpawns = {};
      spawnObjs.forEach(o => {
        if (o.team === 'red' || o.team === 'blue') {
          (teamSpawns[o.team] = teamSpawns[o.team] || []).push({
            x: o.position.x, y: 0, z: o.position.z, yaw: o.rotation?.y || 0
          });
        }
      });

      return {
        id: `map_${Date.now()}`,
        name: mapName,
        description: mapDescription,
        author: mapAuthor,
        theme,
        mapShape,
        arenaRadius,
        arenaHalfExtents: { x: arenaHalfX, z: arenaHalfZ },
        arenaCeiling,
        skyboxHue,
        skyboxBrightness,
        skyboxTexture,
        fogColor,
        fogDensity,
        spawnPoints: exportSpawnPoints,
        ...(Object.keys(teamSpawns).length ? { teamSpawns } : {}),
        folders: folders.map(f => ({
          id: f.id,
          name: f.name,
          locked: f.locked,
          hidden: f.hidden,
          collapsed: f.collapsed
        })),
        objects: objects.filter(obj => obj.gameModeKind !== 'spawn_point').map(obj => ({
          id: obj.id,
          name: obj.name,
          type: obj.type,
          position: { x: obj.position.x, y: obj.position.y, z: obj.position.z },
          rotation: { x: obj.rotation.x, y: obj.rotation.y, z: obj.rotation.z },
          scale: { x: obj.scale.x, y: obj.scale.y, z: obj.scale.z },
          color: obj.color,
          metalness: obj.metalness,
          roughness: obj.roughness,
          opacity: obj.opacity,
          transparent: obj.transparent,
          emissive: obj.emissive,
          emissiveIntensity: obj.emissiveIntensity,
          isCollidable: obj.isCollidable,
          texture: obj.texture,
          locked: obj.locked || false,
          hidden: obj.hidden || false,
          folderId: obj.folderId || null,
          ...(obj.gameModeKind ? { gameModeKind: obj.gameModeKind } : {}),
          ...(obj.team ? { team: obj.team } : {}),
          ...(obj.goalPlateTeam ? { goalPlateTeam: obj.goalPlateTeam } : {}),
          ...(obj.floorTile ? { floorTile: true } : {})
        })),
        lighting: {
          ambientColor,
          ambientIntensity,
          directColor,
          directIntensity,
          directPosition: { x: directPosX, y: directPosY, z: directPosZ },
          pointLights: pointLights.map(pl => ({
            id: pl.id,
            color: pl.color,
            intensity: pl.intensity,
            distance: pl.distance,
            decay: pl.decay,
            position: { x: pl.position.x, y: pl.position.y, z: pl.position.z }
          }))
        }
      };
    }

    // LOCAL FILES IMPORT/EXPORT IO
    function handleExportJSON() {
      const data = getCompiledMapData();
      const jsonString = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${mapName.toLowerCase().replace(/\s+/g, '_')}_map.json`;
      a.click();
      URL.revokeObjectURL(url);
      hasUnsavedChanges = false;
    }

    function handleExitEditor() {
      if (hasUnsavedChanges) {
        if (confirm("You have unsaved changes. Would you like to export/save your map before exiting?")) {
          handleExportJSON();
          setTimeout(() => {
            exitEditorDirectly();
          }, 1000);
          return;
        }
      } else {
        if (!confirm("Are you sure you want to exit the Map Maker?")) {
          return;
        }
      }
      exitEditorDirectly();
    }

    function exitEditorDirectly() {
      if (window.opener || window.history.length === 1) {
        window.close();
      } else {
        window.location.href = '/';
      }
    }

    function initEvents() {
      // 1. Raycast Click selector
      const container = document.getElementById('viewport-container');
      container.addEventListener('click', (e) => {
        // Only trigger selection click if mouse wasn't dragged (OrbitControls check)
        if (e.target.id !== 'editor-canvas') return;

        const rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        // Click on transformControls handles check to prevent accidental deselection
        if (transformControls && transformControls.visible) {
          const intersectsGizmo = raycaster.intersectObjects(transformControls.children, true);
          if (intersectsGizmo.length > 0) {
            return;
          }
        }

        // Click objects check
        const intersectsObj = raycaster.intersectObjects(objectsGroup.children, true);
        if (intersectsObj.length > 0) {
          const hitMesh = intersectsObj[0].object;
          if (hitMesh.userData && hitMesh.userData.id) {
            const objId = hitMesh.userData.id;
            if (!isObjectLocked(objId)) {
              setSelectedObject(objId);
              return;
            }
          }
        }

        // Click light source indicators check
        const intersectsLights = raycaster.intersectObjects(lightsGroup.children, true);
        if (intersectsLights.length > 0) {
          const bulb = intersectsLights[0].object;
          if (bulb.userData && bulb.userData.lightId) {
            setSelectedLight(bulb.userData.lightId);
            return;
          }
        }

        // Click empty space closes selection outline
        selectedObjectId = null;
        selectedLightId = null;
        selectedSpawnIdx = null;
        rebuildScene();
        renderInspector();
      });

      // Hotkeys for switching transform mode (Movement 'W', Rotation 'E')
      window.addEventListener('keydown', (e) => {
        const activeEl = document.activeElement;
        if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.isContentEditable)) {
          return;
        }
        
        if (e.key.toLowerCase() === 'w') {
          setTransformMode('translate');
        } else if (e.key.toLowerCase() === 'e') {
          setTransformMode('rotate');
        }
      });

      // 2. Local File imports loader
      document.getElementById('import-input').addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            isInitialized = false;
            const data = JSON.parse(event.target.result);
            if (!data.name || !data.objects) {
              alert('Invalid iBrawls map file structure.');
              isInitialized = true;
              return;
            }

            mapName = data.name;
            mapAuthor = data.author || 'Imported';
            mapDescription = data.description || '';
            theme = data.theme || 'cyberpunk';
            mapShape = data.mapShape || 'circle';
            arenaRadius = data.arenaRadius || 20;
            arenaHalfX = data.arenaHalfExtents?.x ?? (arenaRadius * 1.2);
            arenaHalfZ = data.arenaHalfExtents?.z ?? (arenaRadius * 0.6);
            arenaCeiling = data.arenaCeiling ?? 12;
            skyboxHue = data.skyboxHue ?? 280;
            skyboxBrightness = data.skyboxBrightness ?? 5;
            skyboxTexture = data.skyboxTexture || 'matched';
            fogColor = data.fogColor || '#050811';
            fogDensity = data.fogDensity ?? 0.015;

            if (data.lighting) {
              ambientColor = data.lighting.ambientColor || '#0a0f1d';
              ambientIntensity = data.lighting.ambientIntensity ?? 0.85;
              directColor = data.lighting.directColor || '#e0f2fe';
              directIntensity = data.lighting.directIntensity ?? 2.2;
              if (data.lighting.directPosition) {
                directPosX = data.lighting.directPosition.x;
                directPosY = data.lighting.directPosition.y;
                directPosZ = data.lighting.directPosition.z;
              }
              pointLights = JSON.parse(JSON.stringify(data.lighting.pointLights || []));
            }

            folders = JSON.parse(JSON.stringify(data.folders || []));
            objects = JSON.parse(JSON.stringify(data.objects || []));
            // Migrate legacy spawn data into spawn_point game-mode objects (unless the
            // import already carries spawn_point objects from a newer export).
            if (!objects.some(o => o.gameModeKind === 'spawn_point')) {
              objects.push(...migrateSpawnsToObjects(data.spawnPoints, data.teamSpawns));
            }

            // Safety fallback for older map imports missing complete rotation and new grouping fields
            objects.forEach(obj => {
              if (!obj.rotation) obj.rotation = { x: 0, y: 0, z: 0 };
              if (obj.rotation.x === undefined) obj.rotation.x = 0;
              if (obj.rotation.y === undefined) obj.rotation.y = 0;
              if (obj.rotation.z === undefined) obj.rotation.z = 0;
              if (obj.locked === undefined) obj.locked = false;
              if (obj.hidden === undefined) obj.hidden = false;
              if (obj.folderId === undefined) obj.folderId = null;
            });
            
            folders.forEach(f => {
              if (f.locked === undefined) f.locked = false;
              if (f.hidden === undefined) f.hidden = false;
              if (f.collapsed === undefined) f.collapsed = false;
            });

            selectedObjectId = null;
            selectedLightId = null;
            selectedSpawnIdx = null;
            showNavMeshOverlay = false;

            rebuildBoundaryGrid();
            switchTab('scene');
            isInitialized = true;
            hasUnsavedChanges = false;
          } catch (err) {
            alert('Failed to parse loaded JSON file.');
            isInitialized = true;
          }
        };
        reader.readAsText(file);
      });

      // 3. Handle window resizes
      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });
    }

    function setTransformMode(mode) {
      currentTransformMode = mode;
      if (transformControls) {
        transformControls.setMode(mode);
      }
      
      const translateBtn = document.getElementById('mode-translate-btn');
      const rotateBtn = document.getElementById('mode-rotate-btn');
      if (translateBtn && rotateBtn) {
        if (mode === 'translate') {
          translateBtn.className = "px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer bg-cyan-500/25 text-cyan-400 border border-cyan-500/40";
          rotateBtn.className = "px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer text-slate-400 border border-transparent hover:text-white";
        } else {
          rotateBtn.className = "px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer bg-cyan-500/25 text-cyan-400 border border-cyan-500/40";
          translateBtn.className = "px-3.5 py-2 rounded-lg font-black uppercase text-[10px] tracking-wider transition-all duration-200 flex items-center gap-1.5 cursor-pointer text-slate-400 border border-transparent hover:text-white";
        }
      }
    }

    function handleThemeChange(t) {
      theme = t;
      skyboxTexture = 'matched';
      if (t === 'nature') {
        fogColor = '#051208';
        skyboxHue = 120;
        ambientColor = '#0a1d0f';
      } else if (t === 'space') {
        fogColor = '#04070f';
        skyboxHue = 210;
        ambientColor = '#0a0d17';
      } else if (t === 'fantasy') {
        fogColor = '#090514';
        skyboxHue = 310;
        ambientColor = '#0a051d';
      } else if (t === 'hangar') {
        fogColor = '#07090d';
        skyboxHue = 35;
        ambientColor = '#111827';
      } else if (t === 'forerunner') {
        fogColor = '#1d1510';
        skyboxHue = 35;
        ambientColor = '#18120e';
        directColor = '#fef08a';
      } else if (t === 'synthwave') {
        fogColor = '#0a0518';
        skyboxHue = 310;
        ambientColor = '#0f051d';
        directColor = '#f43f5e';
      } else if (t === 'rainy_streets') {
        fogColor = '#06080c';
        skyboxHue = 210;
        skyboxBrightness = 2;
        ambientColor = '#0f1118';
        directColor = '#fed7aa';
        directIntensity = 1.5;
        fogDensity = 0.024;
      } else if (t === 'winter_rink') {
        fogColor = '#e0f2fe';
        skyboxHue = 200;
        skyboxBrightness = 15;
        ambientColor = '#f0f9ff';
        directColor = '#ffffff';
        directIntensity = 2.5;
        fogDensity = 0.02;
      } else if (t === 'grifball_stadium') {
        fogColor = '#0b0c10';
        skyboxHue = 220;
        skyboxBrightness = 4;
        ambientColor = '#1f2833';
        directColor = '#ffffff';
        directIntensity = 2.8;
        fogDensity = 0.015;
      } else {
        fogColor = '#050811';
        skyboxHue = 280;
        ambientColor = '#0a0f1d';
      }
      rebuildScene();
      renderInspector();
    }

    function handleShapeChange(s) {
      mapShape = s;
      rebuildBoundaryGrid();
      rebuildScene();
      renderInspector();
    }

    function selectAssetCategory(category) {
      selectedAssetCategory = category;
      renderInspector();
    }

    function handleAssetSearch(query) {
      assetSearchQuery = query;
      renderInspector();
      
      const searchInput = document.getElementById('asset-search');
      if (searchInput) {
        searchInput.focus();
        const val = searchInput.value;
        searchInput.value = '';
        searchInput.value = val;
      }
    }

    // PANEL RESIZERS DRAG ENGINE
    function initResizers() {
      const bottomResizer = document.getElementById('bottom-resizer');
      const bottomPanel = document.getElementById('bottom-content-browser');
      const sidebarResizer = document.getElementById('sidebar-resizer');
      const sidebarPanel = document.getElementById('right-sidebar');
      const container = document.getElementById('viewport-container');

      if (!bottomResizer || !bottomPanel || !sidebarResizer || !sidebarPanel) return;

      const minBottomHeight = 100;
      const maxBottomHeight = window.innerHeight - 150;
      const minSidebarWidth = 250;
      const maxSidebarWidth = 600;

      // 1. Bottom Content Browser Resizer (Vertical Dragging)
      bottomResizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startY = e.clientY;
        const startHeight = bottomPanel.getBoundingClientRect().height;

        document.body.style.cursor = 'ns-resize';
        document.body.style.userSelect = 'none';

        const onMouseMove = (moveEvent) => {
          const deltaY = moveEvent.clientY - startY;
          let newHeight = startHeight - deltaY;

          if (newHeight < minBottomHeight) newHeight = minBottomHeight;
          if (newHeight > maxBottomHeight) newHeight = maxBottomHeight;

          bottomPanel.style.height = `${newHeight}px`;

          // Proactively trigger Three.js canvas size update
          if (camera && renderer && container) {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
          }
        };

        const onMouseUp = () => {
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      // 2. Right Sidebar Resizer (Horizontal Dragging)
      sidebarResizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startWidth = sidebarPanel.getBoundingClientRect().width;

        document.body.style.cursor = 'ew-resize';
        document.body.style.userSelect = 'none';

        const onMouseMove = (moveEvent) => {
          const deltaX = moveEvent.clientX - startX;
          let newWidth = startWidth - deltaX;

          if (newWidth < minSidebarWidth) newWidth = minSidebarWidth;
          if (newWidth > maxSidebarWidth) newWidth = maxSidebarWidth;

          sidebarPanel.style.width = `${newWidth}px`;

          // Proactively trigger Three.js canvas size update
          if (camera && renderer && container) {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
          }
        };

        const onMouseUp = () => {
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }
  </script>
