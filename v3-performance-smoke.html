<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V3 Performance Smoke</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #071014;
        color: #eef8fb;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        background: rgb(7 16 20 / 78%);
        border: 1px solid rgb(93 214 201 / 35%);
        border-radius: 8px;
        font: 12px/1.35 "Cascadia Mono", monospace;
      }

      select {
        min-height: 32px;
        background: #12242b;
        color: #eef8fb;
        border: 1px solid #24414a;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <canvas id="smoke-canvas"></canvas>
    <div id="hud">
      <label>
        Tier
        <select id="tier">
          <option value="mobileLow">mobileLow</option>
          <option value="mobile">mobile</option>
          <option value="desktop" selected>desktop</option>
          <option value="ultra">ultra</option>
        </select>
      </label>
      <span id="summary">Preparing...</span>
    </div>
    <script type="module" src="/src/tools/v3PerformanceSmokePage.ts"></script>
  </body>
</html>
